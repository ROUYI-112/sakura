<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くちなしの花 ・ 日文講義</title>
<style>
:root{
  --pink-50:#fff6fa; --pink-100:#ffe8f1; --pink-200:#ffd3e2; --pink-300:#ffb8d2;
  --rose:#ef6e9a; --rose-deep:#d64f7e; --plum:#7c4a63; --ink:#553647; --ink-soft:#8d6c7a;
  --leaf:#8cc08c; --gold:#e3973f; --card:#ffffff; --shadow:rgba(214,110,150,.18);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:"Hiragino Maru Gothic ProN","Noto Sans TC","Noto Sans JP",system-ui,sans-serif;
  color:var(--ink); line-height:1.7; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(circle at 10% 6%,#fff0f6 0,transparent 36%),
    radial-gradient(circle at 92% 3%,#ffe9f3 0,transparent 38%),
    radial-gradient(circle at 50% 100%,#fce4ef 0,transparent 55%),
    linear-gradient(180deg,#fff8fc 0%,#fceef5 100%);
  background-attachment:fixed; min-height:100vh;
}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.petal{position:absolute;top:-40px;animation:fall linear infinite;will-change:transform;}
@keyframes fall{0%{transform:translateY(-40px) translateX(0) rotate(0);opacity:0;}
  12%{opacity:.55;}100%{transform:translateY(106vh) translateX(46px) rotate(330deg);opacity:.12;}}
@media (prefers-reduced-motion: reduce){.petal{display:none;}}

.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 18px 90px;}

header{text-align:center;padding:48px 12px 22px;}
.sakura-mark{font-size:42px;line-height:1;filter:drop-shadow(0 4px 6px var(--shadow));animation:sway 5s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
h1{font-size:clamp(32px,7vw,48px);margin:.16em 0 .1em;letter-spacing:.05em;color:var(--rose-deep);
  text-shadow:0 2px 0 #fff,0 5px 14px var(--shadow);}
.sub-jp{font-size:15px;color:var(--plum);letter-spacing:.2em;}
.sub-zh{font-size:12.5px;color:var(--ink-soft);margin-top:6px;letter-spacing:.06em;}
.teacher{display:inline-block;margin-top:14px;padding:5px 18px;border-radius:999px;
  background:var(--pink-100);color:var(--rose-deep);font-size:12.5px;border:1px solid var(--pink-200);}

/* youtube */
.video-card{background:var(--card);border-radius:24px;padding:14px;margin:6px 0 26px;
  box-shadow:0 8px 26px var(--shadow);border:1px solid var(--pink-100);}
.video-card .vtitle{font-size:13px;color:var(--rose-deep);font-weight:700;text-align:center;
  margin:2px 0 11px;letter-spacing:.04em;}
.video-card .vtitle .mk{margin:0 5px;}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;
  background:#000;box-shadow:0 3px 10px var(--shadow);}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

.day-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 32px;}
@media(max-width:580px){.day-nav{grid-template-columns:repeat(2,1fr);}}
.day-btn{position:relative;cursor:pointer;border:2px solid transparent;background:var(--card);
  border-radius:22px;padding:16px 10px 15px;box-shadow:0 5px 16px var(--shadow);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,border-color .2s;
  text-align:center;font-family:inherit;color:var(--ink);}
.day-btn:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 24px var(--shadow);}
.day-btn:focus-visible{outline:3px solid var(--rose);outline-offset:2px;}
.day-btn .flower{font-size:22px;display:block;margin-bottom:6px;transition:transform .35s;}
.day-btn:hover .flower{transform:rotate(22deg) scale(1.18);}
.day-btn .d-date{font-size:16px;font-weight:800;color:var(--rose-deep);}
.day-btn .d-title{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.day-btn .d-count{font-size:10px;color:var(--rose);margin-top:5px;opacity:.85;}
.day-btn.active{border-color:var(--rose);background:linear-gradient(180deg,#fff,var(--pink-50));}
.day-btn.active::after{content:"";position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  width:26px;height:3px;border-radius:3px;background:var(--rose);}

.lesson{background:var(--card);border-radius:30px;padding:34px 30px 40px;
  box-shadow:0 14px 46px var(--shadow);border:1px solid var(--pink-100);
  animation:pop .42s cubic-bezier(.34,1.4,.6,1);}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.99);}to{opacity:1;transform:none;}}
@media(max-width:580px){.lesson{padding:26px 17px 30px;border-radius:24px;}}

.lesson-head{display:flex;align-items:center;gap:13px;flex-wrap:wrap;}
.lesson-date{font-size:25px;font-weight:800;color:var(--rose-deep);background:var(--pink-100);
  padding:4px 18px;border-radius:999px;white-space:nowrap;}
.lesson-title{font-size:18px;color:var(--plum);font-weight:700;}
.lesson-sub{font-size:12.5px;color:var(--ink-soft);margin:10px 0 8px;letter-spacing:.02em;}
.lesson-meta{font-size:11.5px;color:var(--rose);margin:0 0 18px;padding-bottom:18px;
  border-bottom:2px dotted var(--pink-200);}

.lead{font-size:13px;color:var(--ink-soft);font-style:italic;margin:0 0 18px;
  background:var(--pink-50);padding:10px 15px;border-radius:13px;border:1px dashed var(--pink-200);}

h2.sec{font-size:18px;color:var(--rose-deep);margin:30px 0 14px;display:flex;align-items:center;
  gap:10px;font-weight:800;letter-spacing:.02em;}
h2.sec .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;font-size:13px;
  box-shadow:0 3px 8px var(--shadow);}
h2.sec:first-of-type{margin-top:6px;}
h3.subh{font-size:14.5px;color:var(--plum);margin:18px 0 9px;font-weight:700;
  padding-left:11px;border-left:4px solid var(--pink-300);}

.note{font-size:13px;color:var(--ink-soft);background:#fbf3f7;border-radius:13px;
  padding:10px 15px;margin:9px 0 13px;border:1px dashed var(--pink-200);}
.warn{font-size:13px;color:#b14a6b;background:#fff0f3;border-radius:13px;
  padding:10px 15px;margin:9px 0 13px;border:1px solid var(--pink-300);font-weight:600;}
.poem{font-size:13.5px;color:var(--plum);font-style:italic;margin:8px 0 15px;
  padding:11px 17px;background:linear-gradient(90deg,var(--pink-50),transparent);
  border-radius:13px;border-left:3px solid var(--rose);}

.ex,.line{padding:10px 15px;border-radius:15px;margin:8px 0;background:var(--pink-50);
  border:1px solid #fdeaf1;transition:background .15s,transform .12s;}
.ex:hover,.line:hover{background:var(--pink-100);transform:translateX(3px);}
.ex .jp,.line .jp{font-size:16.5px;font-weight:600;color:var(--ink);letter-spacing:.01em;}
.ex .jp .mk,.line .jp .mk{font-size:12px;margin-right:3px;}
.ex .kana{font-size:12.5px;color:var(--rose);margin-top:3px;letter-spacing:.04em;}
.ex .kana::before{content:"ふりがな ";font-size:9px;color:var(--pink-300);letter-spacing:.1em;}
.ex .zh{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.ex .zh::before{content:"— ";color:var(--pink-300);}
.line .kana-inline{font-size:12px;color:var(--rose);}

.tbl-wrap{overflow-x:auto;margin:11px 0 17px;border-radius:17px;box-shadow:0 3px 12px var(--shadow);}
table{border-collapse:collapse;width:100%;min-width:320px;background:#fff;font-size:13.5px;}
thead th{background:linear-gradient(180deg,var(--pink-200),var(--pink-100));color:var(--rose-deep);
  font-weight:700;padding:10px 13px;text-align:left;white-space:nowrap;border-bottom:2px solid var(--pink-300);}
tbody td{padding:9px 13px;border-bottom:1px solid var(--pink-50);color:var(--ink);}
tbody tr:nth-child(even){background:var(--pink-50);}
tbody tr:hover{background:var(--pink-100);}
tbody tr:last-child td{border-bottom:none;}

footer{text-align:center;margin-top:36px;color:var(--ink-soft);font-size:11.5px;letter-spacing:.05em;}
footer .f-flower{font-size:18px;display:block;margin-bottom:7px;}

.scroll-top{position:fixed;right:18px;bottom:18px;z-index:5;width:48px;height:48px;border-radius:50%;
  border:none;cursor:pointer;background:var(--rose);color:#fff;font-size:20px;box-shadow:0 6px 16px var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .2s;}
.scroll-top.show{opacity:1;pointer-events:auto;}
.scroll-top:hover{transform:translateY(-3px) scale(1.08);}

/* lyrics view */
.lyric-credit{font-size:12px;color:var(--ink-soft);text-align:center;margin:2px 0 4px;}
.lyric-meta{font-size:11px;color:var(--rose);text-align:center;margin:0 0 20px;padding-bottom:18px;
  border-bottom:2px dotted var(--pink-200);}
.verse{margin:0 0 26px;}
.verse-no{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:800;
  color:var(--rose-deep);background:var(--pink-100);padding:4px 16px;border-radius:999px;margin-bottom:12px;}
.verse-no::before{content:"🌸";font-size:13px;}
.lrow{padding:11px 16px;border-radius:15px;margin:7px 0;background:var(--pink-50);
  border:1px solid #fdeaf1;transition:background .15s;}
.lrow:hover{background:var(--pink-100);}
.lrow.refrain{background:linear-gradient(100deg,#fff4f9,#ffe9f2);border:1px solid var(--pink-200);}
.lrow .l-kana{font-size:11.5px;color:var(--rose);letter-spacing:.05em;margin-bottom:1px;}
.lrow .l-jp{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:.02em;}
.lrow.refrain .l-jp{color:var(--rose-deep);}
.lrow .l-zh{font-size:13px;color:var(--ink-soft);margin-top:3px;}
.lrow .l-zh::before{content:"— ";color:var(--pink-300);}
.lyric-foot{text-align:center;font-size:12px;color:var(--plum);font-style:italic;
  margin-top:8px;padding:12px;background:var(--pink-50);border-radius:14px;}

/* search */
.search-box{position:relative;margin:0 0 22px;}
.search-input{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  padding:14px 46px 14px 46px;border-radius:999px;border:2px solid var(--pink-200);
  background:var(--card);box-shadow:0 4px 14px var(--shadow);outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--rose);}
.search-input::placeholder{color:var(--ink-soft);}
.search-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:17px;pointer-events:none;}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;
  border:none;border-radius:50%;background:var(--pink-100);color:var(--rose-deep);cursor:pointer;
  font-size:15px;display:none;align-items:center;justify-content:center;}
.search-clear.show{display:flex;}
.search-hint{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:8px;}

.results-summary{font-size:13px;color:var(--rose-deep);font-weight:700;margin:0 0 16px;
  padding-bottom:14px;border-bottom:2px dotted var(--pink-200);}
.result-group{margin-bottom:22px;}
.result-day{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));padding:4px 15px;border-radius:999px;
  margin-bottom:10px;cursor:pointer;border:none;font-family:inherit;}
.result-day:hover{filter:brightness(1.05);}
.hl-mark{background:#ffe27a;color:#7a5500;border-radius:4px;padding:0 2px;font-weight:700;}
.no-result{text-align:center;color:var(--ink-soft);font-size:14px;padding:30px 10px;}
.no-result .big{font-size:34px;display:block;margin-bottom:10px;}

</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="sakura-mark">🌸</div>
    <h1>くちなしの花</h1>
    <div class="sub-jp">梔子花　日文講義</div>
    <div class="sub-zh">渡哲也　演歌教材 ・ 依日期整理（新 → 舊）</div>
    <div class="teacher">張正修 老師　授課筆記</div>
  </header>
  <div class="video-card">
    <div class="vtitle"><span class="mk">🎵</span>くちなしの花 ・ 渡哲也<span class="mk">🎵</span></div>
    <div class="video-frame">
      <iframe src="https://www.youtube-nocookie.com/embed/VFHFakdCbuI?rel=0"
        title="くちなしの花 渡哲也"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen loading="lazy"></iframe>
    </div>
  </div>
  <nav class="day-nav" id="dayNav" aria-label="上課日期"></nav>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="search" autocomplete="off"
      placeholder="搜尋日文、平假名或中文…（例：困らせる、ほど、海嘯）">
    <button class="search-clear" id="searchClear" aria-label="清除">✕</button>
  </div>
  <main class="lesson" id="lesson" tabindex="-1"></main>
  <footer><span class="f-flower">🌸 🌷 🌸</span>くちなしの花 ・ 日文講義　|　全 8 堂課</footer>
</div>
<button class="scroll-top" id="scrollTop" aria-label="回到頂部">↑</button>

<script>
const DATA = [{"date": "6/25 ・ 6/18", "title": "見たい・困らせる・みたい", "subtitle": "見る／見たい・困る／困らせる・我儘・〜みたい・締め付ける", "sections": [{"t": "lead", "text": "6/25 與 6/18 為同一範圍，以下逐句對照課堂記錄。"}, {"t": "h", "text": "一、見る／見たい（想看）"}, {"t": "note", "text": "見る（看）→ 〜が見たい（想看…）。注意發音與後面「みたい（像…）」相同，但意思不同。"}, {"t": "ex", "jp": "私は映画を見る。", "kana": "わたしはえいがをみる。", "zh": "我看電影。"}, {"t": "ex", "jp": "私は映画が見たい。", "kana": "わたしはえいががみたい。", "zh": "我想看電影。"}, {"t": "ex", "jp": "私は公園が見たい。", "kana": "わたしはこうえんがみたい。", "zh": "我想看公園。"}, {"t": "line", "jp": "映画が見たい／男見たい／女見たい", "kana": "えいががみたい／おとこみたい／おんなみたい"}, {"t": "note", "text": "文法：N が見たい＝想看 N（注意助詞用「が」，不是「を」）。"}, {"t": "h", "text": "二、〜みたい（像…）名詞＋みたい"}, {"t": "note", "text": "名詞＋みたい，意為「像…」。"}, {"t": "ex", "jp": "彼は子供みたいだ。", "kana": "かれはこどもみたいだ。", "zh": "他像個孩子。"}, {"t": "ex", "jp": "彼は子供みたいです。", "kana": "かれはこどもみたいです。", "zh": "他像個孩子。（禮貌）"}, {"t": "ex", "jp": "彼は先生みたいです。", "kana": "かれはせんせいみたいです。", "zh": "他像個老師。"}, {"t": "ex", "jp": "彼は木村拓哉みたいだ。", "kana": "かれはきむらたくやみたいだ。", "zh": "他像木村拓哉。"}, {"t": "sub", "text": "各種職業／對象 ＋ みたい"}, {"t": "line", "jp": "子供みたい／先生みたい／女みたい", "kana": "こどもみたい／せんせいみたい／おんなみたい"}, {"t": "line", "jp": "やくざみたい／俳優みたい", "kana": "やくざみたい／はいゆうみたい"}, {"t": "line", "jp": "警察みたい／踊り子みたい", "kana": "けいさつみたい／おどりこみたい"}, {"t": "line", "jp": "公務員みたい／学生みたい", "kana": "こうむいんみたい／がくせいみたい"}, {"t": "line", "jp": "店員みたい／太陽みたい", "kana": "てんいんみたい／たいようみたい"}, {"t": "note", "text": "踊る（おどる，跳舞）→ 踊り子（おどりこ，舞者）。"}, {"t": "h", "text": "三、〜みたいな ＋ 名詞（連体法）"}, {"t": "ex", "jp": "子供みたいな張さん。", "kana": "こどもみたいなちょうさん。", "zh": "像孩子一樣的張先生。"}, {"t": "ex", "jp": "彼女みたいな先生。", "kana": "かのじょみたいなせんせい。", "zh": "像她一樣的老師。"}, {"t": "ex", "jp": "太陽みたいな月。", "kana": "たいようみたいなつき。", "zh": "像太陽一樣的月亮。"}, {"t": "ex", "jp": "総統府みたいなビル。", "kana": "そうとうふみたいなビル。", "zh": "像總統府一樣的大樓。"}, {"t": "ex", "jp": "総統府みたいな建物。", "kana": "そうとうふみたいなたてもの。", "zh": "像總統府一樣的建築。"}, {"t": "ex", "jp": "掌みたいな手の平。", "kana": "てのひらみたいなてのひら。", "zh": "像手掌一樣的掌。"}, {"t": "ex", "jp": "太陽みたいな笑顔。", "kana": "たいようみたいなえがお。", "zh": "像太陽一樣的笑容。"}, {"t": "ex", "jp": "酒みたいな飲み物。", "kana": "さけみたいなのみもの。", "zh": "像酒一樣的飲料。"}, {"t": "ex", "jp": "子供みたいな先生。", "kana": "こどもみたいなせんせい。", "zh": "像孩子一樣的老師。"}, {"t": "h", "text": "四、〜みたいに ＋ 形容詞・動詞（副詞法）"}, {"t": "note", "text": "みたいに ＋ 形容詞／形容動詞／動詞。用法分：終止法・連体法・副詞法。"}, {"t": "ex", "jp": "太陽みたいに明るい。", "kana": "たいようみたいにあかるい。", "zh": "像太陽一樣明亮。"}, {"t": "ex", "jp": "鳥が鴎みたいに飛ぶ。", "kana": "とりがかもめみたいにとぶ。", "zh": "鳥像海鷗一樣飛。"}, {"t": "ex", "jp": "彼は子供みたいに泣いている。", "kana": "かれはこどもみたいにないている。", "zh": "他像孩子一樣地哭著。"}, {"t": "ex", "jp": "彼は日本人みたいに日本語を話している。", "kana": "かれはにほんじんみたいににほんごをはなしている。", "zh": "他像日本人一樣地說著日語。"}, {"t": "ex", "jp": "彼女は俳優みたいに綺麗です。", "kana": "かのじょははいゆうみたいにきれいです。", "zh": "她像演員一樣漂亮。"}, {"t": "note", "text": "鳥が飛ぶ（とりがとぶ）／鴎（かもめ，海鷗）／泣く（なく）／話す（はなす）。"}, {"t": "table", "head": ["接續", "例句", "用法"], "rows": [["N みたいだ", "彼は子供みたいだ", "終止法：句尾「像 N 一樣」"], ["N みたいな N", "子供みたいな先生", "連体法：修飾名詞"], ["N みたいに ＋ 形容詞", "太陽みたいに明るい", "副詞法：像…一樣明亮"], ["N みたいに ＋ 形容動詞", "俳優みたいに綺麗", "副詞法：像…一樣漂亮"], ["N みたいに ＋ 動詞", "子供みたいに泣く", "副詞法：像…一樣哭"]]}, {"t": "h", "text": "五、子供みたいなあの日のお前（歌詞拆解）"}, {"t": "line", "jp": "子供みたいなお前", "kana": "こどもみたいなおまえ"}, {"t": "line", "jp": "あの日、お前は子供みたいだ", "kana": "あのひ、おまえはこどもみたいだ"}, {"t": "line", "jp": "あの日、子供みたいなお前", "kana": "あのひ、こどもみたいなおまえ"}, {"t": "ex", "jp": "子供みたいなあの日のお前。", "kana": "こどもみたいなあのひのおまえ。", "zh": "像孩子一樣的、那天的你。"}, {"t": "h", "text": "六、困る／困らせる"}, {"t": "note", "text": "困る（こまる，自動詞）＝自己困擾；困らせる（こまらせる，使役）＝讓別人困擾。"}, {"t": "ex", "jp": "母を困らせた。", "kana": "ははをこまらせた。", "zh": "讓媽媽困擾了。"}, {"t": "ex", "jp": "我儘言ってはあなたを困らせた。", "kana": "わがままいってはあなたをこまらせた。", "zh": "老是任性，讓你困擾了。"}, {"t": "note", "text": "困らせる（基本形）／困らせた（過去）／言ったら（如果說）。"}, {"t": "h", "text": "七、締め付ける（揪緊、壓迫）"}, {"t": "note", "text": "締める（しめる）＋ 付ける（つける）→ 締め付ける。"}, {"t": "ex", "jp": "両手で相手を締め付ける。", "kana": "りょうてであいてをしめつける。", "zh": "用兩手勒緊對方。"}, {"t": "ex", "jp": "ネクタイを締め付ける。", "kana": "ネクタイをしめつける。", "zh": "勒緊領帶。"}, {"t": "ex", "jp": "胸を締め付けられるみたいだ。", "kana": "むねをしめつけられるみたいだ。", "zh": "像被揪緊胸口一樣。"}, {"t": "h", "text": "八、本課核心句"}, {"t": "note", "text": "いま（今）／でも／別れる（わかれる）。"}, {"t": "ex", "jp": "山梔子の雨の別れは今でも心を締め付ける。", "kana": "くちなしのあめのわかれはいまでもこころをしめつける。", "zh": "梔子花雨中的離別，至今仍揪緊我的心。"}]}, {"date": "6/11", "title": "困らせる・ては・まま", "subtitle": "困る／困らせる・我儘・〜ては・まま・黙る／駄目・歌詞抒情句", "sections": [{"t": "h", "text": "一、困る／困らせる"}, {"t": "table", "head": ["日文", "平假名", "詞性", "中文"], "rows": [["困る", "こまる", "自動詞", "自己覺得困擾、為難"], ["困らせる", "こまらせる", "使役形", "讓別人困擾、使人為難"]]}, {"t": "sub", "text": "A. 困る：自己困擾"}, {"t": "ex", "jp": "困る。", "kana": "こまる。", "zh": "我很困擾。"}, {"t": "ex", "jp": "ああ、困った。", "kana": "ああ、こまった。", "zh": "啊，真傷腦筋。"}, {"t": "ex", "jp": "歯痛で困る。", "kana": "はいたでこまる。", "zh": "因為牙痛而困擾。"}, {"t": "ex", "jp": "歯痛で困っている。", "kana": "はいたでこまっている。", "zh": "正在因牙痛而困擾。"}, {"t": "ex", "jp": "お金がなくて困っている。", "kana": "おかねがなくてこまっている。", "zh": "因為沒有錢而困擾。"}, {"t": "ex", "jp": "車の音で困った。", "kana": "くるまのおとでこまった。", "zh": "因為車子的聲音而困擾。"}, {"t": "sub", "text": "B. 困らせる：讓別人困擾（人を困らせる）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["母を困らせる", "ははをこまらせる", "讓媽媽困擾"], ["母を困らせた", "ははをこまらせた", "讓媽媽困擾了"], ["長男を困らせた", "ちょうなんをこまらせた", "讓長男困擾了"], ["校長を困らせた", "こうちょうをこまらせた", "讓校長困擾了"], ["課長を困らせた", "かちょうをこまらせた", "讓課長困擾了"], ["部長を困らせた", "ぶちょうをこまらせた", "讓部長困擾了"], ["社長を困らせた", "しゃちょうをこまらせた", "讓社長困擾了"], ["彼女を困らせた", "かのじょをこまらせた", "讓她／女朋友困擾了"], ["娘を困らせた", "むすめをこまらせた", "讓女兒困擾了"], ["息子を困らせた", "むすこをこまらせた", "讓兒子困擾了"], ["弟を困らせた", "おとうとをこまらせた", "讓弟弟困擾了"], ["マネージャーを困らせた", "マネージャーをこまらせた", "讓經理困擾了"]]}, {"t": "h", "text": "二、我儘（わがまま）任性"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["我儘", "わがまま", "任性"], ["我儘な人", "わがままなひと", "任性的人"], ["我儘な子供", "わがままなこども", "任性的孩子"], ["我儘を言う", "わがままをいう", "說任性的話、提出任性要求"], ["我儘を通す", "わがままをとおす", "任性到底、堅持自己的任性"]]}, {"t": "ex", "jp": "彼は我儘な人だ。", "kana": "かれはわがままなひとだ。", "zh": "他是任性的人。"}, {"t": "ex", "jp": "子供が我儘を言って困る。", "kana": "こどもがわがままをいってこまる。", "zh": "孩子說任性的話，讓人困擾。"}, {"t": "ex", "jp": "彼女は最後まで我儘を通した。", "kana": "かのじょはさいごまでわがままをとおした。", "zh": "她到最後都堅持自己的任性。"}, {"t": "h", "text": "三、我儘言っては困らせた（Vては＋不好的結果）"}, {"t": "table", "head": ["感覺", "說明"], "rows": [["反覆", "每次這樣做，就造成某種結果"], ["不好的假設", "要是這樣做，就糟了／就麻煩了"]]}, {"t": "ex", "jp": "我儘言っては困らせた。", "kana": "わがままいってはこまらせた。", "zh": "總是說任性的話，讓人困擾。"}, {"t": "ex", "jp": "私は我儘言っては彼女を困らせた。", "kana": "わたしはわがままいってはかのじょをこまらせた。", "zh": "我總是說任性的話，讓她困擾。"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["我儘を言ったら困る", "わがままをいったらこまる", "如果說任性的話，會困擾"], ["我儘言っては困らせた", "わがままいってはこまらせた", "一再說任性的話，讓人困擾"]]}, {"t": "h", "text": "四、〜ては／たら／ば／と／なら 比較"}, {"t": "sub", "text": "A. と（一旦…自然如此）"}, {"t": "ex", "jp": "そう食べると困るよ。", "kana": "そうたべるとこまるよ。", "zh": "你那樣吃的話，會讓人困擾喔。"}, {"t": "sub", "text": "B. たら（假設）"}, {"t": "ex", "jp": "雨が降ったら困る。", "kana": "あめがふったらこまる。", "zh": "如果下雨，就麻煩了。"}, {"t": "sub", "text": "C. ば（文法書式「如果A就B」）"}, {"t": "ex", "jp": "雨が降れば困る。", "kana": "あめがふればこまる。", "zh": "如果下雨的話，就麻煩了。"}, {"t": "sub", "text": "D. なら（針對此情況判斷）"}, {"t": "ex", "jp": "雨なら困る。", "kana": "あめならこまる。", "zh": "如果是下雨這種情況，就麻煩了。"}, {"t": "sub", "text": "E. ては（要是…可就糟了／每次都…）"}, {"t": "ex", "jp": "雨が降っては困る。", "kana": "あめがふってはこまる。", "zh": "要是下雨可就麻煩了。"}, {"t": "ex", "jp": "黙っては駄目です。", "kana": "だまってはだめです。", "zh": "不可以沉默不說。"}, {"t": "ex", "jp": "そんなことがあっては大変だ。", "kana": "そんなことがあってはたいへんだ。", "zh": "要是有那種事就糟了。"}, {"t": "h", "text": "五、まま／儘（保持原樣）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["そのまま", "そのまま", "就那樣、照原樣"], ["このまま", "このまま", "就這樣"], ["昔の儘", "むかしのまま", "和以前一樣"], ["Vたまま", "Vたまま", "做了某動作後，狀態保持著"]]}, {"t": "ex", "jp": "そのままにして。", "kana": "そのままにして。", "zh": "就那樣放著。"}, {"t": "ex", "jp": "そのままにしておいて。", "kana": "そのままにしておいて。", "zh": "就那樣先放著，不要動。"}, {"t": "ex", "jp": "そのままにして置いてください。", "kana": "そのままにしておいてください。", "zh": "請保持原樣放著。"}, {"t": "ex", "jp": "窓を開けた儘、眠った。", "kana": "まどをあけたまま、ねむった。", "zh": "窗戶開著，就睡著了。"}, {"t": "ex", "jp": "窓を開けたまま寝た。", "kana": "まどをあけたままねた。", "zh": "窗戶開著就睡了。"}, {"t": "ex", "jp": "昔の儘の姿。", "kana": "むかしのままのすがた。", "zh": "一如往昔的樣子。"}, {"t": "h", "text": "六、黙る／駄目"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["黙る", "だまる", "沉默、閉嘴"], ["黙って", "だまって", "沉默地、不說話地"], ["駄目", "だめ", "不行、不可以"], ["大変", "たいへん", "糟糕、不得了、辛苦"]]}, {"t": "ex", "jp": "黙っては駄目です。", "kana": "だまってはだめです。", "zh": "沉默不說是不行的。"}, {"t": "ex", "jp": "そんなことがあっては大変だ。", "kana": "そんなことがあってはたいへんだ。", "zh": "要是發生那種事就糟了。"}, {"t": "h", "text": "七、歌詞抒情句"}, {"t": "ex", "jp": "くちなしの花。", "kana": "くちなしのはな。", "zh": "梔子花。"}, {"t": "ex", "jp": "雨の別れが今でも心を締め付ける。", "kana": "あめのわかれがいまでもこころをしめつける。", "zh": "雨中的離別，到現在仍揪住我的心。"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["雨", "あめ", "雨"], ["別れ", "わかれ", "離別"], ["今でも", "いまでも", "到現在仍然"], ["心", "こころ", "心"], ["締め付ける", "しめつける", "勒緊、壓迫、揪住"]]}, {"t": "poem", "text": "心を締め付ける：不是物理上勒緊心臟，而是讓人心痛、胸口發緊、被回憶壓住。"}, {"t": "ex", "jp": "思い出迷子。", "kana": "おもいでまいご。", "zh": "在回憶裡迷路的人。"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["思い出", "おもいで", "回憶"], ["迷子", "まいご", "迷路的人／迷路的孩子"]]}, {"t": "poem", "text": "人已經在現在，但心還停在過去，走不出那段回憶。"}, {"t": "h", "text": "八、本課核心總表"}, {"t": "table", "head": ["重點", "日文", "平假名", "中文"], "rows": [["自己困擾", "困る", "こまる", "困擾、為難"], ["讓人困擾", "困らせる", "こまらせる", "使某人困擾"], ["任性", "我儘", "わがまま", "任性"], ["一再任性", "我儘言っては困らせた", "わがままいってはこまらせた", "一再任性，使人為難"], ["原樣", "そのまま", "そのまま", "就那樣"], ["開著窗睡", "窓を開けたまま眠った", "まどをあけたままねむった", "窗戶開著就睡了"], ["沉默不行", "黙っては駄目です", "だまってはだめです", "不可以沉默"], ["雨中離別揪心", "雨の別れが今でも心を締め付ける", "あめのわかれがいまでもこころをしめつける", "雨中的離別至今仍揪心"]]}]}, {"date": "6/4", "title": "香り・旅路・果て・らしい", "subtitle": "香り・旅路・ついてくる・果て・まで・どこまでも・ような／らしい", "sections": [{"t": "h", "text": "一、香り（かおり）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["コーヒーの香り", "コーヒーのかおり", "咖啡的香氣"], ["梅の香り", "うめのかおり", "梅花／梅子的香氣"], ["いい香りがする", "いいかおりがする", "有好聞的味道"], ["酒の香", "さけのか", "酒香"], ["香りの高い果物", "かおりのたかいくだもの", "香氣濃郁的水果"]]}, {"t": "note", "text": "文法：N の香り（某物的香味）；する 表示「發出某種氣味／聲音／感覺」。"}, {"t": "ex", "jp": "コーヒーの香りがする。", "kana": "コーヒーのかおりがする。", "zh": "有咖啡香。"}, {"t": "ex", "jp": "この花はいい香りがする。", "kana": "このはなはいいかおりがする。", "zh": "這朵花有好聞的香味。"}, {"t": "ex", "jp": "文学の香り高い作品。", "kana": "ぶんがくのかおりたかいさくひん。", "zh": "富有文學氣息的作品（比喻氣息、風格）。"}, {"t": "note", "text": "延伸：「がする」表示「感受到某種…」，不只香味。"}, {"t": "table", "head": ["用法", "平假名", "中文"], "rows": [["匂いがする", "においがする", "有味道"], ["音がする", "おとがする", "有聲音"], ["感じがする", "かんじがする", "有某種感覺"]]}, {"t": "h", "text": "二、旅路（たびじ）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["旅路", "たびじ", "旅途、人生道路"], ["長い旅路", "ながいたびじ", "漫長旅途"], ["人生", "じんせい", "人生"], ["共にする", "ともにする", "共同經歷、一起度過"], ["路地裏", "ろじうら", "巷弄深處、小巷裡"], ["門地", "もんち", "門第、家世"]]}, {"t": "note", "text": "文法：N を共にする（共同經歷某件事）。"}, {"t": "ex", "jp": "人生は長い旅路だ。", "kana": "じんせいはながいたびじだ。", "zh": "人生是一段漫長的旅途。"}, {"t": "ex", "jp": "二人で旅路を共にする。", "kana": "ふたりでたびじをともにする。", "zh": "兩個人一起走人生的旅途。"}, {"t": "ex", "jp": "苦労を共にする。", "kana": "くろうをともにする。", "zh": "一起吃苦。"}, {"t": "ex", "jp": "人生を共にする。", "kana": "じんせいをともにする。", "zh": "共度人生。"}, {"t": "h", "text": "三、ついてくる（跟著來／附帶而來）"}, {"t": "table", "head": ["寫法", "平假名", "意思"], "rows": [["付いてくる", "ついてくる", "跟著來、附著、伴隨而來"], ["就いて学ぶ", "ついてまなぶ", "師從某人學習"]]}, {"t": "sub", "text": "A. 付いてくる：跟著來"}, {"t": "ex", "jp": "子供が母親について来る。", "kana": "こどもがははおやについてくる。", "zh": "孩子跟著媽媽來。"}, {"t": "ex", "jp": "彼は彼女の家までついてきた。", "kana": "かれはかのじょのいえまでついてきた。", "zh": "他跟到她家。"}, {"t": "sub", "text": "B. 抽象用法：某狀態跟著來"}, {"t": "note", "text": "文法：A と、B がついてくる（只要 A 發生，B 就會伴隨而來）。"}, {"t": "ex", "jp": "年を取ると、病気がついて来る。", "kana": "としをとると、びょうきがついてくる。", "zh": "年紀大了，疾病也會跟著來。"}, {"t": "ex", "jp": "年を取るのが怖い。", "kana": "としをとるのがこわい。", "zh": "害怕變老。"}, {"t": "ex", "jp": "責任には不安がついてくる。", "kana": "せきにんにはふあんがついてくる。", "zh": "責任常常伴隨著不安。"}, {"t": "sub", "text": "C. 就いて学ぶ：師從某人"}, {"t": "ex", "jp": "先生に就いて学ぶ。", "kana": "せんせいについてまなぶ。", "zh": "跟著老師學習／師從老師。"}, {"t": "ex", "jp": "先生に就いてください。", "kana": "せんせいについてください。", "zh": "請跟著老師（學）。"}, {"t": "ex", "jp": "私は先生に就いてきた。", "kana": "わたしはせんせいについてきた。", "zh": "我一路跟著老師學來。"}, {"t": "ex", "jp": "私は彼女に就いてきた。", "kana": "わたしはかのじょについてきた。", "zh": "我一路跟著她。"}, {"t": "warn", "text": "⚠️ 人跟人走→付いてくる／ついてくる；師從老師→就いて学ぶ。"}, {"t": "h", "text": "四、果て（はて）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["命の果て", "いのちのはて", "生命的盡頭"], ["戦いの果て", "たたかいのはて", "戰鬥的盡頭"], ["努力の果て", "どりょくのはて", "努力到最後"], ["議論の果てに", "ぎろんのはてに", "經過討論到最後"], ["結論", "けつろん", "結論"], ["果てしない", "はてしない", "無止境的、無邊無際的"], ["愚痴", "ぐち", "抱怨"]]}, {"t": "note", "text": "文法：N の果てに（經過某事到最後，終於…）；果てしない＋N（沒有盡頭的…）。果てる（はてる）→ 果て。"}, {"t": "ex", "jp": "議論の果てに結論が出た。", "kana": "ぎろんのはてにけつろんがでた。", "zh": "經過長時間討論後，終於得出結論。"}, {"t": "ex", "jp": "努力の果てに成功した。", "kana": "どりょくのはてにせいこうした。", "zh": "努力到最後終於成功了。"}, {"t": "ex", "jp": "果てしない夢。", "kana": "はてしないゆめ。", "zh": "無邊無際的夢想。"}, {"t": "ex", "jp": "果てしない議論。", "kana": "はてしないぎろん。", "zh": "沒完沒了的討論。"}, {"t": "ex", "jp": "果てしない愚痴。", "kana": "はてしないぐち。", "zh": "沒完沒了的抱怨。"}, {"t": "ex", "jp": "果てしない道。", "kana": "はてしないみち。", "zh": "沒有盡頭的路。"}, {"t": "h", "text": "五、まで（到…為止）"}, {"t": "note", "text": "文法：A から B まで（從 A 到 B）。"}, {"t": "ex", "jp": "台北から基隆まで。", "kana": "たいぺいからきーるんまで。", "zh": "從台北到基隆。"}, {"t": "ex", "jp": "旅路の果てまで。", "kana": "たびじのはてまで。", "zh": "直到旅途的盡頭。"}, {"t": "ex", "jp": "学校から家まで歩く。", "kana": "がっこうからいえまであるく。", "zh": "從學校走到家。"}, {"t": "h", "text": "六、どこ／どこまで／どこまでも"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["どこ", "どこ", "哪裡"], ["どこまで", "どこまで", "到哪裡為止"], ["どこでも", "どこでも", "哪裡都……"], ["どこまでも", "どこまでも", "無論到哪裡、一直到任何地方"]]}, {"t": "ex", "jp": "どこまでですか。", "kana": "どこまでですか。", "zh": "到哪裡？"}, {"t": "ex", "jp": "何処までもついて来る。", "kana": "どこまでもついてくる。", "zh": "無論到哪裡都跟著來。"}, {"t": "h", "text": "七、ような（像…一樣的）"}, {"t": "note", "text": "文法：N のような N（像 N 一樣的 N）。"}, {"t": "ex", "jp": "山梔子の白い花はお前のような花だった。", "kana": "くちなしのしろいはなはおまえのようなはなだった。", "zh": "梔子花的白花，是像你一樣的花。"}, {"t": "ex", "jp": "この薔薇は君のような花です。", "kana": "このばらはきみのようなはなです。", "zh": "這朵玫瑰是像你一樣的花。"}, {"t": "ex", "jp": "猫のような犬。", "kana": "ねこのよういぬ。", "zh": "像貓一樣的狗。"}, {"t": "ex", "jp": "UFOのような車。", "kana": "ユーフォーのようなくるま。", "zh": "像 UFO 一樣的車。"}, {"t": "h", "text": "八、らしい（很像、具典型特徵）"}, {"t": "ex", "jp": "張さんは先生らしい先生です。", "kana": "ちょうさんはせんせいらしいせんせいです。", "zh": "張先生是很有老師樣子的老師。"}, {"t": "ex", "jp": "張さんは先生のような人です。", "kana": "ちょうさんはせんせいのようなひとです。", "zh": "張先生是像老師一樣的人。"}, {"t": "ex", "jp": "春らしい天気ですね。", "kana": "はるらしいてんきですね。", "zh": "真是有春天感覺的天氣。"}, {"t": "ex", "jp": "男らしい。", "kana": "おとこらしい。", "zh": "有男子氣概。"}, {"t": "ex", "jp": "女らしい。", "kana": "おんならしい。", "zh": "有女性氣質。"}, {"t": "h", "text": "九、ような vs らしい"}, {"t": "table", "head": ["文法", "中文感覺", "重點"], "rows": [["N のような", "像……一樣", "外表、感覺、比喻（不一定是）"], ["N らしい", "很有……樣子", "符合典型特徵（本來就是）"]]}, {"t": "note", "text": "先生のような人＝像老師一樣的人（可能不是老師）。先生らしい先生＝很有老師樣子的老師（他就是老師，且很符合形象）。"}, {"t": "h", "text": "十、のようなもの（像…那樣的東西／差不多是…）"}, {"t": "note", "text": "N のようなもの：「像 N 那種東西」、「幾乎可以說是 N」，比 N のような N 更有「差不多就是那樣」的語氣。"}, {"t": "ex", "jp": "この大学は高等学校のようなものです。", "kana": "このだいがくはこうとうがっこうのようなものです。", "zh": "這所大學簡直像高中一樣。"}, {"t": "ex", "jp": "この車はUFOのようなものです。", "kana": "このくるまはユーフォーのようなものです。", "zh": "這台車像 UFO 一樣。"}, {"t": "ex", "jp": "この犬は猫のようなものです。", "kana": "このいぬはねこのようなものです。", "zh": "這隻狗簡直像貓一樣。"}, {"t": "h", "text": "十一、本課核心句"}, {"t": "ex", "jp": "くちなしの花の香りが旅路の果てまでついて来る。", "kana": "くちなしのはなのかおりがたびじのはてまでついてくる。", "zh": "梔子花的香氣，一直跟隨到旅途的盡頭。"}, {"t": "table", "head": ["部分", "平假名", "中文"], "rows": [["くちなしの花", "くちなしのはな", "梔子花"], ["香りが", "かおりが", "香氣"], ["旅路の果てまで", "たびじのはてまで", "到旅途的盡頭"], ["ついて来る", "ついてくる", "跟著來、一直伴隨"]]}, {"t": "poem", "text": "不只寫花香，而是：那個人的記憶像梔子花香一樣，一直跟著自己走到人生很遠的地方。"}, {"t": "h", "text": "十二、補充單字"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["単語", "たんご", "單字"], ["音痴", "おんち", "音癡"], ["演歌", "えんか", "演歌（日本傳統流行歌風格）"], ["門地", "もんち", "門第、家世"], ["母親", "ははおや", "母親"], ["父親", "ちちおや", "父親"], ["怖い", "こわい", "可怕、害怕"], ["病気", "びょうき", "疾病"], ["結論", "けつろん", "結論"], ["議論", "ぎろん", "討論、爭論"]]}]}, {"date": "5/28", "title": "痩せる・ほど・噂", "subtitle": "核心歌詞・痩せる／やつれる・〜ほど・噂によると〜そうだ／らしい（p.186）", "sections": [{"t": "h", "text": "一、核心歌詞句"}, {"t": "ex", "jp": "くちなしの花の香が旅路の果てまで就いて來る。", "kana": "くちなしのはなのかがたびじのはてまでついてくる。", "zh": "梔子花的香氣一直跟到旅途的盡頭。"}, {"t": "ex", "jp": "口なしの白い花、お前の様な花だった。", "kana": "くちなしのしろいはな、おまえのようなはなだった。", "zh": "梔子的白花，是像你一樣的花。"}, {"t": "ex", "jp": "山梔子の白い花がお前の様な花でした。", "kana": "くちなしのしろいはながおまえのようなはなでした。", "zh": "梔子的白花，是像你一樣的花。"}, {"t": "note", "text": "くちなしの花＝梔子花。山梔子（くちなし）。"}, {"t": "h", "text": "二、痩せる／やつれる（消瘦／憔悴）"}, {"t": "ex", "jp": "お前が痩せてやつれた。", "kana": "おまえがやせてやつれた。", "zh": "你消瘦憔悴了。"}, {"t": "note", "text": "痩せる（やせる，變瘦）／やつれる（憔悴）。文法：Vて＋Vた 連接動作／狀態，表示「又…又…」（痩せて＋やつれた＝又瘦又憔悴）。"}, {"t": "h", "text": "三、〜ほど（到…的程度）"}, {"t": "note", "text": "指輪が回る（ゆびわがまわる）／地球が回る（ちきゅうがまわる）。「も」表強調。"}, {"t": "ex", "jp": "指輪が回るほど。", "kana": "ゆびわがまわるほど。", "zh": "到戒指會轉動的程度。"}, {"t": "ex", "jp": "お前が指輪も回るほど痩せた。", "kana": "おまえがゆびわもまわるほどやせた。", "zh": "你瘦到連戒指都會轉動的程度。"}, {"t": "ex", "jp": "私は死ぬほど疲れる。", "kana": "わたしはしぬほどつかれる。", "zh": "我累得要死。"}, {"t": "ex", "jp": "私は死ぬほど疲れた。", "kana": "わたしはしぬほどつかれた。", "zh": "我累得要死了。"}, {"t": "ex", "jp": "私は涙が出るほど感動した。", "kana": "わたしはなみだがでるほどかんどうした。", "zh": "我感動到流淚。"}, {"t": "note", "text": "死ぬ（しぬ）／疲れる（つかれる）／涙（なみだ）／感動する（かんどうする）。"}, {"t": "h", "text": "四、噂によると〜そうだ／らしい（傳聞）"}, {"t": "note", "text": "句型：噂（うわさ）によると … そうだ／らしい。"}, {"t": "ex", "jp": "今ではお前が指輪も回るほど痩せた。", "kana": "いまではおまえがゆびわもまわるほどやせた。", "zh": "現在你瘦到戒指都會轉動了。"}, {"t": "ex", "jp": "今ではお前が指輪も回るほど痩せてやつれた。", "kana": "いまではおまえがゆびわもまわるほどやせてやつれた。", "zh": "現在你瘦到戒指會轉、憔悴不堪。"}, {"t": "ex", "jp": "噂によると今ではお前が指輪も回るほど痩せてやつれたそうだ。", "kana": "うわさによるといまではおまえがゆびわもまわるほどやせてやつれたそうだ。", "zh": "聽說你現在瘦到戒指都會轉、憔悴不堪。"}, {"t": "ex", "jp": "（今では指輪も回るほど痩せてやつれた）お前の噂。", "kana": "（いまではゆびわもまわるほどやせてやつれた）おまえのうわさ。", "zh": "（瘦到戒指都會轉、憔悴）關於你的傳聞。"}, {"t": "note", "text": "文法：整串長句「今では指輪も回るほど痩せてやつれた」都在修飾後面的名詞「お前の噂」。日文用前面整段內容直接修飾後面的名詞。"}, {"t": "h", "text": "五、香り相關用字"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["香る", "かおる", "散發香氣"], ["香り／いい香り", "かおり／いいかおり", "香氣／好香味"], ["馨", "かおり", "馨（香氣，人名用字）"], ["香織", "かおり", "香織（人名）"], ["果てる→果て", "はてる→はて", "到盡頭→盡頭"], ["就く", "つく", "跟隨、師事"], ["就いて來る", "ついてくる", "跟著來"]]}]}, {"date": "5/21", "title": "らしい・みたい・よう", "subtitle": "らしい・みたい・ような・そうだ／と聞いている（傳聞與推測，p.186）", "sections": [{"t": "h", "text": "一、まで／待ってください"}, {"t": "ex", "jp": "待ってください。", "kana": "まってください。", "zh": "請等一下。"}, {"t": "note", "text": "まで（到…為止）／待つ（まつ，等待）。"}, {"t": "h", "text": "二、傳聞與推測的比較"}, {"t": "note", "text": "らしい／みたい／そうだ／と聞いている，皆可表示「聽說、好像」。"}, {"t": "ex", "jp": "彼は来年結婚するらしい。", "kana": "かれはらいねんけっこんするらしい。", "zh": "聽說他明年要結婚。"}, {"t": "ex", "jp": "彼は来年結婚するそうだ。", "kana": "かれはらいねんけっこんするそうだ。", "zh": "聽說他明年要結婚。"}, {"t": "ex", "jp": "彼は来年結婚すると聞いている。", "kana": "かれはらいねんけっこんするときいている。", "zh": "我聽說他明年要結婚。"}, {"t": "ex", "jp": "この店は人気があるらしい。", "kana": "このみせはにんきがあるらしい。", "zh": "這家店好像很受歡迎。"}, {"t": "h", "text": "三、らしい（很像、具典型特徵）"}, {"t": "note", "text": "含義：符合該事物的本質（ほんしつ）、角色（やくわり），典型、相稱（ふさわしい）。"}, {"t": "poem", "text": "老師定義：そのものの本質や役割に合っている、典型的である。（符合那個事物的本質或角色，具有典型性。）"}, {"t": "ex", "jp": "春らしい天気ですね。", "kana": "はるらしいてんきですね。", "zh": "真有春天感覺的天氣。"}, {"t": "ex", "jp": "春の様な天気です。", "kana": "はるのようなてんきです。", "zh": "像春天一樣的天氣。"}, {"t": "ex", "jp": "冬らしい天気。", "kana": "ふゆらしいてんき。", "zh": "很有冬天感覺的天氣。"}, {"t": "ex", "jp": "彼は学生らしい服装をしている。", "kana": "かれはがくせいらしいふくそうをしている。", "zh": "他穿著很有學生樣子的服裝。"}, {"t": "ex", "jp": "彼は学生のような服装をしている。", "kana": "かれはがくせいのようなふくそうをしている。", "zh": "他穿著像學生一樣的服裝。"}, {"t": "ex", "jp": "彼は先生らしい先生だ。", "kana": "かれはせんせいらしいせんせいだ。", "zh": "他是很有老師樣子的老師。"}, {"t": "ex", "jp": "彼は警察らしい。", "kana": "かれはけいさつらしい。", "zh": "他像是警察（很有警察樣子）。"}, {"t": "ex", "jp": "子どもらしい無邪気さ。", "kana": "こどもらしいむじゃきさ。", "zh": "孩子般的天真無邪。"}, {"t": "line", "jp": "男らしい／女らしい", "kana": "おとこらしい／おんならしい"}, {"t": "line", "jp": "無邪気な子供／無邪気さ", "kana": "むじゃきなこども／むじゃきさ"}, {"t": "note", "text": "制服（せいふく）。無邪気（むじゃき，天真）。相応しい（ふさわしい，相稱）。"}, {"t": "h", "text": "四、らしい／みたい／そうだ 並列"}, {"t": "ex", "jp": "彼は病気らしい。", "kana": "かれはびょうきらしい。", "zh": "他好像生病了。"}, {"t": "ex", "jp": "病人の様です。", "kana": "びょうにんのようです。", "zh": "像病人一樣。"}, {"t": "ex", "jp": "日本人らしい。", "kana": "にほんじんらしい。", "zh": "很有日本人樣子。"}, {"t": "ex", "jp": "先生はもう結婚したらしい。", "kana": "せんせいはもうけっこんしたらしい。", "zh": "老師好像已經結婚了。"}, {"t": "h", "text": "五、與歌詞結合（失戀・痩せる・噂）"}, {"t": "ex", "jp": "彼女は失恋のため痩せている。", "kana": "かのじょはしつれんのためやせている。", "zh": "她因為失戀而消瘦。"}, {"t": "ex", "jp": "彼女は失恋のため痩せているらしい。", "kana": "かのじょはしつれんのためやせているらしい。", "zh": "她好像因為失戀而消瘦。"}, {"t": "ex", "jp": "噂によると彼女は痩せてやつれた。", "kana": "うわさによるとかのじょはやせてやつれた。", "zh": "聽說她瘦了、憔悴了。"}, {"t": "ex", "jp": "噂によると彼女は指輪も回るほど痩せてやつれた。", "kana": "うわさによるとかのじょはゆびわもまわるほどやせてやつれた。", "zh": "聽說她瘦到戒指會轉、憔悴不堪。"}, {"t": "ex", "jp": "噂によると彼女は痩せてやつれたらしい。", "kana": "うわさによるとかのじょはやせてやつれたらしい。", "zh": "聽說她瘦了、憔悴了。"}, {"t": "ex", "jp": "噂によると彼女は痩せてやつれたそうだ。", "kana": "うわさによるとかのじょはやせてやつれたそうだ。", "zh": "聽說她瘦了、憔悴了。"}, {"t": "ex", "jp": "今では指輪も回るほど痩せてやつれたお前の噂。", "kana": "いまではゆびわもまわるほどやせてやつれたおまえのうわさ。", "zh": "現在瘦到戒指會轉、憔悴的關於你的傳聞。"}, {"t": "note", "text": "噂（うわさ）／指輪（ゆびわ）／程＝ほど（程度）／痩せ我慢（やせがまん，硬撐、逞強）／やつれる（憔悴）。"}, {"t": "h", "text": "六、核心歌詞句"}, {"t": "ex", "jp": "くちなしの花、花の香が旅路の果てまで就いてくる。", "kana": "くちなしのはな、はなのかがたびじのはてまでついてくる。", "zh": "梔子花，花香一直跟到旅途的盡頭。"}, {"t": "ex", "jp": "くちなしの白い花、お前のような花だった。", "kana": "くちなしのしろいはな、おまえのようなはなだった。", "zh": "梔子的白花，是像你一樣的花。"}, {"t": "note", "text": "渡哲也（わたりてつや）。相応しい（ふさわしい）。"}]}, {"date": "5/14", "title": "あと・予定・によると", "subtitle": "あと＋數量・予定／つもり・Aによると〜だそうです（傳聞，p.184）", "sections": [{"t": "h", "text": "一、あと＋數量（還剩…）"}, {"t": "ex", "jp": "勉強まであと一日！", "kana": "べんきょうまであといちにち！", "zh": "離讀書（考試）還剩一天！"}, {"t": "ex", "jp": "試験まであと一日！", "kana": "しけんまであといちにち！", "zh": "離考試還剩一天！"}, {"t": "ex", "jp": "あと一日辛抱すれば、自由だ。", "kana": "あといちにちしんぼうすれば、じゆうだ。", "zh": "再忍一天就自由了。"}, {"t": "ex", "jp": "あと一日待ってください。", "kana": "あといちにちまってください。", "zh": "請再等一天。"}, {"t": "ex", "jp": "あと一日頑張れば休みだ。", "kana": "あといちにちがんばればやすみだ。", "zh": "再加油一天就放假了。"}, {"t": "ex", "jp": "あと一日で夏休みが終わる。", "kana": "あといちにちでなつやすみがおわる。", "zh": "再一天暑假就結束了。"}, {"t": "ex", "jp": "締め切りまであと一日しかない。", "kana": "しめきりまであといちにちしかない。", "zh": "離截稿只剩一天。"}, {"t": "note", "text": "辛抱（しんぼう，忍耐）／頑張る（がんばる）／休み（やすみ）／終わる（おわる）／締め切り（しめきり）＝締める＋切る。其他：あと三時間、あと二人（ふたり）、あと五分。"}, {"t": "h", "text": "二、予定／つもり"}, {"t": "ex", "jp": "あと一日で完成する予定です。", "kana": "あといちにちでかんせいするよていです。", "zh": "預定再一天完成。"}, {"t": "ex", "jp": "四月にアメリカへ行く予定です。", "kana": "しがつにアメリカへいくよていです。", "zh": "預定四月去美國。"}, {"t": "ex", "jp": "四月にアメリカへ行くつもりです。", "kana": "しがつにアメリカへいくつもりです。", "zh": "打算四月去美國。"}, {"t": "table", "head": ["文法", "中文", "語感"], "rows": [["予定です", "預定", "較像已安排好的計畫"], ["つもりです", "打算", "偏個人意志、想法"]]}, {"t": "h", "text": "三、Aによると〜だそうです（傳聞）"}, {"t": "note", "text": "文法：根據某來源（拠る，よる）所聽到的傳聞。"}, {"t": "ex", "jp": "天気予報によると、明日は雨だそうです。", "kana": "てんきよほうによると、あしたはあめだそうです。", "zh": "根據天氣預報，明天會下雨。"}, {"t": "ex", "jp": "先生の話によると、この本はとても有名だそうです。", "kana": "せんせいのはなしによると、このほんはとてもゆうめいだそうです。", "zh": "據老師說，這本書很有名。"}, {"t": "ex", "jp": "彼の話によると先生は来ないそうです。", "kana": "かれのはなしによるとせんせいはこないそうです。", "zh": "據他說老師不會來。"}, {"t": "ex", "jp": "噂によると彼女はとても美しいそうです。", "kana": "うわさによるとかのじょはとてもうつくしいそうです。", "zh": "聽說她非常美麗。"}, {"t": "ex", "jp": "政府の情報によると彼はロシヤ政府に殺されたそうです。", "kana": "せいふのじょうほうによるとかれはロシヤせいふにころされたそうです。", "zh": "據政府情報，他被俄羅斯政府殺害了。"}, {"t": "ex", "jp": "歴史によると汐止は綺麗な街だったそうです。", "kana": "れきしによるとしおどめはきれいなまちだったそうです。", "zh": "根據歷史，汐止以前是個漂亮的城鎮。"}, {"t": "ex", "jp": "お医者さんの話によると彼の病気はよく成らないそうだ。", "kana": "おいしゃさんのはなしによるとかれのびょうきはよくならないそうだ。", "zh": "據醫生說，他的病不會好。"}, {"t": "ex", "jp": "彼女の話によるとこの映画は面白いそうです。", "kana": "かのじょのはなしによるとこのえいがはおもしろいそうです。", "zh": "據她說這部電影很有趣。"}, {"t": "note", "text": "情報（じょうほう）／殺す（ころす）→殺された／町・街（まち）。"}, {"t": "h", "text": "四、天氣與災害詞彙"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["晴れる", "はれる", "放晴"], ["曇る", "くもる", "陰天"], ["大雨", "おおあめ", "大雨"], ["ザアザア降り", "ザアザアぶり", "嘩啦嘩啦地下"], ["台風", "たいふう", "颱風"], ["竜巻", "たつまき", "龍捲風"], ["起る", "おこる", "發生、興起"], ["津波", "つなみ", "海嘯"], ["地震", "じしん", "地震"], ["襲う", "おそう", "襲擊"], ["襲われる", "おそわれる", "被襲擊"]]}, {"t": "ex", "jp": "天気予報によると明日晴れるそうです。", "kana": "てんきよほうによるとあしたはれるそうです。", "zh": "據氣象預報，明天會放晴。"}, {"t": "ex", "jp": "天気予報によると明日曇るそうです。", "kana": "てんきよほうによるとあしたくもるそうです。", "zh": "據氣象預報，明天會陰天。"}, {"t": "ex", "jp": "天気予報によると明日大雨だそうです。", "kana": "てんきよほうによるとあしたおおあめだそうです。", "zh": "據氣象預報，明天會下大雨。"}, {"t": "ex", "jp": "天気予報によると台風が来るそうです。", "kana": "てんきよほうによるとたいふうがくるそうです。", "zh": "據氣象預報，颱風會來。"}, {"t": "ex", "jp": "天気予報によると明日竜巻が起るそうです。", "kana": "てんきよほうによるとあしたたつまきがおこるそうです。", "zh": "據氣象預報，明天會起龍捲風。"}, {"t": "ex", "jp": "津波に襲われる。", "kana": "つなみにおそわれる。", "zh": "被海嘯襲擊。"}, {"t": "ex", "jp": "津波を起こす。", "kana": "つなみをおこす。", "zh": "引發海嘯。"}, {"t": "ex", "jp": "地震が津波を起こす。", "kana": "じしんがつなみをおこす。", "zh": "地震引發海嘯。"}]}, {"date": "5/7", "title": "そうだ・わざわざ・く成る", "subtitle": "〜そうだ（樣態 vs 傳聞）・わざわざ／折角・〜く成る（變化）・あと（p.184）", "sections": [{"t": "h", "text": "一、樣態 vs 傳聞的そうだ"}, {"t": "note", "text": "樣態（看起來）：形容詞語幹／形容動詞語幹 ＋ そうだ。傳聞（聽說）：終止形 ＋ そうだ。"}, {"t": "table", "head": ["樣態（看起來）", "平假名", "傳聞（聽說）"], "rows": [["この花は綺麗そうだ", "このはなはきれいそうだ", "この花は綺麗だそうだ"], ["真面目そうだ", "まじめそうだ", "—"], ["美味しそうだ", "おいしそうだ", "—"], ["高そうだ", "たかそうだ", "この本は高いそうだ"], ["この子供は元気そうだ", "このこどもはげんきそうだ", "この子供は元気だそうだ"], ["この町は賑やかそうだ", "このまちはにぎやかそうだ", "この町は賑やかだそうだ"], ["この町は不便そうだ", "このまちはふべんそうだ", "この町は不便だそうだ"]]}, {"t": "line", "jp": "たかそうだ／やすそうだ／さむそうだ", "kana": "高そうだ／安そうだ／寒そうだ"}, {"t": "line", "jp": "きれいそうだ／まじめそうだ／にぎやかそうだ", "kana": "綺麗そうだ／真面目そうだ／賑やかそうだ"}, {"t": "h", "text": "二、わざわざ／折角（せっかく）"}, {"t": "ex", "jp": "わざわざ来てくれてありがとう。", "kana": "わざわざきてくれてありがとう。", "zh": "謝謝你特地前來。"}, {"t": "ex", "jp": "わざわざ悪戯書きをする。", "kana": "わざわざいたずらがきをする。", "zh": "特地塗鴉。"}, {"t": "ex", "jp": "わざわざそんなことをしなくてもいいのに。", "kana": "わざわざそんなことをしなくてもいいのに。", "zh": "用不著特地做那種事的。"}, {"t": "ex", "jp": "わざわざ電話して確認した。", "kana": "わざわざでんわしてかくにんした。", "zh": "特地打電話確認。"}, {"t": "ex", "jp": "わざわざ言わなくてもいい。", "kana": "わざわざいわなくてもいい。", "zh": "用不著特地說。"}, {"t": "ex", "jp": "せっかくですが結構です。", "kana": "せっかくですがけっこうです。", "zh": "難得（您的好意），但不用了。"}, {"t": "ex", "jp": "せっかくのお心遣いありがとうございます。", "kana": "せっかくのおこころづかいありがとうございます。", "zh": "感謝您難得的關心。"}, {"t": "note", "text": "悪戯書き（いたずらがき，塗鴉）／心遣い（こころづかい，關心）。"}, {"t": "h", "text": "三、〜く成る／〜に成る（變化）"}, {"t": "ex", "jp": "よく成った。", "kana": "よくなった。", "zh": "變好了。"}, {"t": "ex", "jp": "玉子が高く成った。", "kana": "たまごがたかくなった。", "zh": "蛋變貴了。"}, {"t": "ex", "jp": "りんごが美味しく成った。", "kana": "りんごがおいしくなった。", "zh": "蘋果變好吃了。"}, {"t": "ex", "jp": "今日は寒く成った。", "kana": "きょうはさむくなった。", "zh": "今天變冷了。"}, {"t": "ex", "jp": "今日は暑くなった。", "kana": "きょうはあつくなった。", "zh": "今天變熱了。"}, {"t": "ex", "jp": "このジュースは甘く成った。", "kana": "このジュースはあまくなった。", "zh": "這果汁變甜了。"}, {"t": "ex", "jp": "天気が暗くなった。", "kana": "てんきがくらくなった。", "zh": "天色變暗了。"}, {"t": "ex", "jp": "昼間が長く成った。", "kana": "ひるまがながくなった。", "zh": "白天變長了。"}, {"t": "sub", "text": "〜く成らない（不會變…）"}, {"t": "ex", "jp": "仕合わせが短く成らない。", "kana": "しあわせがみじかくならない。", "zh": "幸福不會變短。"}, {"t": "ex", "jp": "仕合わせが短く成った。", "kana": "しあわせがみじかくなった。", "zh": "幸福變短了。"}, {"t": "ex", "jp": "そのいのちは短く成らない。", "kana": "そのいのちはみじかくならない。", "zh": "那生命不會變短。"}, {"t": "ex", "jp": "卵は高く成らない。", "kana": "たまごはたかくならない。", "zh": "蛋不會變貴。"}, {"t": "ex", "jp": "昼間は短く成らない。", "kana": "ひるまはみじかくならない。", "zh": "白天不會變短。"}, {"t": "ex", "jp": "昼間は長く成らない。", "kana": "ひるまはながくならない。", "zh": "白天不會變長。"}, {"t": "ex", "jp": "白菜は安くならない。", "kana": "はくさいはやすくならない。", "zh": "白菜不會變便宜。"}, {"t": "ex", "jp": "水は清くならない。", "kana": "みずはきよくならない。", "zh": "水不會變清。"}, {"t": "ex", "jp": "この子供は背が高く成らない。", "kana": "このこどもはせがたかくならない。", "zh": "這孩子個子不會長高。"}, {"t": "ex", "jp": "この道は広く成らない。", "kana": "このみちはひろくならない。", "zh": "這條路不會變寬。"}, {"t": "ex", "jp": "この納豆は甘く成らない。", "kana": "このなっとうはあまくならない。", "zh": "這納豆不會變甜。"}, {"t": "ex", "jp": "この本は白く成らない。", "kana": "このほんはしろくならない。", "zh": "這本書不會變白。"}, {"t": "ex", "jp": "月給は多くならない。", "kana": "げっきゅうはおおくならない。", "zh": "月薪不會變多。"}, {"t": "ex", "jp": "家賃は安く成らない。", "kana": "やちんはやすくならない。", "zh": "房租不會變便宜。"}, {"t": "ex", "jp": "管理費は安く成らない。", "kana": "かんりひはやすくならない。", "zh": "管理費不會變便宜。"}, {"t": "ex", "jp": "この病気はよくならない。", "kana": "このびょうきはよくならない。", "zh": "這病不會好。"}, {"t": "note", "text": "仕合わせ・幸福（しあわせ）／清い（きよい）／広い（ひろい）／月給（げっきゅう）／家賃（やちん）。"}, {"t": "h", "text": "四、あと（時間／之後）"}, {"t": "ex", "jp": "試験まで後一日だ。", "kana": "しけんまであといちにちだ。", "zh": "離考試還剩一天。"}, {"t": "line", "jp": "あと一週間／あと一カ月間／あと三ケ月／あと一年", "kana": "あといっしゅうかん／あといっかげつかん／あとさんかげつ／あといちねん"}, {"t": "ex", "jp": "後で電話します。", "kana": "あとででんわします。", "zh": "之後打電話。"}, {"t": "ex", "jp": "後で説明するね。", "kana": "あとでせつめいするね。", "zh": "之後說明喔。"}, {"t": "ex", "jp": "後で連絡します。", "kana": "あとでれんらくします。", "zh": "之後再聯絡。"}, {"t": "line", "jp": "あと一時間", "kana": "あといちじかん"}]}, {"date": "4/30", "title": "三變＋そうだ・補助動詞", "subtitle": "活用語三變＋そうだ（傳聞）・形容動詞語幹＋そうだ（樣態）・補助動詞（p.184）", function countItems(d){return d.sections.filter(s=>['ex','line'].includes(s.t)).length

function stripNum(t){return t.replace(/^[一二三四五六七八九十]+、/,'');}

function renderSection(s,secNo){
  switch(s.t){
    case 'lead': return `<p class="lead">${esc(s.text)}</p>`;
    case 'h':    return `<h2 class="sec"><span class="num">${secNo}</span>${esc(stripNum(s.text))}</h2>`;
    case 'sub':  return `<h3 class="subh">${esc(s.text)}</h3>`;
    case 'note': return `<div class="note">${esc(s.text)}</div>`;
    case 'warn': return `<div class="warn">${esc(s.text)}</div>`;
    case 'poem': return `<div class="poem">${esc(s.text)}</div>`;
    case 'ex':   return `<div class="ex"><div class="jp"><span class="mk">🌷</span>${esc(s.jp)}</div>`+
                  (s.kana?`<div class="kana">${esc(s.kana)}</div>`:``)+
                  (s.zh?`<div class="zh">${esc(s.zh)}</div>`:``)+`</div>`;
    case 'line': return `<div class="line"><div class="jp"><span class="mk">🌱</span>${esc(s.jp)}`+
                  (s.kana?` <span class="kana-inline">（${esc(s.kana)}）</span>`:``)+`</div></div>`;
    case 'table':{let h=`<div class="tbl-wrap"><table><thead><tr>`;
      s.head.forEach(c=>h+=`<th>${esc(c)}</th>`);h+=`</tr></thead><tbody>`;
      s.rows.forEach(r=>{h+=`<tr>`;r.forEach(c=>h+=`<td>${esc(c)}</td>`);h+=`</tr>`;});
      return h+`</tbody></table></div>`;}
    default:return '';
  }
}

    `<div class="lesson-sub">${esc(d.subtitle)}</div>`+
    `<div class="lesson-meta">🌸 共 ${d.sections.filter(s=>s.t==='h').length} 個主題 ・ ${countItems(d)} 個例句／詞條</div>`;
  d.sections.forEach(s=>{if(s.t==='h'){secNo++;html+=renderSection(s,CN_NUM[secNo]||secNo);}else html+=renderSection(s);});
  document.getElementById('lesson').innerHTML=html;
  document.querySelectorAll('.day-btn').forEach((b)=>{
    const on=b.dataset.kind==='day'&&Number(b.dataset.idx)===idx;
    b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false');});
}
(function(){const nav=document.getElementById('dayNav');
 // 歌詞分頁（置於最前）
 const lb=document.createElement('button');lb.className='day-btn';lb.setAttribute('role','tab');
 lb.dataset.kind='lyric';
 lb.innerHTML=`<span class="flower">🎵</span><span class="d-date">歌詞</span>`+
   `<span class="d-title">${esc(LYRICS.title)}</span><span class="d-count">3 段</span>`;
 lb.addEventListener('click',()=>{renderLyrics();scrollToContent();});
 nav.appendChild(lb);
 // 各日期分頁
 DATA.forEach((d,i)=>{const b=document.createElement('button');b.className='day-btn';b.setAttribute('role','tab');
  b.dataset.kind='day';b.dataset.idx=i;
  b.innerHTML=`<span class="flower">${FLOWERS[i%FLOWERS.length]}</span>`+
   `<span class="d-date">${esc(d.date)}</span><span class="d-title">${esc(d.title)}</span>`+
   `<span class="d-count">${countItems(d)} 句</span>`;
  b.addEventListener('click',()=>{renderDay(i);scrollToContent();});
  nav.appendChild(b);});
 renderLyrics();})();
function scrollToContent(){
  const top=document.querySelector('.day-nav').getBoundingClientRect().bottom+window.scrollY-8;
  window.scrollTo({top,behavior:'smooth'});
}

/* ===== 搜尋 ===== */
// 建立索引：把每天每個可搜尋區塊攤平成 {dayIdx,date,jp,kana,zh,raw}
const INDEX=[];
DATA.forEach((d,di)=>{
  d.sections.forEach(s=>{
    if(s.t==='ex'||s.t==='line'){
      INDEX.push({di,date:d.date,jp:s.jp||'',kana:s.kana||'',zh:s.zh||''});
    }else if(s.t==='table'){
      s.rows.forEach(r=>INDEX.push({di,date:d.date,jp:r.join(' / '),kana:'',zh:''}));
    }else if(['note','poem','sub','warn','lead'].includes(s.t)){
      INDEX.push({di,date:d.date,jp:s.text||'',kana:'',zh:''});
    }
  });
});
// 歌詞也納入索引
LYRICS.verses.forEach(v=>v.lines.forEach(ln=>{
  INDEX.push({di:-1,date:'🎵 歌詞',jp:ln.jp,kana:ln.kana,zh:ln.zh});
}));

function hl(text,q){
  if(!q) return esc(text);
  const t=esc(text);const ql=q.toLowerCase();
  const idx=t.toLowerCase().indexOf(ql);
  if(idx<0) return t;
  return t.slice(0,idx)+'<span class="hl-mark">'+t.slice(idx,idx+q.length)+'</span>'+t.slice(idx+q.length);
}
function runSearch(q){
  q=q.trim();
  document.getElementById('searchClear').classList.toggle('show',q.length>0);
  if(!q){renderActive();return;}
  const ql=q.toLowerCase();
  const hits=INDEX.filter(r=>
    r.jp.toLowerCase().includes(ql)||r.kana.toLowerCase().includes(ql)||r.zh.toLowerCase().includes(ql));
  // 取消分頁高亮
  document.querySelectorAll('.day-btn').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false');});
  const el=document.getElementById('lesson');
  if(hits.length===0){
    el.innerHTML=`<div class="no-result"><span class="big">🌸</span>找不到「${esc(q)}」<br><span style="font-size:12px">換個關鍵字試試，日文／假名／中文都可以搜</span></div>`;
    return;
  }
  // 依天分組
  const groups={};hits.forEach(h=>{(groups[h.date]=groups[h.date]||[]).push(h);});
  let html=`<div class="results-summary">🔍 找到 ${hits.length} 筆「${esc(q)}」的結果</div>`;
  Object.keys(groups).forEach(date=>{
    const arr=groups[date];const di=arr[0].di;
    html+=`<div class="result-group">`+
      `<button class="result-day" data-di="${di}">🌸 ${esc(date)}（${arr.length}）</button>`;
    arr.forEach(r=>{
      html+=`<div class="ex"><div class="jp"><span class="mk">🌷</span>${hl(r.jp,q)}</div>`+
        (r.kana?`<div class="kana">${hl(r.kana,q)}</div>`:``)+
        (r.zh?`<div class="zh">${hl(r.zh,q)}</div>`:``)+`</div>`;
    });
    html+=`</div>`;
  });
  el.innerHTML=html;
  // 點分組標題 → 跳到該天完整內容
  el.querySelectorAll('.result-day').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const di=Number(btn.dataset.di);
      document.getElementById('searchInput').value='';
      document.getElementById('searchClear').classList.remove('show');
      if(di<0) renderLyrics(); else renderDay(di);
      scrollToContent();
    });
  });
}
// 搜尋清空後回到目前頁面
function renderActive(){ if(activeView.kind==='lyric') renderLyrics(); else renderDay(activeView.idx); }

(function(){
  const inp=document.getElementById('searchInput');
  const clr=document.getElementById('searchClear');
  let timer=null;
  inp.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>runSearch(inp.value),120);});
  clr.addEventListener('click',()=>{inp.value='';clr.classList.remove('show');renderActive();inp.focus();});
})();
const st=document.getElementById('scrollTop');
window.addEventListener('scroll',()=>st.classList.toggle('show',window.scrollY>320));
st.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
</script>
</body>
