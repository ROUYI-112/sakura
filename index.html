<script>
const DATA = [{"date": "8/13", "title": "小さな・てしまう／ちゃう・たび", "subtitle": "小さい／小さな・〜てしまう／〜ちゃう・〜たび（に）・消える／消す・逃げる／逃す・浮かぶ／微笑む", "sections": [{"t": "lead", "text": "本日從一句歌詞味的「小さな幸せ それさえも」往外拉三個文法：① 小さい／小さな ② 〜てしまう／〜ちゃう ③ 〜たび（に）。後半是練「歌詞式的日文表現」。"}, {"t": "h", "text": "一、小さい vs 小さな"}, {"t": "note", "text": "小さい（ちいさい）＝標準い形容詞。小さな＝連体詞，只能放名詞前修飾（連体法）。"}, {"t": "ex", "jp": "小さい花。", "kana": "ちいさいはな。", "zh": "小花。"}, {"t": "ex", "jp": "この学校は小さい。", "kana": "このがっこうはちいさい。", "zh": "這間學校很小。"}, {"t": "ex", "jp": "小さくない。", "kana": "ちいさくない。", "zh": "不小。"}, {"t": "ex", "jp": "小さな花。", "kana": "ちいさなはな。", "zh": "小小的花。"}, {"t": "warn", "text": "⚠️ 不能說「この花は小さな。」小さな 只能放在名詞前面修飾名詞。"}, {"t": "note", "text": "語感：小さい花＝客觀尺寸小；小さな花＝帶「小小的、可愛的、微不足道卻令人注意」的感情色彩。所以歌詞愛用「小さな幸せ」。"}, {"t": "ex", "jp": "小さな声で話す。", "kana": "ちいさなこえではなす。", "zh": "用小小的聲音說話（較柔和、文學性）。"}, {"t": "h", "text": "二、大きな（同一家族）"}, {"t": "note", "text": "大きい（おおきい）／大きな（おおきな）同理。大きな 只接名詞。"}, {"t": "ex", "jp": "札幌は大きな町です。", "kana": "さっぽろはおおきなまちです。", "zh": "札幌是一座大城市。"}, {"t": "h", "text": "三、小さな幸せ　それさえも"}, {"t": "note", "text": "さえ＝甚至、連…都；も＝也。それさえも＝連那個都…。"}, {"t": "ex", "jp": "小さな幸せさえも捨ててしまった。", "kana": "ちいさなしあわせさえもすててしまった。", "zh": "甚至連小小的幸福都捨棄了。"}, {"t": "h", "text": "四、捨てる → 捨ててしまった（〜てしまう）"}, {"t": "note", "text": "捨てる（すてる）＝丟掉、捨棄。今天真正要教的是 Vて＋しまう。"}, {"t": "ex", "jp": "ゴミを捨てる。", "kana": "ゴミをすてる。", "zh": "丟垃圾。"}, {"t": "ex", "jp": "捨ててしまった。", "kana": "すててしまった。", "zh": "終究把它捨棄了。"}, {"t": "note", "text": "變化：捨てる→捨てて→捨ててしまう→捨ててしまった。"}, {"t": "h", "text": "五、〜てしまう 的兩大意思"}, {"t": "note", "text": "① 完成、徹底做完（不一定後悔）；② 不小心／遺憾地發生了（竟然…了、不小心…了、就這樣…了）。"}, {"t": "ex", "jp": "ケーキを全部食べてしまった。", "kana": "ケーキをぜんぶたべてしまった。", "zh": "把蛋糕全部吃完了／竟然把蛋糕全吃掉了（依語境）。"}, {"t": "ex", "jp": "財布を落としてしまった。", "kana": "さいふをおとしてしまった。", "zh": "不小心把錢包弄丟了。"}, {"t": "h", "text": "六、同一骨架換動詞"}, {"t": "ex", "jp": "秘密を話す。", "kana": "ひみつをはなす。", "zh": "說秘密。"}, {"t": "ex", "jp": "秘密を話してしまった。", "kana": "ひみつをはなしてしまった。", "zh": "不小心把秘密說出去了（糟糕！做了不該做的事）。"}, {"t": "ex", "jp": "あの人は行ってしまった。", "kana": "あのひとはいってしまった。", "zh": "那個人已經走掉了、他就這樣離開了（失落感）。"}, {"t": "ex", "jp": "写真を消してしまった。", "kana": "しゃしんをけしてしまった。", "zh": "不小心把照片刪掉了。"}, {"t": "ex", "jp": "財布を落としてしまった。", "kana": "さいふをおとしてしまった。", "zh": "糟糕，把錢包弄丟了。"}, {"t": "ex", "jp": "携帯を落としてしまった。", "kana": "けいたいをおとしてしまった。", "zh": "不小心把手機掉了（携帯＝携帯電話＝手機）。"}, {"t": "note", "text": "落とす（おとす）＝把東西弄掉、遺失。しまう 通常直接寫平假名，不寫成 仕舞う。"}, {"t": "h", "text": "七、口語縮約：〜ちゃう／〜じゃう"}, {"t": "note", "text": "〜てしまう → 〜ちゃう；〜でしまう → 〜じゃう。"}, {"t": "ex", "jp": "捨ててしまった → 捨てちゃった。", "kana": "すててしまった → すてちゃった。", "zh": "捨棄掉了（口語）。"}, {"t": "ex", "jp": "食べてしまった → 食べちゃった。", "kana": "たべてしまった → たべちゃった。", "zh": "吃掉了（口語，不是「食べっちゃった」）。"}, {"t": "ex", "jp": "飲んでしまった → 飲んじゃった。", "kana": "のんでしまった → のんじゃった。", "zh": "喝掉了（で→じゃう）。"}, {"t": "table", "head": ["原形", "口語縮約"], "rows": [["〜てしまう", "〜ちゃう"], ["〜でしまう", "〜じゃう"]]}, {"t": "h", "text": "八、逃げる／逃す"}, {"t": "note", "text": "逃げる（にげる）＝逃跑（自動詞）。逃す（のがす）＝錯失（他動詞）。"}, {"t": "ex", "jp": "犯人が逃げた。", "kana": "はんにんがにげた。", "zh": "犯人逃走了。"}, {"t": "ex", "jp": "チャンスが逃げてしまった。", "kana": "チャンスがにげてしまった。", "zh": "機會就這樣溜走了。"}, {"t": "ex", "jp": "チャンスを逃してしまった。", "kana": "チャンスをのがしてしまった。", "zh": "錯失了機會（日常標準用法）。"}, {"t": "ex", "jp": "チャンスが自分の手から逃げてしまった。", "kana": "チャンスがじぶんのてからにげてしまった。", "zh": "機會從自己的手中逃走了（眼睜睜看著機會溜走）。"}, {"t": "h", "text": "九、消える vs 消す"}, {"t": "note", "text": "消える（きえる）＝自己消失（自動詞）。消す（けす）＝把某物消掉（他動詞）。"}, {"t": "ex", "jp": "夢が消える。", "kana": "ゆめがきえる。", "zh": "夢想消失。"}, {"t": "ex", "jp": "写真を消す。", "kana": "しゃしんをけす。", "zh": "把照片刪掉。"}, {"t": "ex", "jp": "夢が消えてしまった。", "kana": "ゆめがきえてしまった。", "zh": "夢想竟然消失了、夢就這樣破滅了。"}, {"t": "ex", "jp": "夢が自分の手から消えてしまった。", "kana": "ゆめがじぶんのてからきえてしまった。", "zh": "夢想從自己的手中消失了（歌詞式表現）。"}, {"t": "h", "text": "十、Vる＋たび（に）"}, {"t": "note", "text": "句型：V辭書形＋たび（に）＝每當…的時候、每次…都…。"}, {"t": "ex", "jp": "彼を見るたびに、彼女を思い出す。", "kana": "かれをみるたびに、かのじょをおもいだす。", "zh": "每次看到他，就會想起她。"}, {"t": "sub", "text": "同一骨架換字：＿＿を見るたび（に）"}, {"t": "ex", "jp": "映画を見るたび。", "kana": "えいがをみるたび。", "zh": "每次看電影。"}, {"t": "ex", "jp": "写真を見るたび。", "kana": "しゃしんをみるたび。", "zh": "每次看照片。"}, {"t": "ex", "jp": "新聞を見るたび。", "kana": "しんぶんをみるたび。", "zh": "每次看報紙。"}, {"t": "ex", "jp": "テレビを見るたび。", "kana": "テレビをみるたび。", "zh": "每次看電視。"}, {"t": "ex", "jp": "母の写真を見るたび。", "kana": "ははのしゃしんをみるたび。", "zh": "每次看到母親的照片。"}, {"t": "ex", "jp": "桜を見るたび。", "kana": "さくらをみるたび。", "zh": "每次看到櫻花。"}, {"t": "ex", "jp": "孫を見るたび。", "kana": "まごをみるたび。", "zh": "每次看到孫子（孫＝まご，不是「たぶ」）。"}, {"t": "ex", "jp": "婿を見るたびに……", "kana": "むこをみるたびに……", "zh": "每次看到女婿…（婿＝むこ，女婿）。"}, {"t": "ex", "jp": "ポスターを見るたびに思い出す。", "kana": "ポスターをみるたびにおもいだす。", "zh": "每次看到那張海報，就會想起…。"}, {"t": "ex", "jp": "アメリカへ行くたびに、彼のことを思い出す。", "kana": "アメリカへいくたびに、かれのことをおもいだす。", "zh": "每次去美國，都會想起他。"}, {"t": "note", "text": "たび／たびに 皆可；完整敘述「行くたびに〜」很常見，歌詞為了節奏可能省略に。"}, {"t": "h", "text": "十一、淋しい笑顔がまた浮かぶ"}, {"t": "note", "text": "淋しい（さびしい）寂寞／笑顔（えがお）笑容／浮かぶ（うかぶ）浮起、浮現。"}, {"t": "ex", "jp": "淋しい笑顔がまた浮かぶ。", "kana": "さびしいえがおがまたうかぶ。", "zh": "那寂寞的笑容又浮現在腦海中。"}, {"t": "h", "text": "十二、浮かぶ（歌詞動詞）"}, {"t": "ex", "jp": "母の顔が心に浮かぶ。", "kana": "ははのかおがこころにうかぶ。", "zh": "母親的臉浮現在心中。"}, {"t": "ex", "jp": "昔の風景が目に浮かぶ。", "kana": "むかしのふうけいがめにうかぶ。", "zh": "昔日景象浮現在眼前。"}, {"t": "ex", "jp": "彼の笑顔を見るたび、昔の思い出が浮かぶ。", "kana": "かれのえがおをみるたび、むかしのおもいでがうかぶ。", "zh": "每當看到他的笑容，往日回憶便浮現。"}, {"t": "h", "text": "十三、微笑む vs 笑顔"}, {"t": "note", "text": "微笑む（ほほえむ）＝微笑（動詞）。笑顔（えがお）＝笑容（名詞）。"}, {"t": "ex", "jp": "彼女が微笑んだ。", "kana": "かのじょがほほえんだ。", "zh": "她微笑了。"}, {"t": "ex", "jp": "彼女の笑顔。", "kana": "かのじょのえがお。", "zh": "她的笑容。"}, {"t": "h", "text": "十四、今天三條主線"}, {"t": "table", "head": ["主線", "重點"], "rows": [["小さい → 小さな", "小さな 只能接名詞（連体詞）"], ["Vて＋しまう", "捨てる→捨ててしまった→捨てちゃった（完成／遺憾／不小心／無可挽回）"], ["Vる＋たび（に）", "写真を見るたびに／アメリカへ行くたびに＝每當…就…"]]}, {"t": "h", "text": "十五、把今天串成一段"}, {"t": "poem", "text": "小さな幸せさえも捨ててしまった。夢も自分の手から消えてしまった。それでも、彼の笑顔を見るたびに、あの日の思い出が心に浮かぶ。（小小的幸福，甚至連那一點幸福也捨棄了。夢想也從自己的手中消失了。然而，每當看到他的笑容，那一天的回憶仍會浮現在心中。）"}]}, {"date": "8/6", "title": "ようだ・みたいだ・らしい・でも・今でも", "subtitle": "ようだ／みたいだ／らしい・でも（連…都）・今でも・別れる・忘れられない・締め付ける", "sections": [{"t": "lead", "text": "本日重點：從一句歌詞抽換零件，練四套系統——像…一樣（ようだ／みたいだ）、聽說似乎（らしい）、連…都（でも）、直到現在仍然（今でも）。"}, {"t": "h", "text": "一、歌名與詞彙讀音"}, {"t": "table", "head": ["日文", "讀音", "中文"], "rows": [["襟裳岬", "えりもみさき", "襟裳岬"], ["津軽海峡冬景色", "つがるかいきょう・ふゆげしき", "津輕海峽冬景色"], ["女神", "めがみ", "女神"], ["散華", "さんげ", "散花；引申壯烈犧牲"], ["山梔子／梔子", "くちなし", "梔子花"], ["紐", "ひも", "繩子、帶子"], ["獅子", "しし", "獅子"], ["崩れる", "くずれる", "崩塌、瓦解"], ["締め付ける", "しめつける", "緊勒、壓迫"]]}, {"t": "h", "text": "二、歌詞核心句"}, {"t": "ex", "jp": "子供みたいな　あの日のおまえ", "kana": "こどもみたいな　あのひのおまえ", "zh": "那一天，那個像孩子一樣的你。"}, {"t": "note", "text": "「子供みたいな」與「あの日の」兩部分都在修飾最後的名詞「おまえ」。"}, {"t": "h", "text": "三、みたい 和 見たい 完全不同"}, {"t": "warn", "text": "⚠️ 常見錯誤：外は雨見たいだ ✗／彼女は天使見たいだ ✗。應為 みたいだ（○）。見たい＝想看；みたいだ＝好像、像。"}, {"t": "ex", "jp": "天使を見たい。", "kana": "てんしをみたい。", "zh": "我想看天使（見る＋たい＝想看）。"}, {"t": "ex", "jp": "彼女は天使みたいだ。", "kana": "かのじょはてんしみたいだ。", "zh": "她像天使一樣（みたいだ＝ようだ 的口語說法）。"}, {"t": "h", "text": "四、ようだ／みたいだ／らしい 比較"}, {"t": "table", "head": ["形式", "核心感覺", "依據", "語氣"], "rows": [["ようだ", "看來似乎、如同", "自己觀察、推理", "較正式、書面"], ["みたいだ", "好像、像", "自己感覺、觀察", "較口語"], ["らしい", "聽說、據說", "外來消息、間接資訊", "中性"], ["〜らしい", "很有…的樣子", "符合該身分的典型特質", "評價性"]]}, {"t": "sub", "text": "外面下雨的三種說法"}, {"t": "ex", "jp": "外は雨みたいだ。", "kana": "そとはあめみたいだ。", "zh": "外面好像在下雨（口語；聽到雨聲、看到別人撐傘）。"}, {"t": "ex", "jp": "外は雨のようだ。", "kana": "そとはあめのようだ。", "zh": "外面似乎在下雨（較正式、書面。名詞後要加 の）。"}, {"t": "ex", "jp": "外は雨らしい。", "kana": "そとはあめらしい。", "zh": "聽說／看樣子外面在下雨（間接資訊）。"}, {"t": "note", "text": "名詞接ようだ 要加の：天使のようだ／子供のようだ／夢のようだ。"}, {"t": "sub", "text": "同一句三種版本"}, {"t": "ex", "jp": "彼は疲れているようだ。", "kana": "かれはつかれているようだ。", "zh": "看來他累了（較客觀、正式；從表情動作推斷）。"}, {"t": "ex", "jp": "彼は疲れているみたいだ。", "kana": "かれはつかれているみたいだ。", "zh": "他好像累了（更像日常對話）。"}, {"t": "ex", "jp": "彼は疲れているらしい。", "kana": "かれはつかれているらしい。", "zh": "聽說他累了／他似乎很累（聽別人說或間接資訊）。"}, {"t": "h", "text": "五、連體修飾（後接名詞／動詞）"}, {"t": "table", "head": ["文末", "修飾名詞", "修飾動詞"], "rows": [["みたいだ", "みたいな＋名詞", "みたいに＋動詞"], ["ようだ", "ような＋名詞", "ように＋動詞"], ["らしい", "らしい＋名詞", "らしく＋動詞"]]}, {"t": "ex", "jp": "子供みたいだ。", "kana": "こどもみたいだ。", "zh": "像個孩子。"}, {"t": "ex", "jp": "子供みたいな人。", "kana": "こどもみたいなひと。", "zh": "像孩子一樣的人。"}, {"t": "ex", "jp": "子供みたいに遊ぶ。", "kana": "こどもみたいにあそぶ。", "zh": "像孩子一樣玩耍。"}, {"t": "ex", "jp": "子供のようだ。", "kana": "こどものようだ。", "zh": "像孩子一樣。"}, {"t": "ex", "jp": "子供のような人。", "kana": "こどものようなひと。", "zh": "像孩子一樣的人。"}, {"t": "ex", "jp": "子供のように遊ぶ。", "kana": "こどものようにあそぶ。", "zh": "像孩子一樣玩耍。"}, {"t": "h", "text": "六、子供みたい vs 子供らしい"}, {"t": "note", "text": "みたい 重點是「相似」（不一定真的是孩子）；らしい 這裡不是「聽說」，而是「符合該身分、很有那種典型樣子」。"}, {"t": "ex", "jp": "彼は子供みたいに笑う。", "kana": "かれはこどもみたいにわらう。", "zh": "他笑得像個孩子（相似）。"}, {"t": "ex", "jp": "子供らしい子供。", "kana": "こどもらしいこども。", "zh": "很有孩子樣子的孩子（天真、愛玩、好奇）。"}, {"t": "ex", "jp": "先生らしい先生。", "kana": "せんせいらしいせんせい。", "zh": "真正有教師風範的老師。"}, {"t": "sub", "text": "先生らしい 的兩種意思"}, {"t": "ex", "jp": "あの人は先生らしい。", "kana": "あのひとはせんせいらしい。", "zh": "①推測：聽說／那個人似乎是老師。"}, {"t": "ex", "jp": "先生らしい先生だ。", "kana": "せんせいらしいせんせいだ。", "zh": "②典型特質：是一位很有教師風範的老師。"}, {"t": "h", "text": "七、歌詞中的兩種「像」"}, {"t": "note", "text": "子供みたいな＝口語、親近、直接（像回憶中對戀人說話）。おまえのような＝更有歌詞感、文學感、抒情感。"}, {"t": "ex", "jp": "おまえのような花だった。", "kana": "おまえのようなはなだった。", "zh": "是像你一樣的花（結構：おまえ＋のような＋花）。"}, {"t": "ex", "jp": "おまえみたいな花だった。", "kana": "おまえみたいなはなだった。", "zh": "是像你一樣的花（口語改寫，不如ような抒情）。"}, {"t": "h", "text": "八、別れる／別れ／別れ別れ"}, {"t": "note", "text": "別れる（動詞，分開、分手）／別れ（名詞，離別）／別れ別れ（原本在一起的人分散）。"}, {"t": "ex", "jp": "彼と別れたい。", "kana": "かれとわかれたい。", "zh": "我想和他分手（人＋と＋別れる）。"}, {"t": "ex", "jp": "彼との別れ。", "kana": "かれとのわかれ。", "zh": "與他的離別。"}, {"t": "ex", "jp": "雨の日の別れ。", "kana": "あめのひのわかれ。", "zh": "雨天的離別。"}, {"t": "ex", "jp": "別れ別れになる。", "kana": "わかれわかれになる。", "zh": "變得分散各處。"}, {"t": "ex", "jp": "家族は別れ別れに暮らしている。", "kana": "かぞくはわかれわかれにくらしている。", "zh": "家人分散在不同地方生活。"}, {"t": "ex", "jp": "別々に出掛ける。", "kana": "べつべつにでかける。", "zh": "各自出門（別れ別れ 強調被迫分散）。"}, {"t": "h", "text": "九、でも（連…都／即使是…）"}, {"t": "note", "text": "句型：名詞＋でも。把通常認為不可能、不容易的極端例子提出來。"}, {"t": "ex", "jp": "先生でも分からない。", "kana": "せんせいでもわからない。", "zh": "連老師也不知道（老師通常應該知道，但難到連老師也不知道）。"}, {"t": "ex", "jp": "王様でも死ぬ。", "kana": "おうさまでもしぬ。", "zh": "即使是國王也會死。"}, {"t": "ex", "jp": "先生でもできない。", "kana": "せんせいでもできない。", "zh": "連老師也做不到。"}, {"t": "ex", "jp": "獅子でも負ける。", "kana": "ししでもまける。", "zh": "即使是獅子也會輸。"}, {"t": "ex", "jp": "弱い人間でも勝つ。", "kana": "よわいにんげんでもかつ。", "zh": "即使是弱小的人也可能獲勝。"}, {"t": "ex", "jp": "自分でもできない。", "kana": "じぶんでもできない。", "zh": "連我自己也做不到。"}, {"t": "warn", "text": "⚠️ 諺語是「猿も木から落ちる」（猴子也會從樹上摔下來），背諺語時不要改成 でも。"}, {"t": "sub", "text": "でも 需要後接主要內容"}, {"t": "ex", "jp": "雨でも行く。", "kana": "あめでもいく。", "zh": "即使下雨也要去（單寫「雨でも」語意不完整）。"}, {"t": "ex", "jp": "暇でも行かない。", "kana": "ひまでもいかない。", "zh": "即使有空也不去。"}, {"t": "ex", "jp": "暇なら行く。", "kana": "ひまならいく。", "zh": "有空的話就去（「有空的話」用 なら）。"}, {"t": "sub", "text": "でも 的另一種意思：…之類的"}, {"t": "ex", "jp": "汽車でも乗ろう。", "kana": "きしゃでものろう。", "zh": "搭個火車之類的吧（隨意舉出一個選項，不是「連火車都」）。"}, {"t": "h", "text": "十、今でも（直到現在仍然）"}, {"t": "note", "text": "今でも 的でも 帶有「即使已經到了現在，情況仍未改變」。"}, {"t": "ex", "jp": "今でも忘れない。", "kana": "いまでもわすれない。", "zh": "直到現在仍不忘記。"}, {"t": "ex", "jp": "今でも思い出す。", "kana": "いまでもおもいだす。", "zh": "直到現在仍會想起。"}, {"t": "table", "head": ["日文", "中文", "功能"], "rows": [["今でも", "直到現在仍然", "即使到現在情況沒變"], ["雨でも", "即使下雨、即使是雨天", "連…都／即使是"]]}, {"t": "h", "text": "十一、忘れない／忘れられない／忘れようがない"}, {"t": "note", "text": "語氣逐漸加強：仍然記得 → 情感上忘不掉 → 根本不可能忘記。"}, {"t": "ex", "jp": "今でも忘れない。", "kana": "いまでもわすれない。", "zh": "直到現在仍不忘記（主動記得、不願忘記）。"}, {"t": "ex", "jp": "今でも忘れられない。", "kana": "いまでもわすれられない。", "zh": "直到現在仍無法忘記（情感上忘不掉）。"}, {"t": "ex", "jp": "あの出来事は忘れようがない。", "kana": "あのできごとはわすれようがない。", "zh": "那件事根本不可能忘記（意向形＋がない＝想做也不可能）。"}, {"t": "table", "head": ["句子", "核心"], "rows": [["忘れられない", "感情上忘不掉"], ["忘れようがない", "客觀上、道理上根本不可能忘記"]]}, {"t": "h", "text": "十二、死んだ子の年を数える（諺語）"}, {"t": "note", "text": "字面：計算已過世孩子若仍活著現在幾歲。引申：對已無法挽回的事反覆悲傷、追想、後悔（明知沒結果仍不斷計算）。"}, {"t": "h", "text": "十三、思い出す／想い出す"}, {"t": "note", "text": "標準寫法思い出す（想起、回憶起）。想い出す 用於歌詞、小說、私人文字，刻意強調感情思念；正式文章優先用 思い出す。"}, {"t": "ex", "jp": "今でも死んだ子を思い出します。", "kana": "いまでもしんだこをおもいだします。", "zh": "直到現在，我仍會想起過世的孩子。"}, {"t": "h", "text": "十四、紐／紐付き"}, {"t": "note", "text": "紐（ひも）＝繩子、帶子。紐付き＝附有繩子的；引申「附帶條件的」。"}, {"t": "ex", "jp": "靴の紐。", "kana": "くつのひも。", "zh": "鞋帶。"}, {"t": "ex", "jp": "荷物を紐で縛る。", "kana": "にもつをひもでしばる。", "zh": "用繩子綁行李。"}, {"t": "ex", "jp": "紐付きの袋。", "kana": "ひもつきのふくろ。", "zh": "附繩子的袋子。"}, {"t": "ex", "jp": "紐付きの援助。", "kana": "ひもつきのえんじょ。", "zh": "附帶條件的援助。"}, {"t": "h", "text": "十五、締める／締め付ける"}, {"t": "note", "text": "締める＝一般綁緊、關緊、繫好。締め付ける＝用力勒緊、壓迫，使對方感到緊或痛。"}, {"t": "ex", "jp": "靴ひもを締める。", "kana": "くつひもをしめる。", "zh": "綁緊鞋帶（最自然的搭配）。"}, {"t": "ex", "jp": "ベルトが腰を締め付ける。", "kana": "ベルトがこしをしめつける。", "zh": "皮帶緊勒著腰。"}, {"t": "ex", "jp": "くちなしの花を見ると、あの日の別れが今でも心を締め付ける。", "kana": "くちなしのはなをみると、あのひのわかれがいまでもこころをしめつける。", "zh": "每當看見梔子花，那一天的離別至今仍緊緊揪住我的心。"}, {"t": "ex", "jp": "政府は企業活動を締め付ける。", "kana": "せいふはきぎょうかつどうをしめつける。", "zh": "政府嚴厲限制企業活動（比 制限する 更強烈負面）。"}, {"t": "h", "text": "十六、本課骨架總整理"}, {"t": "poem", "text": "子供みたいなあの日のおまえ → 名詞＋みたいな＋名詞 → 子供のようなおまえ → 名詞＋のような＋名詞 → 彼は疲れているようだ（推測：看起來…）→ 彼は疲れているらしい（傳聞：聽說、似乎…）。另一條：今でも忘れない → 今でも忘れられない → 今でも忘れようがない（語氣逐漸加強）。"}, {"t": "table", "head": ["形式", "核心"], "rows": [["みたいだ", "口語的「好像、像」"], ["ようだ", "較正式、根據觀察的「看來、如同」"], ["らしい", "根據消息的「聽說」，也表「很有…的樣子」"], ["でも", "提出極端例子：連…都、即使是…"], ["今でも", "即使到了現在，情況仍然沒變"]]}]}, {"date": "7/30", "title": "まで・ついて来る・てはいけない・使役", "subtitle": "まで三用法・ついて来る／就く・ては（反覆／禁止）・てはいけない／てはならない・困る／困らせる・使役形", "sections": [{"t": "lead", "text": "本日重點：まで的三種用法、ついて来る／就く、ては（反覆 vs 禁止）、てはいけない／てはならない、困る／困らせる、使役形。"}, {"t": "h", "text": "一、歌詞①"}, {"t": "ex", "jp": "くちなしの花の香りが旅路の果てまでついて来る。", "kana": "くちなしのはなのかおりがたびじのはてまでついてくる。", "zh": "梔子花的香氣，一路跟隨著我，直到旅途的盡頭。"}, {"t": "note", "text": "骨架：S が ＋ 地點／範圍 まで ＋ V。香りが／旅路の果てまで／ついて来る。"}, {"t": "h", "text": "二、旅路・果て・果てる"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["旅", "たび", "旅行、旅程"], ["旅路", "たびじ", "走過的旅途、人生旅程（較文學性）"], ["果て", "はて", "盡頭、終點、極限"], ["果てる", "はてる", "終結、結束、耗盡（下一段動詞）"]]}, {"t": "ex", "jp": "世界の果て。", "kana": "せかいのはて。", "zh": "世界的盡頭。"}, {"t": "ex", "jp": "空の果て。", "kana": "そらのはて。", "zh": "天空的盡頭。"}, {"t": "ex", "jp": "人生が果てる。", "kana": "じんせいがはてる。", "zh": "人生走到盡頭（文學性）。"}, {"t": "ex", "jp": "命が果てる。", "kana": "いのちがはてる。", "zh": "生命結束。"}, {"t": "ex", "jp": "旅が果てる。", "kana": "たびがはてる。", "zh": "旅程結束。"}, {"t": "ex", "jp": "戦いが果てる。", "kana": "たたかいがはてる。", "zh": "戰爭／戰鬥結束。"}, {"t": "ex", "jp": "力が果てる。", "kana": "ちからがはてる。", "zh": "力氣耗盡。"}, {"t": "h", "text": "三、果てることのない＋名詞"}, {"t": "note", "text": "句型：動詞辭書形＋ことのない＋名詞＝從未…的／不會…的…。果てる＋こと（名詞化）＋ない（沒有）＋名詞。"}, {"t": "ex", "jp": "果てることのない夢。", "kana": "はてることのないゆめ。", "zh": "永不終結的夢、沒有盡頭的夢。"}, {"t": "ex", "jp": "見たことのない景色。", "kana": "みたことのないけしき。", "zh": "從未見過的景色。"}, {"t": "ex", "jp": "忘れることのない思い出。", "kana": "わすれることのないおもいで。", "zh": "永遠不會忘記的回憶。"}, {"t": "h", "text": "四、助詞「まで」的三種用法"}, {"t": "sub", "text": "用法①：表示終點（A から B まで）"}, {"t": "ex", "jp": "東京から大阪まで新幹線で行く。", "kana": "とうきょうからおおさかまでしんかんせんでいく。", "zh": "搭新幹線從東京到大阪。"}, {"t": "sub", "text": "用法②：連…都…（接在出乎意料的事物後）"}, {"t": "ex", "jp": "子供まで参加した。", "kana": "こどもまでさんかした。", "zh": "連小孩子都參加了。"}, {"t": "ex", "jp": "親まで知らない。", "kana": "おやまでしらない。", "zh": "連父母都不知道。"}, {"t": "sub", "text": "用法③：接在助詞後，加強程度（にまで）"}, {"t": "ex", "jp": "夢にまで見た。", "kana": "ゆめにまでみた。", "zh": "甚至連作夢都夢見了。"}, {"t": "ex", "jp": "夢を見る。", "kana": "ゆめをみる。", "zh": "作夢（日文用「夢を見る」，不是「夢をする」）。"}, {"t": "ex", "jp": "夢に父さんを見た。", "kana": "ゆめにとうさんをみた。", "zh": "在夢中看見爸爸。"}, {"t": "ex", "jp": "夢にまで彼女を見た。", "kana": "ゆめにまでかのじょをみた。", "zh": "甚至連在夢中都看見她。"}, {"t": "ex", "jp": "夢にまで彼女が出てきた。", "kana": "ゆめにまでかのじょがでてきた。", "zh": "連夢中她都出現了。"}, {"t": "h", "text": "五、ついて来る／ついて行く／就く"}, {"t": "warn", "text": "⚠️ 表示「跟著某人」用 付いて来る／ついて来る，不寫 就いて来る。「就く」是就任職位、從事工作、師從某人。"}, {"t": "ex", "jp": "私について来てください。", "kana": "わたしについてきてください。", "zh": "請跟著我來。"}, {"t": "ex", "jp": "先生について行く。", "kana": "せんせいについていく。", "zh": "跟著老師去。"}, {"t": "table", "head": ["動詞", "基本方向", "中文"], "rows": [["来る", "朝說話者或基準點移動", "來"], ["行く", "離開說話者或基準點", "去"]]}, {"t": "ex", "jp": "ついて来てください。", "kana": "ついてきてください。", "zh": "請跟著我來（帶進自己的行動範圍，用来る）。"}, {"t": "ex", "jp": "彼は先生について行った。", "kana": "かれはせんせいについていった。", "zh": "他跟著老師走了（離開說話者，用行く）。"}, {"t": "ex", "jp": "ついて行くなら、やりましょう。", "kana": "ついていくなら、やりましょう。", "zh": "如果要跟著去，那就一起做吧（普通形＋なら＝如果是…的話）。"}, {"t": "h", "text": "六、について vs に就いて"}, {"t": "ex", "jp": "先生について研究する。", "kana": "せんせいについてけんきゅうする。", "zh": "研究「關於老師」的事情（Nについて＝關於N）。"}, {"t": "ex", "jp": "先生に就いて研究する。", "kana": "せんせいについてけんきゅうする。", "zh": "跟隨老師學習、在老師指導下研究（人に就く＝師從）。"}, {"t": "note", "text": "現代日文更常說：先生のもとで研究する（せんせいのもとでけんきゅうする，在老師指導下研究）。"}, {"t": "sub", "text": "職位／工作＋に就く"}, {"t": "ex", "jp": "社長に就く。", "kana": "しゃちょうにつく。", "zh": "就任社長。"}, {"t": "ex", "jp": "公務に就く。", "kana": "こうむにつく。", "zh": "從事公務。"}, {"t": "ex", "jp": "実業に就く。", "kana": "じつぎょうにつく。", "zh": "從事實業、工商業。"}, {"t": "h", "text": "七、歌詞②"}, {"t": "ex", "jp": "我儘言っては困らせた　子供みたいなあの日のお前", "kana": "わがままいってはこまらせた　こどもみたいなあのひのおまえ", "zh": "那時的你像個孩子，總是說著任性的話，讓我為難。"}, {"t": "h", "text": "八、我儘（わがまま）"}, {"t": "note", "text": "わがまま＝任性、任性的要求（名詞／ナ形容詞）。現代通常寫平假名，漢字「我儘」較少見。歌詞為了節奏省略助詞「を」：我儘言って＝我儘を言って。"}, {"t": "ex", "jp": "我儘な子供。", "kana": "わがままなこども。", "zh": "任性的孩子（ナ形容詞＋な＋名詞）。"}, {"t": "ex", "jp": "我儘を言う。", "kana": "わがままをいう。", "zh": "說任性的話、提出任性的要求。"}, {"t": "ex", "jp": "彼女の我儘も可愛い。", "kana": "かのじょのわがままもかわいい。", "zh": "連她任性的樣子也很可愛（も＝也、甚至連…都）。"}, {"t": "h", "text": "九、言う與云う"}, {"t": "note", "text": "言う（いう）＝說。「云う」較舊式、文學性，現代一般寫「言う」。"}, {"t": "table", "head": ["形式", "日文"], "rows": [["辭書形", "言う"], ["ます形", "言います"], ["て形", "言って"], ["過去形", "言った"], ["否定形", "言わない"]]}, {"t": "h", "text": "十、動詞て形＋は（反覆 vs 禁止）"}, {"t": "note", "text": "「ては」不一定是禁止，要看後面接什麼。用法①：每次做A就發生B（反覆）。"}, {"t": "ex", "jp": "我儘を言っては困らせた。", "kana": "わがままをいってはこまらせた。", "zh": "總是說任性的話，使我困擾。"}, {"t": "ex", "jp": "書いては消す。", "kana": "かいてはけす。", "zh": "寫了又擦、反覆寫了再擦。"}, {"t": "ex", "jp": "食べては寝る。", "kana": "たべてはねる。", "zh": "吃了又睡。"}, {"t": "ex", "jp": "思い出しては泣く。", "kana": "おもいだしてはなく。", "zh": "每次想起來就哭。"}, {"t": "h", "text": "十一、てはいけない／てはならない（禁止）"}, {"t": "note", "text": "公式：動詞て形＋は＋いけない／ならない。てはいけない＝日常、直接「不可以」；てはならない＝正式、規定性強「不得」。"}, {"t": "ex", "jp": "食べてはいけない。／食べてはならない。", "kana": "たべてはいけない。／たべてはならない。", "zh": "不可以吃。／不得食用。"}, {"t": "ex", "jp": "走ってはいけない。／走ってはならない。", "kana": "はしってはいけない。／はしってはならない。", "zh": "不可以跑。／不得奔跑。"}, {"t": "ex", "jp": "読んではいけない。／読んではならない。", "kana": "よんではいけない。／よんではならない。", "zh": "不可以讀。／不得閱讀。"}, {"t": "ex", "jp": "起きてはいけない。／起きてはならない。", "kana": "おきてはいけない。／おきてはならない。", "zh": "不可以起床。／不得起身。"}, {"t": "ex", "jp": "死んではいけない。／死んではならない。", "kana": "しんではいけない。／しんではならない。", "zh": "不可以死。／不得死去。"}, {"t": "ex", "jp": "この映画を見てはいけない。", "kana": "このえいがをみてはいけない。", "zh": "不可以看這部電影。"}, {"t": "ex", "jp": "来てはいけない。／来てはならない。", "kana": "きてはいけない。／きてはならない。", "zh": "不可以來。／不得前來。"}, {"t": "ex", "jp": "捨ててはいけない。／捨ててはならない。", "kana": "すててはいけない。／すててはならない。", "zh": "不可以丟掉。／不得丟棄。"}, {"t": "ex", "jp": "財布を落としてはいけない。", "kana": "さいふをおとしてはいけない。", "zh": "不可以把錢包弄丟。"}, {"t": "ex", "jp": "財布を落とさないようにしてください。", "kana": "さいふをおとさないようにしてください。", "zh": "請注意不要弄丟錢包（更自然的提醒）。"}, {"t": "h", "text": "十二、間違いがあってはいけない"}, {"t": "note", "text": "間違い（まちがい）＝錯誤（名詞）；間違う（まちがう）＝弄錯（動詞）。「有錯誤」要用名詞：間違いがある。"}, {"t": "ex", "jp": "間違いがある。", "kana": "まちがいがある。", "zh": "有錯誤。"}, {"t": "ex", "jp": "間違いがあってはいけない。", "kana": "まちがいがあってはいけない。", "zh": "不可以有錯誤。"}, {"t": "ex", "jp": "間違いがあってはならない。", "kana": "まちがいがあってはならない。", "zh": "不得有任何錯誤。"}, {"t": "ex", "jp": "間違ってはいけない。", "kana": "まちがってはいけない。", "zh": "不可以弄錯。"}, {"t": "table", "head": ["日文", "中文"], "rows": [["間違いがあってはいけない", "不可以存在錯誤"], ["間違ってはいけない", "不可以弄錯"]]}, {"t": "h", "text": "十三、開燈與關燈"}, {"t": "ex", "jp": "電灯を点ける。", "kana": "でんとうをつける。", "zh": "開燈（也常寫 電灯をつける／電気をつける）。"}, {"t": "ex", "jp": "電灯を点けてはいけない。", "kana": "でんとうをつけてはいけない。", "zh": "不可以開燈。"}, {"t": "ex", "jp": "電灯を消す。", "kana": "でんとうをけす。", "zh": "關燈。"}, {"t": "ex", "jp": "電灯を消してはいけない。", "kana": "でんとうをけしてはいけない。", "zh": "不可以關燈。"}, {"t": "h", "text": "十四、歌詞的「ては」不是禁止"}, {"t": "table", "head": ["句子", "意思"], "rows": [["我儘を言ってはいけない", "不可以說任性的話（ては＋いけない＝禁止）"], ["我儘を言っては困らせた", "總是說任性的話讓人困擾（ては＋結果＝反覆）"]]}, {"t": "note", "text": "判斷時一定要看「ては」後面接什麼。"}, {"t": "h", "text": "十五、困る／困らせる"}, {"t": "table", "head": ["日文", "平假名", "詞性", "中文"], "rows": [["困る", "こまる", "五段自動詞", "困擾、傷腦筋、為難"], ["困らせる", "こまらせる", "使役形", "使某人困擾"]]}, {"t": "ex", "jp": "兄が困る。", "kana": "あにがこまる。", "zh": "哥哥感到困擾。"}, {"t": "ex", "jp": "私は兄を困らせる。", "kana": "わたしはあにをこまらせる。", "zh": "我使哥哥困擾。"}, {"t": "table", "head": ["句型", "主體"], "rows": [["Aが困る", "A自己感到困擾"], ["BがAを困らせる", "B使A感到困擾"]]}, {"t": "h", "text": "十六、使役形"}, {"t": "note", "text": "使役形＝使某人做…、讓某人做…。五段：第一變（ア段）＋せる。一段：去る＋させる。"}, {"t": "table", "head": ["原形", "使役形", "平假名"], "rows": [["行く", "行かせる", "いかせる"], ["読む", "読ませる", "よませる"], ["話す", "話させる", "はなさせる"], ["困る", "困らせる", "こまらせる"], ["食べる", "食べさせる", "たべさせる"], ["起きる", "起きさせる", "おきさせる"], ["する", "させる", "させる"], ["来る", "来させる", "こさせる"]]}, {"t": "h", "text": "十七、使役句中的助詞"}, {"t": "sub", "text": "原動詞是自動詞（用を）"}, {"t": "ex", "jp": "弟が行く。", "kana": "おとうとがいく。", "zh": "弟弟去。"}, {"t": "ex", "jp": "母は弟を行かせる。", "kana": "はははおとうとをいかせる。", "zh": "媽媽讓弟弟去。"}, {"t": "ex", "jp": "妹が来る。", "kana": "いもうとがくる。", "zh": "妹妹來。"}, {"t": "ex", "jp": "母は妹を来させる。", "kana": "はははいもうとをこさせる。", "zh": "媽媽讓妹妹來。"}, {"t": "sub", "text": "原動詞是他動詞（用に，避免兩個を）"}, {"t": "ex", "jp": "弟がご飯を食べる。", "kana": "おとうとがごはんをたべる。", "zh": "弟弟吃飯。"}, {"t": "ex", "jp": "母は弟にご飯を食べさせる。", "kana": "はははおとうとにごはんをたべさせる。", "zh": "媽媽讓弟弟吃飯。"}, {"t": "note", "text": "因為句中已有「ご飯を」，若再說「弟を」會出現兩個を，結構不清，故使役對象改用「に」。母は／弟に／ご飯を／食べさせる。"}, {"t": "h", "text": "十八、歌詞的兩種表達方式"}, {"t": "ex", "jp": "お前は我儘を言っては私を困らせた。", "kana": "おまえはわがままをいってはわたしをこまらせた。", "zh": "你總是說任性的話，使我困擾（使役句，強調你造成我的困擾）。"}, {"t": "ex", "jp": "お前が我儘を言っては、私は困った。", "kana": "おまえがわがままをいっては、わたしはこまった。", "zh": "每當你說任性的話，我就很困擾（自動詞句，強調我感到困擾）。"}, {"t": "h", "text": "十九、子供みたいな"}, {"t": "note", "text": "名詞＋みたいな＋名詞＝像…一樣的…（較口語）。正式一點可說 子供のような人。"}, {"t": "ex", "jp": "子供みたいなあの日のお前。", "kana": "こどもみたいなあのひのおまえ。", "zh": "那時像孩子一樣的你。"}, {"t": "ex", "jp": "子供みたいな人。", "kana": "こどもみたいなひと。", "zh": "像孩子一樣的人。"}, {"t": "ex", "jp": "夢みたいな話。", "kana": "ゆめみたいなはなし。", "zh": "像夢一樣的故事。"}, {"t": "h", "text": "二十、兩句歌詞完整翻譯"}, {"t": "poem", "text": "くちなしの花の香りが旅路の果てまでついて来る：梔子花的香氣，一路跟隨著我，直到旅途的盡頭。"}, {"t": "poem", "text": "我儘言っては困らせた 子供みたいなあの日のお前：那時的你像個孩子，總是說著任性的話，使我為難。"}, {"t": "h", "text": "二十一、最重要的易錯點"}, {"t": "table", "head": ["主題", "正確", "錯誤"], "rows": [["跟著來", "ついて来る／付いて来る", "就いて来る"], ["師從老師", "先生に就いて研究する", "（先生について＝關於老師）"], ["有錯誤", "間違いがある", "間違うがある"], ["讓弟弟吃飯", "母は弟にご飯を食べさせる", "母は弟をご飯を食べさせる"], ["ては不一定禁止", "食べては寝る（反覆）", "（只有＋いけない才是禁止）"], ["歌詞省略助詞", "我儘を言っては", "（歌詞作 我儘言っては）"]]}]}, {"date": "7/16", "title": "今では・として・回る・ほど・噂・香り", "subtitle": "今は／今では・Nとして・戒指手指・回る・ほど・噂・広まる／広める・香り／匂い", "sections": [{"t": "lead", "text": "本日重點：今は／今では、Nとして、戒指與手指名稱、回る、ほど、噂、広まる／広める、香り／香／匂い。"}, {"t": "h", "text": "一、今は／今では"}, {"t": "note", "text": "今は（いまは）＝單純說明目前狀態，可能暗示以後不一定。今では（いまでは）＝到了現在、如今（含「以前不是這樣→經過變化→現在變成這樣」）。"}, {"t": "ex", "jp": "今は忙しい。", "kana": "いまはいそがしい。", "zh": "現在很忙。"}, {"t": "ex", "jp": "この町も、今では観光地として有名になった。", "kana": "このまちも、いまではかんこうちとしてゆうめいになった。", "zh": "這座城鎮如今也已經成為著名的觀光地。"}, {"t": "h", "text": "二、Nとして（作為…）"}, {"t": "note", "text": "句型：名詞＋として＝作為…、以…的身分。"}, {"t": "ex", "jp": "観光地として。", "kana": "かんこうちとして。", "zh": "作為觀光地、以觀光地的身分。"}, {"t": "ex", "jp": "先生として働く。", "kana": "せんせいとしてはたらく。", "zh": "以老師的身分工作。"}, {"t": "ex", "jp": "代表として参加する。", "kana": "だいひょうとしてさんかする。", "zh": "以代表的身分參加。"}, {"t": "h", "text": "三、今では＋能力／變化"}, {"t": "note", "text": "話せる＝能說。能力形前面的對象常用「が」：日本語が話せる。"}, {"t": "ex", "jp": "今では日本語が上手に話せる。", "kana": "いまではにほんごがじょうずにはなせる。", "zh": "如今已經能流利地說日文了。"}, {"t": "ex", "jp": "彼は昔は無名だったが、今では有名な歌手だ。", "kana": "かれはむかしはむめいだったが、いまではゆうめいなかしゅだ。", "zh": "他以前默默無名，但現在已經是著名歌手了。"}, {"t": "note", "text": "骨架：昔はAだったが、今ではBだ（以前是A，但現在已經是B）。昔（むかし）／無名（むめい）／有名（ゆうめい）／歌手（かしゅ）。"}, {"t": "h", "text": "四、戒指與手指名稱"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["婚約指輪", "こんやくゆびわ", "訂婚戒指"], ["結婚指輪", "けっこんゆびわ", "結婚戒指"], ["親指", "おやゆび", "大拇指"], ["人差し指", "ひとさしゆび", "食指"], ["中指", "なかゆび", "中指"], ["薬指", "くすりゆび", "無名指"], ["小指", "こゆび", "小指"]]}, {"t": "ex", "jp": "私は指輪を左手の薬指にはめる。", "kana": "わたしはゆびわをひだりてのくすりゆびにはめる。", "zh": "我把戒指戴在左手的無名指上。"}, {"t": "note", "text": "骨架：人は＋物を＋位置に＋はめる。「嵌める」可寫漢字，日常通常寫 はめる。"}, {"t": "h", "text": "五、回る（まわる）"}, {"t": "note", "text": "回る＝旋轉、繞行、轉動（五段自動詞）。回る→回って→回っている（正在持續）。"}, {"t": "ex", "jp": "風車が回る。", "kana": "かざぐるまがまわる。", "zh": "風車轉動。"}, {"t": "ex", "jp": "風車が回っている。", "kana": "かざぐるまがまわっている。", "zh": "風車正在轉動。"}, {"t": "ex", "jp": "地球は回っている。", "kana": "ちきゅうはまわっている。", "zh": "地球正在轉動。"}, {"t": "ex", "jp": "地球を一周回る。", "kana": "ちきゅうをいっしゅうまわる。", "zh": "繞地球一圈。"}, {"t": "ex", "jp": "地球の周りを一周する。", "kana": "ちきゅうのまわりをいっしゅうする。", "zh": "繞地球一周（更清楚的說法）。"}, {"t": "ex", "jp": "ロケットが地球を一周回っている。", "kana": "ロケットがちきゅうをいっしゅうまわっている。", "zh": "火箭正在繞地球一周。"}, {"t": "h", "text": "六、指輪も回るほど"}, {"t": "note", "text": "因為人變得太瘦，戒指在手指上變鬆，所以會轉動。"}, {"t": "ex", "jp": "指輪も回る。", "kana": "ゆびわもまわる。", "zh": "連戒指都會轉動。"}, {"t": "ex", "jp": "今ではお前は指輪も回るほど痩せてやつれた。", "kana": "いまではおまえはゆびわもまわるほどやせてやつれた。", "zh": "如今你已經瘦得憔悴，甚至連戒指都會在手指上轉動。"}, {"t": "h", "text": "七、ほど（到…的程度）"}, {"t": "note", "text": "句型：普通形＋ほど＝達到…的程度、如此地…。"}, {"t": "ex", "jp": "指輪も回るほど痩せた。", "kana": "ゆびわもまわるほどやせた。", "zh": "瘦到連戒指都會轉動的程度。"}, {"t": "ex", "jp": "酔うほど酒を飲む。", "kana": "ようほどさけをのむ。", "zh": "喝酒喝到醉的程度。"}, {"t": "ex", "jp": "私は死ぬほど疲れた。", "kana": "わたしはしぬほどつかれた。", "zh": "我累得要死（誇張程度，非真的死亡）。"}, {"t": "h", "text": "八、痩せる／やつれる"}, {"t": "note", "text": "痩せる（やせる）＝變瘦。やつれる＝因疾病、壓力、憂愁而憔悴。て形連接兩個狀態：痩せて＋やつれた＝瘦了又憔悴。"}, {"t": "ex", "jp": "痩せてやつれた。", "kana": "やせてやつれた。", "zh": "瘦了，而且變得憔悴。"}, {"t": "h", "text": "九、噂（うわさ）"}, {"t": "note", "text": "噂＝傳聞、謠言、風聲。"}, {"t": "ex", "jp": "噂をしていると、本人が来た。", "kana": "うわさをしていると、ほんにんがきた。", "zh": "正在談論某人時，本人就來了（動詞ている＋と，事件發生）。"}, {"t": "ex", "jp": "噂をすれば影が差す。", "kana": "うわさをすればかげがさす。", "zh": "說到某人某人就出現（＝說曹操曹操到）。"}, {"t": "h", "text": "十、広まる／広める"}, {"t": "table", "head": ["自動詞", "他動詞"], "rows": [["噂が広まる（傳聞傳開）", "人が噂を広める（人散播傳聞）"]]}, {"t": "ex", "jp": "変な噂が広まっている。", "kana": "へんなうわさがひろまっている。", "zh": "奇怪的傳聞正在流傳（自動詞：傳聞自己傳開）。"}, {"t": "ex", "jp": "張さんは噂を広める。", "kana": "ちょうさんはうわさをひろめる。", "zh": "張先生散播傳聞（他動詞）。"}, {"t": "ex", "jp": "噂を広めるのはよくない。", "kana": "うわさをひろめるのはよくない。", "zh": "散播謠言是不好的（の把動作名詞化）。"}, {"t": "h", "text": "十一、噂では〜そうだ（傳聞）"}, {"t": "note", "text": "噂では＝依照傳聞、據說。普通形＋そうだ＝聽說…。"}, {"t": "ex", "jp": "噂では、彼が日本へ行ったそうだ。", "kana": "うわさでは、かれがにほんへいったそうだ。", "zh": "據說他去了日本。"}, {"t": "h", "text": "十二、香・香り・匂い"}, {"t": "table", "head": ["日文", "平假名", "中文", "語感"], "rows": [["香り", "かおり", "香氣", "通常好聞、優雅"], ["匂い", "におい", "氣味", "中性，好壞皆可"], ["香", "か", "香氣", "文學、詩歌用語"]]}, {"t": "sub", "text": "香り（好聞、芬芳）"}, {"t": "ex", "jp": "花の香り。", "kana": "はなのかおり。", "zh": "花香。"}, {"t": "ex", "jp": "コーヒーの香り。", "kana": "コーヒーのかおり。", "zh": "咖啡香。"}, {"t": "ex", "jp": "お茶の香り。", "kana": "おちゃのかおり。", "zh": "茶香。"}, {"t": "ex", "jp": "ワインの香り。", "kana": "ワインのかおり。", "zh": "葡萄酒的香氣。"}, {"t": "ex", "jp": "薔薇の香り。", "kana": "ばらのかおり。", "zh": "玫瑰香。"}, {"t": "ex", "jp": "ジャスミンの香り。", "kana": "ジャスミンのかおり。", "zh": "茉莉花香。"}, {"t": "ex", "jp": "パンの香り。", "kana": "パンのかおり。", "zh": "麵包香。"}, {"t": "sub", "text": "香（文學、詩歌用法）"}, {"t": "ex", "jp": "花の香。", "kana": "はなのか。", "zh": "花香（一般日常會話用 花の香り）。"}, {"t": "sub", "text": "匂い（中性，好壞皆可）"}, {"t": "ex", "jp": "汗の匂い。", "kana": "あせのにおい。", "zh": "汗味。"}, {"t": "ex", "jp": "食べ物の匂い。", "kana": "たべもののにおい。", "zh": "食物的氣味。"}, {"t": "ex", "jp": "変な匂い。", "kana": "へんなにおい。", "zh": "奇怪的味道。"}, {"t": "h", "text": "十三、本課核心句型總整理"}, {"t": "table", "head": ["句型", "例句", "中文"], "rows": [["名詞の名詞", "花の香り／旅路の果て／左手の薬指", "花香／旅途盡頭／左手無名指"], ["地點まで", "旅路の果てまでついて来る", "一路跟到旅途的盡頭"], ["連…都", "子供まで参加した／夢にまで見た", "連小孩都參加／連夢都夢見"], ["て形＋はいけない", "食べてはいけない", "不可以吃"], ["て形＋は＋結果", "我儘を言っては困らせた", "總是任性讓人困擾"], ["五段第一變＋せる", "困る→困らせる／行く→行かせる", "使人困擾／讓人去"], ["普通形＋ほど", "指輪も回るほど痩せた／死ぬほど疲れた", "瘦到戒指會轉／累得要死"], ["自他動詞", "噂が広まる／人が噂を広める", "傳聞傳開／人散播傳聞"]]}]}, {"date": "7/9", "title": "判斷句・ような／ように・お前・やつれる", "subtitle": "名詞判斷句・のような／のように・あなた／君／お前・痩せる／やつれる・なさい・手指（p.191）", "sections": [{"t": "lead", "text": "本日重點：名詞判斷句（だ／です／だった／でした）、ような vs ように、あなた／君／お前 語感、痩せる／やつれる、なさい、痩せ我慢、手指名稱。"}, {"t": "h", "text": "一、歌詞原句"}, {"t": "ex", "jp": "山梔子の白い花　お前のような花だった。", "kana": "くちなしのしろいはな　おまえのようなはなだった。", "zh": "那朵白色的山梔子花，就像妳一樣。"}, {"t": "ex", "jp": "山梔子の白い花は、お前のような花だった。", "kana": "くちなしのしろいはなは、おまえのようなはなだった。", "zh": "（完整句型）那朵白色的山梔子花，是像妳一樣的花。"}, {"t": "h", "text": "二、句子骨架拆解"}, {"t": "note", "text": "① 山梔子の白い花は＝至於那朵白色的山梔子花（は 提示主題）。② お前のような花だった＝是像妳一樣的花（だった＝だ 的過去式）。"}, {"t": "table", "head": ["部分", "平假名", "中文"], "rows": [["山梔子", "くちなし", "山梔子、梔子花"], ["白い", "しろい", "白色的"], ["花", "はな", "花"], ["は", "は", "提示主題"], ["お前", "おまえ", "妳、你"], ["のような", "のような", "像…一樣的"], ["だった", "だった", "是…、曾是…"]]}, {"t": "h", "text": "三、名詞判斷句（SはPです）"}, {"t": "note", "text": "句型：主語は名詞です＝S 是 P。"}, {"t": "ex", "jp": "私は先生です。", "kana": "わたしはせんせいです。", "zh": "我是老師。"}, {"t": "ex", "jp": "私は先生でした。", "kana": "わたしはせんせいでした。", "zh": "我以前是老師。"}, {"t": "h", "text": "四、普通形與禮貌形"}, {"t": "table", "head": ["時態", "普通形", "禮貌形", "中文"], "rows": [["現在肯定", "だ", "です", "是"], ["過去肯定", "だった", "でした", "曾經是、以前是"]]}, {"t": "ex", "jp": "花だ。／花です。", "kana": "はなだ。／はなです。", "zh": "是花。"}, {"t": "ex", "jp": "花だった。／花でした。", "kana": "はなだった。／はなでした。", "zh": "以前是花／曾經是花。"}, {"t": "ex", "jp": "山梔子の白い花は、お前のような花だった。", "kana": "くちなしのしろいはなは、おまえのようなはなだった。", "zh": "山梔子的白花，是一朵像妳一樣的花。"}, {"t": "note", "text": "骨架＝S は P だった。S＝山梔子の白い花；P＝お前のような花。"}, {"t": "h", "text": "五、「よう」的核心文法"}, {"t": "note", "text": "よう 的漢字是「様（よう）」＝樣子、如同、像…一樣，現在通常寫平假名 よう。"}, {"t": "h", "text": "六、名詞＋のような＋名詞（像A一樣的B）"}, {"t": "note", "text": "句型：名詞A＋のような＋名詞B。後面接名詞，用「のような」。最後面的名詞才是真正的身分。"}, {"t": "ex", "jp": "汽車のようなおもちゃ。", "kana": "きしゃのようなおもちゃ。", "zh": "像火車一樣的玩具。"}, {"t": "ex", "jp": "公園のような城。", "kana": "こうえんのようなしろ。", "zh": "像公園一樣的城堡。"}, {"t": "ex", "jp": "城のような公園。", "kana": "しろのようなこうえん。", "zh": "像城堡一樣的公園。"}, {"t": "note", "text": "公園のような城→中心是「城」；城のような公園→中心是「公園」。"}, {"t": "ex", "jp": "子供のような先生。", "kana": "こどものようなせんせい。", "zh": "像小孩一樣的老師（真正身分是老師）。"}, {"t": "ex", "jp": "水のような顔。", "kana": "みずのようなかお。", "zh": "像水一樣的臉（需特殊情境：如水般平靜／透明的臉）。"}, {"t": "ex", "jp": "台北のような都会。", "kana": "たいぺいのようなとかい。", "zh": "像臺北一樣的都市。"}, {"t": "ex", "jp": "子供のような顔。", "kana": "こどものようなかお。", "zh": "像小孩一樣的臉、娃娃臉。"}, {"t": "ex", "jp": "雪のような肌。", "kana": "ゆきのようなはだ。", "zh": "像雪一樣的肌膚、雪白的肌膚。"}, {"t": "ex", "jp": "雪のような花。", "kana": "ゆきのようなはな。", "zh": "像雪一樣的花。"}, {"t": "ex", "jp": "雪のような薬。", "kana": "ゆきのようなくすり。", "zh": "像雪一樣的藥（像雪白／雪花散開的藥粉）。"}, {"t": "h", "text": "七、名詞＋のように＋動詞（像…一樣地做）"}, {"t": "note", "text": "句型：名詞＋のように＋動詞。後面接動詞，用「のように」。"}, {"t": "ex", "jp": "汽車のように走る。", "kana": "きしゃのようにはしる。", "zh": "像火車一樣奔跑。"}, {"t": "ex", "jp": "城のように立っている。", "kana": "しろのようにたっている。", "zh": "像城堡一樣矗立著。"}, {"t": "h", "text": "八、名詞＋のように＋い形容詞"}, {"t": "note", "text": "句型：名詞＋のように＋い形容詞＝像…一樣地呈現某種性質。"}, {"t": "ex", "jp": "汽車のように黒い。", "kana": "きしゃのようにくろい。", "zh": "像火車一樣黑。"}, {"t": "ex", "jp": "公園のように広い。", "kana": "こうえんのようにひろい。", "zh": "像公園一樣寬廣。"}, {"t": "ex", "jp": "子供のように若々しい。", "kana": "こどものようにわかわかしい。", "zh": "像小孩一樣充滿青春活力。"}, {"t": "ex", "jp": "雪のように白い。", "kana": "ゆきのようにしろい。", "zh": "像雪一樣白。"}, {"t": "h", "text": "九、名詞＋のように＋な形容詞"}, {"t": "note", "text": "句型：名詞＋のように＋な形容詞。な形容詞放句尾時不加「な」（きれいだ／静かだ）。"}, {"t": "ex", "jp": "汽車のように綺麗だ。", "kana": "きしゃのようにきれいだ。", "zh": "像火車一樣漂亮（需特殊情境）。"}, {"t": "ex", "jp": "公園のように静かだ。", "kana": "こうえんのようにしずかだ。", "zh": "像公園一樣安靜。"}, {"t": "ex", "jp": "雪のように綺麗だ。", "kana": "ゆきのようにきれいだ。", "zh": "像雪一樣美麗。"}, {"t": "h", "text": "十、ような vs ように 怎麼選？"}, {"t": "table", "head": ["「よう」後面接什麼", "使用形式", "例句"], "rows": [["名詞", "のような", "雪のような肌"], ["動詞", "のように", "汽車のように走る"], ["い形容詞", "のように", "雪のように白い"], ["な形容詞", "のように", "公園のように静かだ"]]}, {"t": "h", "text": "十一、あなた／君／お前 的差別"}, {"t": "ex", "jp": "あなたのような花。", "kana": "あなたのようなはな。", "zh": "像你一樣的花（中性；夫妻間也可表親愛）。"}, {"t": "ex", "jp": "君のような花。", "kana": "きみのようなはな。", "zh": "像妳一樣的花（較溫柔；男性對平輩、晚輩或親密對象）。"}, {"t": "ex", "jp": "お前のような花。", "kana": "おまえのようなはな。", "zh": "像妳一樣的花（粗獷、上對下、男性語氣或親密伴侶語感）。"}, {"t": "poem", "text": "昭和男性歌曲中「お前」常帶「粗獷但深情的男性語氣」。歌詞用「お前のような花だった」不一定是不尊重，而是符合歌曲人物的年代與男性形象。"}, {"t": "h", "text": "十二、痩せる／やつれる"}, {"t": "table", "head": ["單字", "平假名", "重點", "中文"], "rows": [["痩せる", "やせる", "體重或身材變瘦", "變瘦"], ["やつれる", "やつれる", "因疾病、悲傷、疲勞而消瘦憔悴", "憔悴"]]}, {"t": "note", "text": "痩せる 可以是刻意減肥，也可以是因病變瘦。やつれる（漢字「窶れる」較少用）不只體重輕，而是整個人又瘦、又累、又沒精神。"}, {"t": "ex", "jp": "ダイエットで痩せた。", "kana": "ダイエットでやせた。", "zh": "因為減肥而瘦了。"}, {"t": "ex", "jp": "病気でだいぶ痩せた。", "kana": "びょうきでだいぶやせた。", "zh": "因為生病，瘦了很多（だいぶ＝相當、很多）。"}, {"t": "ex", "jp": "病気でやつれた。", "kana": "びょうきでやつれた。", "zh": "因為生病而變得憔悴。"}, {"t": "ex", "jp": "失恋でやつれた。", "kana": "しつれんでやつれた。", "zh": "因為失戀而變得憔悴。"}, {"t": "ex", "jp": "家族を失い、母はすっかりやつれた。", "kana": "かぞくをうしない、はははすっかりやつれた。", "zh": "失去家人後，母親整個人完全憔悴了。"}, {"t": "ex", "jp": "お前が痩せてやつれた。", "kana": "おまえがやせて、やつれた。", "zh": "妳瘦了，也變得憔悴了。"}, {"t": "note", "text": "痩せる 是第二類動詞：痩せる → 去る → 加て → 痩せて。"}, {"t": "h", "text": "十三、「で」表示原因"}, {"t": "note", "text": "句型：名詞＋で＋結果＝因為…而…。"}, {"t": "ex", "jp": "ダイエットで痩せた。", "kana": "ダイエットでやせた。", "zh": "因為減肥而瘦了。"}, {"t": "ex", "jp": "病気で痩せた。", "kana": "びょうきでやせた。", "zh": "因為生病而瘦了。"}, {"t": "ex", "jp": "病気でやつれた。", "kana": "びょうきでやつれた。", "zh": "因為生病而憔悴。"}, {"t": "ex", "jp": "失恋でやつれた。", "kana": "しつれんでやつれた。", "zh": "因為失戀而憔悴。"}, {"t": "h", "text": "十四、動詞＋なさい"}, {"t": "note", "text": "我慢する（がまんする）＝忍耐、忍住、克制。句型：動詞ます形去ます＋なさい（我慢します→我慢し＋なさい）。命令、指示語氣，比命令形溫和但非一般禮貌請求。"}, {"t": "ex", "jp": "我慢しなさい。", "kana": "がまんしなさい。", "zh": "忍耐一下、你要忍住。"}, {"t": "ex", "jp": "我慢してください。", "kana": "がまんしてください。", "zh": "請忍耐一下。"}, {"t": "table", "head": ["日文", "中文", "語氣"], "rows": [["我慢しなさい", "你要忍住", "指示、命令"], ["我慢してください", "請忍耐一下", "禮貌請求"]]}, {"t": "h", "text": "十五、痩せ我慢（やせがまん）"}, {"t": "note", "text": "痩せ我慢＝硬撐、逞強、明明很難受卻假裝沒事、打腫臉充胖子。是一個完整單字，表示「即使能力不足或內心痛苦，仍勉強假裝撐得住」。"}, {"t": "ex", "jp": "痩せ我慢をしないでください。", "kana": "やせがまんをしないでください。", "zh": "請不要逞強。"}, {"t": "h", "text": "十六、手指名稱"}, {"t": "table", "head": ["漢字", "平假名", "中文"], "rows": [["指", "ゆび", "手指"], ["指輪", "ゆびわ", "戒指（指＋輪＝環、圈）"], ["親指", "おやゆび", "大拇指"], ["人差し指", "ひとさしゆび", "食指（用來指人的手指）"], ["中指", "なかゆび", "中指"], ["薬指", "くすりゆび", "無名指（與過去用此指調藥、塗藥有關）"], ["小指", "こゆび", "小指"]]}, {"t": "h", "text": "十七、本課核心總整理"}, {"t": "table", "head": ["文法", "句型", "中文"], "rows": [["名詞判斷句", "SはPです／でした", "S是P／S以前是P"], ["像…的名詞", "名詞＋のような＋名詞", "雪のような肌＝像雪一樣的肌膚"], ["像…地＋動詞", "名詞＋のように＋動詞", "汽車のように走る＝像火車一樣奔跑"], ["像…地＋形容詞", "名詞＋のように＋形容詞", "雪のように白い／公園のように静かだ"], ["因為…而…", "名詞＋で＋結果", "病気で痩せた／失恋でやつれた"], ["痩せる vs やつれる", "—", "變瘦 vs 因病悲傷疲累而憔悴"]]}, {"t": "h", "text": "十八、歌詞完整理解"}, {"t": "poem", "text": "山梔子の白い花は、お前のような花だった（S は P だった）。逐字：山梔子的／至於白色的花／像妳一樣的／是一朵花。這句不只在形容花——看到潔白的山梔子花，就想起那位純潔、安靜而令人懷念的女子。"}]}, {"date": "7/2", "title": "てしまう・さえも・たびに・浮かぶ", "subtitle": "てしまう・さえも・たびに・浮かぶ／浮く・寂しい／淋しい／侘しい・笑顔", "sections": [{"t": "lead", "text": "本日重點：てしまう、さえも、たびに、浮かぶ／浮く，以及寂しい／淋しい／侘しい、笑顔系列。"}, {"t": "h", "text": "一、歌詞主句①"}, {"t": "ex", "jp": "小さな幸せ　それさえも　捨ててしまった　自分の手から", "kana": "ちいさなしあわせ　それさえも　すててしまった　じぶんのてから", "zh": "小小的幸福，連那樣的幸福，也從自己的手中親手捨棄了。"}, {"t": "h", "text": "二、句子還原（一步步加長）"}, {"t": "note", "text": "捨てる：原型／ます形＝捨てます／て形＝捨てて／た形＝捨てた。"}, {"t": "ex", "jp": "それを捨てる。", "kana": "それをすてる。", "zh": "丟掉那個、捨棄那個。"}, {"t": "ex", "jp": "それを自分の手から捨ててしまった。", "kana": "それをじぶんのてからすててしまった。", "zh": "把那個從自己的手中捨棄掉了。"}, {"t": "ex", "jp": "私はそれを自分の手から捨ててしまった。", "kana": "わたしはそれをじぶんのてからすててしまった。", "zh": "我把那個從自己的手中捨棄掉了。"}, {"t": "ex", "jp": "私は小さな幸せを自分の手から捨ててしまった。", "kana": "わたしはちいさなしあわせをじぶんのてからすててしまった。", "zh": "我把小小的幸福，從自己的手中捨棄掉了。"}, {"t": "ex", "jp": "私は小さな幸せさえも自分の手から捨ててしまった。", "kana": "わたしはちいさなしあわせさえもじぶんのてからすててしまった。", "zh": "我連小小的幸福，也從自己的手中捨棄掉了。"}, {"t": "h", "text": "三、重點文法①：てしまう"}, {"t": "note", "text": "句型：動詞て形＋しまう／しまった。意思：① 做完了；② 做掉了；③ 帶有後悔、遺憾、無法挽回的感覺。"}, {"t": "ex", "jp": "捨ててしまった。", "kana": "すててしまった。", "zh": "捨棄掉了、不小心捨棄了、已經捨棄了（帶後悔感）。"}, {"t": "note", "text": "拆解：捨てる（丟掉）→ 捨てて（て形）＋ しまった（しまう的過去式）。"}, {"t": "h", "text": "四、重點文法②：さえも"}, {"t": "note", "text": "句型：名詞＋さえも＝連…也、甚至連…都。「さえも」比「も」更強。"}, {"t": "ex", "jp": "小さな幸せさえも捨ててしまった。", "kana": "ちいさなしあわせさえもすててしまった。", "zh": "連小小的幸福也捨棄掉了。"}, {"t": "poem", "text": "不是普通的「也」，而是「連這麼重要／這麼基本的東西都…」。"}, {"t": "h", "text": "五、歌詞主句②"}, {"t": "ex", "jp": "くちなしの花を見るたび　淋しい笑顔がまた浮かぶ", "kana": "くちなしのはなをみるたび　さびしいえがおがまたうかぶ", "zh": "每當看見梔子花，那寂寞的笑容又再次浮現在眼前。"}, {"t": "h", "text": "六、重點文法③：たびに（每次…就…）"}, {"t": "note", "text": "句型：動詞原型＋たびに／名詞＋の＋たびに＝每次…就…、每當…就…。重點：たび 前面接「原型」。"}, {"t": "ex", "jp": "くちなしの花を見るたび。", "kana": "くちなしのはなをみるたび。", "zh": "每當看見梔子花。"}, {"t": "ex", "jp": "先生に会うたび緊張する。", "kana": "せんせいにあうたびきんちょうする。", "zh": "每次見到老師就緊張。"}, {"t": "ex", "jp": "映画を見るたびに泣いてしまいます。", "kana": "えいがをみるたびにないてしまいます。", "zh": "每次看電影都會哭出來。"}, {"t": "ex", "jp": "アメリカへ行く度にパソコンを買います。", "kana": "アメリカへいくたびにパソコンをかいます。", "zh": "每次去美國都買電腦。"}, {"t": "ex", "jp": "電車に乗るたびに駅弁を買います。", "kana": "でんしゃにのるたびにえきべんをかいます。", "zh": "每次搭電車都買車站便當。"}, {"t": "ex", "jp": "お弁当を買うたびにコーラを買います。", "kana": "おべんとうをかうたびにコーラをかいます。", "zh": "每次買便當都買可樂。"}, {"t": "ex", "jp": "本を読むたびに寝てしまう。", "kana": "ほんをよむたびにねてしまう。", "zh": "每次讀書就睡著了（帶「不小心又睡了」的感覺）。"}, {"t": "ex", "jp": "子供は台湾へ帰るたびに喜ぶ。", "kana": "こどもはたいわんへかえるたびによろこぶ。", "zh": "孩子每次回台灣都很高興。"}, {"t": "h", "text": "七、單字：喜ぶ"}, {"t": "note", "text": "喜ぶ（よろこぶ）＝高興、歡喜。"}, {"t": "ex", "jp": "父は喜んでいる。", "kana": "ちちはよろこんでいる。", "zh": "父親正在高興、父親很高興。"}, {"t": "h", "text": "八、單字：寂しい／淋しい／侘しい"}, {"t": "table", "head": ["日文", "平假名", "中文", "語感"], "rows": [["寂しい", "さびしい／さみしい", "寂寞的、冷清的", "い形容詞，寂しい＋名詞"], ["淋しい", "さびしい／さみしい", "寂寞的、孤單的", "偏情感上的孤單、寂寞"], ["侘しい", "わびしい", "淒涼的、落寞的、寂寥的", "日本美學「侘び」，孤寂、樸素、蕭瑟"]]}, {"t": "ex", "jp": "寂しい笑顔。", "kana": "さびしいえがお。", "zh": "寂寞的笑容。"}, {"t": "h", "text": "九、單字：笑顔・顔・微笑み・微笑む"}, {"t": "table", "head": ["日文", "平假名", "中文", "詞性"], "rows": [["笑顔", "えがお", "笑臉、笑容", "名詞（笑＋顔）"], ["顔", "かお", "臉", "名詞"], ["微笑み", "ほほえみ", "微笑", "名詞"], ["微笑む", "ほほえむ", "微笑", "動詞"]]}, {"t": "h", "text": "十、重點動詞：浮かぶ（うかぶ）"}, {"t": "note", "text": "浮かぶ＝浮現、浮起、浮在表面、想起。用法：① 物理浮在水面；② 影像浮現眼前；③ 想法浮現腦中；④ 淚水浮現眼中。"}, {"t": "ex", "jp": "池に花が浮かんでいる。", "kana": "いけにはながうかんでいる。", "zh": "花浮在池塘上。"}, {"t": "ex", "jp": "私の目に彼女の姿が浮かんでいる。", "kana": "わたしのめにかのじょのすがたがうかんでいる。", "zh": "她的身影浮現在我的眼前。"}, {"t": "ex", "jp": "いいアイデアが浮かんだ。", "kana": "いいアイデアがうかんだ。", "zh": "我想到一個好主意、好點子浮現了。"}, {"t": "ex", "jp": "目に涙が浮かんでいる。", "kana": "めになみだがうかんでいる。", "zh": "眼中浮著淚水。"}, {"t": "h", "text": "十一、浮く（うく）"}, {"t": "note", "text": "浮く＝浮起來、漂浮。比較：浮く 偏「物理性地浮起來」；浮かぶ 可物理漂浮，也可影像、想法、回憶浮現。"}, {"t": "ex", "jp": "水に油が浮く。", "kana": "みずにあぶらがうく。", "zh": "油浮在水上。"}, {"t": "ex", "jp": "木は水に浮く。", "kana": "きはみずにうく。", "zh": "木頭會浮在水上。"}, {"t": "ex", "jp": "船が海に浮く。", "kana": "ふねがうみにうく。", "zh": "船浮在海上。"}, {"t": "ex", "jp": "体は海に浮いている。", "kana": "からだはうみにういている。", "zh": "身體浮在海上。"}, {"t": "ex", "jp": "石油は海に浮いている。", "kana": "せきゆはうみにういている。", "zh": "石油浮在海面上。"}, {"t": "h", "text": "十二、本課總整理"}, {"t": "table", "head": ["文法／單字", "平假名", "中文", "例句"], "rows": [["てしまう", "すててしまった", "捨棄掉了（帶後悔感）", "捨ててしまった"], ["さえも", "さえも", "連…也", "小さな幸せさえも"], ["たびに", "たびに", "每次…就…", "先生に会うたび緊張する"], ["浮かぶ", "うかぶ", "浮現、想起", "淋しい笑顔がまた浮かぶ"], ["浮く", "うく", "浮起來、漂浮", "水に油が浮く"]]}, {"t": "h", "text": "十三、歌詞句完整理解"}, {"t": "poem", "text": "小さな幸せさえも 捨ててしまった 自分の手から：連小小的幸福也捨棄掉了，而且是從自己手中失去——不是別人奪走，而是我親手把原本握在手中的小小幸福也放掉了。"}, {"t": "poem", "text": "くちなしの花を見るたび 淋しい笑顔がまた浮かぶ：梔子花成為記憶的開關。每次一看見它，那個人寂寞的笑容就又浮現在眼前。"}]}, {"date": "6/25", "title": "別れる・小さな・さえ・てしまう", "subtitle": "別れる／分かれる・今でも・忘れられない・小さい／小さな・捨てる・さえ・てしまう", "sections": [{"t": "lead", "text": "本日重點：別れる／分かれる、今でも、忘れられない、小さい／小さな、小さくする、捨てる、さえ、てしまう。"}, {"t": "h", "text": "一、別れ／別れる／分かれる"}, {"t": "table", "head": ["日文", "平假名", "中文", "詞性"], "rows": [["別れ", "わかれ", "離別、分別", "名詞"], ["別れる", "わかれる", "分手、離別、分開", "動詞"], ["分かれる", "わかれる", "分歧、分成幾條路", "動詞"]]}, {"t": "ex", "jp": "雨の別れ。", "kana": "あめのわかれ。", "zh": "雨中的離別。"}, {"t": "ex", "jp": "山梔子の雨の別れ。", "kana": "くちなしのあめのわかれ。", "zh": "梔子花雨中的離別。"}, {"t": "ex", "jp": "お前と別れたい。", "kana": "おまえとわかれたい。", "zh": "我想和你分手。"}, {"t": "ex", "jp": "恋人と別れる。", "kana": "こいびととわかれる。", "zh": "和戀人分手。"}, {"t": "ex", "jp": "昨日、彼と別れた。", "kana": "きのう、かれとわかれた。", "zh": "昨天和他分手了。"}, {"t": "ex", "jp": "道が分かれる。", "kana": "みちがわかれる。", "zh": "道路分岔。"}, {"t": "sub", "text": "別れる vs 分かれる 分辨"}, {"t": "table", "head": ["日文", "平假名", "用法"], "rows": [["別れる", "わかれる", "人和人分開（離別、分手）"], ["分かれる", "わかれる", "道路、意見、方向分開（分歧、分岔）"]]}, {"t": "note", "text": "恋人（こいびと，戀人）／恋（こい，戀愛）／人（ひと／びと，人）。"}, {"t": "h", "text": "二、敬語：済まない／済みません"}, {"t": "table", "head": ["日文", "平假名", "中文", "語氣"], "rows": [["済まない", "すまない", "抱歉、對不起", "較直接，男性語氣常見"], ["済みません", "すみません", "對不起、不好意思", "較禮貌"]]}, {"t": "ex", "jp": "済まない。", "kana": "すまない。", "zh": "抱歉。"}, {"t": "ex", "jp": "済みません。", "kana": "すみません。", "zh": "不好意思。"}, {"t": "h", "text": "三、名詞＋でも／今でも"}, {"t": "note", "text": "今でも（いまでも）＝即使到現在仍然。名詞＋でも＝即使是…也…、連…也…。"}, {"t": "ex", "jp": "今でも彼が忘れられない。", "kana": "いまでもかれがわすれられない。", "zh": "到現在還是忘不了他。"}, {"t": "h", "text": "四、忘れる／忘れられる／忘れられない"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["忘れる", "わすれる", "忘記"], ["忘れられる", "わすれられる", "能忘記／被忘記"], ["忘れられない", "わすれられない", "忘不了、無法忘記"], ["亡き", "なき", "已故的、過世的"]]}, {"t": "ex", "jp": "彼を忘れる。", "kana": "かれをわすれる。", "zh": "忘記他。"}, {"t": "ex", "jp": "彼氏が忘れられない。", "kana": "かれしがわすれられない。", "zh": "忘不了男朋友。"}, {"t": "ex", "jp": "彼女が忘れられない。", "kana": "かのじょがわすれられない。", "zh": "忘不了女朋友。"}, {"t": "ex", "jp": "亡き母が忘れられない。", "kana": "なきははがわすれられない。", "zh": "忘不了已故的母親。"}, {"t": "h", "text": "五、小さい／小さな"}, {"t": "sub", "text": "小さい（ちいさい，い形容詞）"}, {"t": "line", "jp": "小さい子供／小さい会社／小さい公園", "kana": "ちいさいこども／ちいさいかいしゃ／ちいさいこうえん"}, {"t": "line", "jp": "小さい劇場／小さい部屋／小さい山／小さい声", "kana": "ちいさいげきじょう／ちいさいへや／ちいさいやま／ちいさいこえ"}, {"t": "sub", "text": "小さな（ちいさな，連體詞，只能接名詞）"}, {"t": "line", "jp": "小さな会社／小さな幸せ／小さな声", "kana": "ちいさなかいしゃ／ちいさなしあわせ／ちいさなこえ"}, {"t": "table", "head": ["用法", "例句", "中文"], "rows": [["小さい＋名詞", "小さい会社", "小公司"], ["小さな＋名詞", "小さな会社", "小小的公司"], ["小さい＋とき", "小さいとき", "小時候"], ["小さな＋名詞", "小さな声", "小小的聲音"]]}, {"t": "warn", "text": "⚠️ 小さい 是形容詞；小さな 只能放名詞前面。小さいとき ✅，小さなとき 文法上少見，通常說 小さいとき。"}, {"t": "h", "text": "六、小さくない／小さくする"}, {"t": "note", "text": "否定：小さい → 小さくない。"}, {"t": "line", "jp": "小さくない会社／小さくない公園／小さくない部屋／小さくない山", "kana": "ちいさくないかいしゃ／ちいさくないこうえん／ちいさくないへや／ちいさくないやま"}, {"t": "note", "text": "小さくする（ちいさくする）＝把…變小。句型：名詞を小さくする。"}, {"t": "ex", "jp": "パンを小さくしてください。", "kana": "パンをちいさくしてください。", "zh": "請把麵包變小一點。"}, {"t": "ex", "jp": "戸を小さくする。", "kana": "とをちいさくする。", "zh": "把門變小。"}, {"t": "ex", "jp": "窓を小さくしてください。", "kana": "まどをちいさくしてください。", "zh": "請把窗戶變小。"}, {"t": "ex", "jp": "椅子を小さくしてください。", "kana": "いすをちいさくしてください。", "zh": "請把椅子變小。"}, {"t": "ex", "jp": "椅子を小さくします。", "kana": "いすをちいさくします。", "zh": "把椅子變小。"}, {"t": "h", "text": "七、捨てる"}, {"t": "note", "text": "捨てる（すてる）＝丟掉、拋棄、捨棄。"}, {"t": "ex", "jp": "ゴミを捨てる。", "kana": "ゴミをすてる。", "zh": "丟垃圾。"}, {"t": "ex", "jp": "本を捨てる。", "kana": "ほんをすてる。", "zh": "丟書。"}, {"t": "ex", "jp": "手紙を捨てる。", "kana": "てがみをすてる。", "zh": "丟信。"}, {"t": "ex", "jp": "権利を捨てる。", "kana": "けんりをすてる。", "zh": "放棄權利。"}, {"t": "ex", "jp": "世を捨てる。", "kana": "よをすてる。", "zh": "遁世、拋棄世俗。"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["権利", "けんり", "權利"], ["世", "よ", "世間、人世"], ["浮世", "うきよ", "浮世、人間世俗"], ["浮世絵", "うきよえ", "浮世繪"], ["浮く", "うく", "浮起來"], ["浮き", "うき", "浮、浮標；浮起的狀態"]]}, {"t": "h", "text": "八、捨てられる／捨てられた（被動）"}, {"t": "table", "head": ["原形", "平假名", "被動形", "平假名", "中文"], "rows": [["捨てる", "すてる", "捨てられる", "すてられる", "被拋棄、被丟掉"]]}, {"t": "ex", "jp": "捨てられた。", "kana": "すてられた。", "zh": "被拋棄了。"}, {"t": "note", "text": "上下一段・カ變 ＋ られる。捨てる 是下一段動詞：捨てる → 捨てられる → 捨てられた。来る → 来られる。"}, {"t": "h", "text": "九、好き／愛する／惚れる"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["好き", "すき", "喜歡"], ["愛する", "あいする", "愛"], ["惚れる", "ほれる", "愛上、迷戀"]]}, {"t": "ex", "jp": "私は彼女に惚れた。", "kana": "わたしはかのじょにほれた。", "zh": "我愛上她了。"}, {"t": "ex", "jp": "惚れて捨てられた。", "kana": "ほれてすてられた。", "zh": "愛上了，卻被拋棄了。"}, {"t": "h", "text": "十、さえ／さえも"}, {"t": "note", "text": "名詞＋さえ＝連…都、甚至…。さえも 語氣比さえ更強。"}, {"t": "sub", "text": "肯定句"}, {"t": "ex", "jp": "彼さえ来る。", "kana": "かれさえくる。", "zh": "連他都來。"}, {"t": "ex", "jp": "雪さえ降った。", "kana": "ゆきさえふった。", "zh": "連雪都下了。"}, {"t": "sub", "text": "否定句"}, {"t": "ex", "jp": "彼は名前さえ書かない。", "kana": "かれはなまえさえかかない。", "zh": "他連名字都不寫。"}, {"t": "ex", "jp": "彼は水さえ飲まない。", "kana": "かれはみずさえのまない。", "zh": "他連水都不喝。"}, {"t": "poem", "text": "さえ 是把事情推到極端。「水を飲まない」只是說不喝水；「水さえ飲まない」是說連最基本的水都不喝。"}, {"t": "h", "text": "十一、てしまう"}, {"t": "note", "text": "動詞て形＋しまう，兩種意思：① 完成（把事情做完）；② 遺憾、後悔（不小心做了、竟然做了）。しまう／仕舞う（しまう，收拾、結束）。"}, {"t": "ex", "jp": "本を読んでしまう。", "kana": "ほんをよんでしまう。", "zh": "把書讀完；不小心把書讀完了。"}, {"t": "ex", "jp": "小さな幸せを捨ててしまった。", "kana": "ちいさなしあわせをすててしまった。", "zh": "把小小的幸福給捨棄了。"}, {"t": "ex", "jp": "小さな幸せさえ捨てた。", "kana": "ちいさなしあわせさえすてた。", "zh": "連小小的幸福都捨棄了。"}, {"t": "ex", "jp": "小さな幸せさえも捨ててしまった。", "kana": "ちいさなしあわせさえもすててしまった。", "zh": "甚至連小小的幸福都捨棄掉了。"}, {"t": "h", "text": "十二、自分の手から"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["自分", "じぶん", "自己"], ["手", "て", "手"], ["から", "から", "從…"], ["自分の手から", "じぶんのてから", "從自己的手中"]]}, {"t": "ex", "jp": "小さな幸せを自分の手から捨ててしまった。", "kana": "ちいさなしあわせをじぶんのてからすててしまった。", "zh": "親手把小小的幸福捨棄掉了。"}, {"t": "ex", "jp": "小さな幸せさえも自分の手から捨ててしまった。", "kana": "ちいさなしあわせさえもじぶんのてからすててしまった。", "zh": "甚至連小小的幸福，也親手捨棄掉了。"}, {"t": "h", "text": "十三、歌詞文法拆解"}, {"t": "table", "head": ["文法點", "平假名", "中文"], "rows": [["雨の別れ", "あめのわかれ", "雨中的離別"], ["今でも", "いまでも", "到現在仍然"], ["心を締め付ける", "こころをしめつける", "緊緊揪住心、壓迫心"], ["小さな幸せ", "ちいさなしあわせ", "小小的幸福"], ["さえも", "さえも", "甚至連…也"], ["捨ててしまった", "すててしまった", "捨棄掉了（帶後悔感）"]]}, {"t": "h", "text": "十四、今天文法總表"}, {"t": "table", "head": ["文法", "句型", "中文", "例句"], "rows": [["別れる", "人と別れる", "和某人分手／離別", "彼と別れた。"], ["分かれる", "道が分かれる", "道路分岔", "道が分かれる。"], ["今でも", "今でも＋句子", "到現在仍然", "今でも忘れられない。"], ["忘れられない", "名詞が忘れられない", "忘不了…", "彼女が忘れられない。"], ["小さい", "小さい＋名詞", "小的…", "小さい会社"], ["小さな", "小さな＋名詞", "小小的…", "小さな幸せ"], ["小さくない", "小さくない＋名詞", "不小的…", "小さくない部屋"], ["小さくする", "名詞を小さくする", "把…變小", "パンを小さくする。"], ["捨てる", "名詞を捨てる", "丟掉、捨棄", "本を捨てる。"], ["捨てられる", "捨てる→捨てられる", "被拋棄", "捨てられた。"], ["さえ", "名詞＋さえ", "連…都", "水さえ飲まない。"], ["さえも", "名詞＋さえも", "甚至連…也", "幸せさえも捨てた。"], ["てしまう", "動詞て形＋しまう", "做完；遺憾地做了", "捨ててしまった。"]]}, {"t": "h", "text": "十五、張正修式一句話總結"}, {"t": "poem", "text": "別れ 是名詞，別れる 是動詞。小さい 是形容詞，小さな 只能接名詞。さえ 是「連…都」，語氣很強。てしまう 常帶「做掉了、後悔了、無法挽回」的感覺。這次歌詞的情緒核心是：到現在還忘不了那場離別，甚至連小小的幸福，都曾親手捨棄掉了。"}]}, {"date": "6/18", "title": "見たい・困らせる・みたい", "subtitle": "見る／見たい・困る／困らせる・我儘・〜みたい・締め付ける", "sections": [{"t": "lead", "text": "以下逐句對照課堂記錄。"}, {"t": "h", "text": "一、見る／見たい（想看）"}, {"t": "note", "text": "見る（看）→ 〜が見たい（想看…）。注意發音與後面「みたい（像…）」相同，但意思不同。"}, {"t": "ex", "jp": "私は映画を見る。", "kana": "わたしはえいがをみる。", "zh": "我看電影。"}, {"t": "ex", "jp": "私は映画が見たい。", "kana": "わたしはえいががみたい。", "zh": "我想看電影。"}, {"t": "ex", "jp": "私は公園が見たい。", "kana": "わたしはこうえんがみたい。", "zh": "我想看公園。"}, {"t": "line", "jp": "映画が見たい／男見たい／女見たい", "kana": "えいががみたい／おとこみたい／おんなみたい"}, {"t": "note", "text": "文法：N が見たい＝想看 N（注意助詞用「が」，不是「を」）。"}, {"t": "h", "text": "二、〜みたい（像…）名詞＋みたい"}, {"t": "note", "text": "名詞＋みたい，意為「像…」。"}, {"t": "ex", "jp": "彼は子供みたいだ。", "kana": "かれはこどもみたいだ。", "zh": "他像個孩子。"}, {"t": "ex", "jp": "彼は子供みたいです。", "kana": "かれはこどもみたいです。", "zh": "他像個孩子。（禮貌）"}, {"t": "ex", "jp": "彼は先生みたいです。", "kana": "かれはせんせいみたいです。", "zh": "他像個老師。"}, {"t": "ex", "jp": "彼は木村拓哉みたいだ。", "kana": "かれはきむらたくやみたいだ。", "zh": "他像木村拓哉。"}, {"t": "sub", "text": "各種職業／對象 ＋ みたい"}, {"t": "line", "jp": "子供みたい／先生みたい／女みたい", "kana": "こどもみたい／せんせいみたい／おんなみたい"}, {"t": "line", "jp": "やくざみたい／俳優みたい", "kana": "やくざみたい／はいゆうみたい"}, {"t": "line", "jp": "警察みたい／踊り子みたい", "kana": "けいさつみたい／おどりこみたい"}, {"t": "line", "jp": "公務員みたい／学生みたい", "kana": "こうむいんみたい／がくせいみたい"}, {"t": "line", "jp": "店員みたい／太陽みたい", "kana": "てんいんみたい／たいようみたい"}, {"t": "note", "text": "踊る（おどる，跳舞）→ 踊り子（おどりこ，舞者）。"}, {"t": "h", "text": "三、〜みたいな ＋ 名詞（連体法）"}, {"t": "ex", "jp": "子供みたいな張さん。", "kana": "こどもみたいなちょうさん。", "zh": "像孩子一樣的張先生。"}, {"t": "ex", "jp": "彼女みたいな先生。", "kana": "かのじょみたいなせんせい。", "zh": "像她一樣的老師。"}, {"t": "ex", "jp": "太陽みたいな月。", "kana": "たいようみたいなつき。", "zh": "像太陽一樣的月亮。"}, {"t": "ex", "jp": "総統府みたいなビル。", "kana": "そうとうふみたいなビル。", "zh": "像總統府一樣的大樓。"}, {"t": "ex", "jp": "総統府みたいな建物。", "kana": "そうとうふみたいなたてもの。", "zh": "像總統府一樣的建築。"}, {"t": "ex", "jp": "掌みたいな手の平。", "kana": "てのひらみたいなてのひら。", "zh": "像手掌一樣的掌。"}, {"t": "ex", "jp": "太陽みたいな笑顔。", "kana": "たいようみたいなえがお。", "zh": "像太陽一樣的笑容。"}, {"t": "ex", "jp": "酒みたいな飲み物。", "kana": "さけみたいなのみもの。", "zh": "像酒一樣的飲料。"}, {"t": "ex", "jp": "子供みたいな先生。", "kana": "こどもみたいなせんせい。", "zh": "像孩子一樣的老師。"}, {"t": "h", "text": "四、〜みたいに ＋ 形容詞・動詞（副詞法）"}, {"t": "note", "text": "みたいに ＋ 形容詞／形容動詞／動詞。用法分：終止法・連体法・副詞法。"}, {"t": "ex", "jp": "太陽みたいに明るい。", "kana": "たいようみたいにあかるい。", "zh": "像太陽一樣明亮。"}, {"t": "ex", "jp": "鳥が鴎みたいに飛ぶ。", "kana": "とりがかもめみたいにとぶ。", "zh": "鳥像海鷗一樣飛。"}, {"t": "ex", "jp": "彼は子供みたいに泣いている。", "kana": "かれはこどもみたいにないている。", "zh": "他像孩子一樣地哭著。"}, {"t": "ex", "jp": "彼は日本人みたいに日本語を話している。", "kana": "かれはにほんじんみたいににほんごをはなしている。", "zh": "他像日本人一樣地說著日語。"}, {"t": "ex", "jp": "彼女は俳優みたいに綺麗です。", "kana": "かのじょははいゆうみたいにきれいです。", "zh": "她像演員一樣漂亮。"}, {"t": "note", "text": "鳥が飛ぶ（とりがとぶ）／鴎（かもめ，海鷗）／泣く（なく）／話す（はなす）。"}, {"t": "table", "head": ["接續", "例句", "用法"], "rows": [["N みたいだ", "彼は子供みたいだ", "終止法：句尾「像 N 一樣」"], ["N みたいな N", "子供みたいな先生", "連体法：修飾名詞"], ["N みたいに ＋ 形容詞", "太陽みたいに明るい", "副詞法：像…一樣明亮"], ["N みたいに ＋ 形容動詞", "俳優みたいに綺麗", "副詞法：像…一樣漂亮"], ["N みたいに ＋ 動詞", "子供みたいに泣く", "副詞法：像…一樣哭"]]}, {"t": "h", "text": "五、子供みたいなあの日のお前（歌詞拆解）"}, {"t": "line", "jp": "子供みたいなお前", "kana": "こどもみたいなおまえ"}, {"t": "line", "jp": "あの日、お前は子供みたいだ", "kana": "あのひ、おまえはこどもみたいだ"}, {"t": "line", "jp": "あの日、子供みたいなお前", "kana": "あのひ、こどもみたいなおまえ"}, {"t": "ex", "jp": "子供みたいなあの日のお前。", "kana": "こどもみたいなあのひのおまえ。", "zh": "像孩子一樣的、那天的你。"}, {"t": "h", "text": "六、困る／困らせる"}, {"t": "note", "text": "困る（こまる，自動詞）＝自己困擾；困らせる（こまらせる，使役）＝讓別人困擾。"}, {"t": "ex", "jp": "母を困らせた。", "kana": "ははをこまらせた。", "zh": "讓媽媽困擾了。"}, {"t": "ex", "jp": "我儘言ってはあなたを困らせた。", "kana": "わがままいってはあなたをこまらせた。", "zh": "老是任性，讓你困擾了。"}, {"t": "note", "text": "困らせる（基本形）／困らせた（過去）／言ったら（如果說）。"}, {"t": "h", "text": "七、締め付ける（揪緊、壓迫）"}, {"t": "note", "text": "締める（しめる）＋ 付ける（つける）→ 締め付ける。"}, {"t": "ex", "jp": "両手で相手を締め付ける。", "kana": "りょうてであいてをしめつける。", "zh": "用兩手勒緊對方。"}, {"t": "ex", "jp": "ネクタイを締め付ける。", "kana": "ネクタイをしめつける。", "zh": "勒緊領帶。"}, {"t": "ex", "jp": "胸を締め付けられるみたいだ。", "kana": "むねをしめつけられるみたいだ。", "zh": "像被揪緊胸口一樣。"}, {"t": "h", "text": "八、本課核心句"}, {"t": "note", "text": "いま（今）／でも／別れる（わかれる）。"}, {"t": "ex", "jp": "山梔子の雨の別れは今でも心を締め付ける。", "kana": "くちなしのあめのわかれはいまでもこころをしめつける。", "zh": "梔子花雨中的離別，至今仍揪緊我的心。"}]}, {"date": "6/11", "title": "困らせる・ては・まま", "subtitle": "困る／困らせる・我儘・〜ては・まま・黙る／駄目・歌詞抒情句", "sections": [{"t": "h", "text": "一、困る／困らせる"}, {"t": "table", "head": ["日文", "平假名", "詞性", "中文"], "rows": [["困る", "こまる", "自動詞", "自己覺得困擾、為難"], ["困らせる", "こまらせる", "使役形", "讓別人困擾、使人為難"]]}, {"t": "sub", "text": "A. 困る：自己困擾"}, {"t": "ex", "jp": "困る。", "kana": "こまる。", "zh": "我很困擾。"}, {"t": "ex", "jp": "ああ、困った。", "kana": "ああ、こまった。", "zh": "啊，真傷腦筋。"}, {"t": "ex", "jp": "歯痛で困る。", "kana": "はいたでこまる。", "zh": "因為牙痛而困擾。"}, {"t": "ex", "jp": "歯痛で困っている。", "kana": "はいたでこまっている。", "zh": "正在因牙痛而困擾。"}, {"t": "ex", "jp": "お金がなくて困っている。", "kana": "おかねがなくてこまっている。", "zh": "因為沒有錢而困擾。"}, {"t": "ex", "jp": "車の音で困った。", "kana": "くるまのおとでこまった。", "zh": "因為車子的聲音而困擾。"}, {"t": "sub", "text": "B. 困らせる：讓別人困擾（人を困らせる）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["母を困らせる", "ははをこまらせる", "讓媽媽困擾"], ["母を困らせた", "ははをこまらせた", "讓媽媽困擾了"], ["長男を困らせた", "ちょうなんをこまらせた", "讓長男困擾了"], ["校長を困らせた", "こうちょうをこまらせた", "讓校長困擾了"], ["課長を困らせた", "かちょうをこまらせた", "讓課長困擾了"], ["部長を困らせた", "ぶちょうをこまらせた", "讓部長困擾了"], ["社長を困らせた", "しゃちょうをこまらせた", "讓社長困擾了"], ["彼女を困らせた", "かのじょをこまらせた", "讓她／女朋友困擾了"], ["娘を困らせた", "むすめをこまらせた", "讓女兒困擾了"], ["息子を困らせた", "むすこをこまらせた", "讓兒子困擾了"], ["弟を困らせた", "おとうとをこまらせた", "讓弟弟困擾了"], ["マネージャーを困らせた", "マネージャーをこまらせた", "讓經理困擾了"]]}, {"t": "h", "text": "二、我儘（わがまま）任性"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["我儘", "わがまま", "任性"], ["我儘な人", "わがままなひと", "任性的人"], ["我儘な子供", "わがままなこども", "任性的孩子"], ["我儘を言う", "わがままをいう", "說任性的話、提出任性要求"], ["我儘を通す", "わがままをとおす", "任性到底、堅持自己的任性"]]}, {"t": "ex", "jp": "彼は我儘な人だ。", "kana": "かれはわがままなひとだ。", "zh": "他是任性的人。"}, {"t": "ex", "jp": "子供が我儘を言って困る。", "kana": "こどもがわがままをいってこまる。", "zh": "孩子說任性的話，讓人困擾。"}, {"t": "ex", "jp": "彼女は最後まで我儘を通した。", "kana": "かのじょはさいごまでわがままをとおした。", "zh": "她到最後都堅持自己的任性。"}, {"t": "h", "text": "三、我儘言っては困らせた（Vては＋不好的結果）"}, {"t": "table", "head": ["感覺", "說明"], "rows": [["反覆", "每次這樣做，就造成某種結果"], ["不好的假設", "要是這樣做，就糟了／就麻煩了"]]}, {"t": "ex", "jp": "我儘言っては困らせた。", "kana": "わがままいってはこまらせた。", "zh": "總是說任性的話，讓人困擾。"}, {"t": "ex", "jp": "私は我儘言っては彼女を困らせた。", "kana": "わたしはわがままいってはかのじょをこまらせた。", "zh": "我總是說任性的話，讓她困擾。"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["我儘を言ったら困る", "わがままをいったらこまる", "如果說任性的話，會困擾"], ["我儘言っては困らせた", "わがままいってはこまらせた", "一再說任性的話，讓人困擾"]]}, {"t": "h", "text": "四、〜ては／たら／ば／と／なら 比較"}, {"t": "sub", "text": "A. と（一旦…自然如此）"}, {"t": "ex", "jp": "そう食べると困るよ。", "kana": "そうたべるとこまるよ。", "zh": "你那樣吃的話，會讓人困擾喔。"}, {"t": "sub", "text": "B. たら（假設）"}, {"t": "ex", "jp": "雨が降ったら困る。", "kana": "あめがふったらこまる。", "zh": "如果下雨，就麻煩了。"}, {"t": "sub", "text": "C. ば（文法書式「如果A就B」）"}, {"t": "ex", "jp": "雨が降れば困る。", "kana": "あめがふればこまる。", "zh": "如果下雨的話，就麻煩了。"}, {"t": "sub", "text": "D. なら（針對此情況判斷）"}, {"t": "ex", "jp": "雨なら困る。", "kana": "あめならこまる。", "zh": "如果是下雨這種情況，就麻煩了。"}, {"t": "sub", "text": "E. ては（要是…可就糟了／每次都…）"}, {"t": "ex", "jp": "雨が降っては困る。", "kana": "あめがふってはこまる。", "zh": "要是下雨可就麻煩了。"}, {"t": "ex", "jp": "黙っては駄目です。", "kana": "だまってはだめです。", "zh": "不可以沉默不說。"}, {"t": "ex", "jp": "そんなことがあっては大変だ。", "kana": "そんなことがあってはたいへんだ。", "zh": "要是有那種事就糟了。"}, {"t": "h", "text": "五、まま／儘（保持原樣）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["そのまま", "そのまま", "就那樣、照原樣"], ["このまま", "このまま", "就這樣"], ["昔の儘", "むかしのまま", "和以前一樣"], ["Vたまま", "Vたまま", "做了某動作後，狀態保持著"]]}, {"t": "ex", "jp": "そのままにして。", "kana": "そのままにして。", "zh": "就那樣放著。"}, {"t": "ex", "jp": "そのままにしておいて。", "kana": "そのままにしておいて。", "zh": "就那樣先放著，不要動。"}, {"t": "ex", "jp": "そのままにして置いてください。", "kana": "そのままにしておいてください。", "zh": "請保持原樣放著。"}, {"t": "ex", "jp": "窓を開けた儘、眠った。", "kana": "まどをあけたまま、ねむった。", "zh": "窗戶開著，就睡著了。"}, {"t": "ex", "jp": "窓を開けたまま寝た。", "kana": "まどをあけたままねた。", "zh": "窗戶開著就睡了。"}, {"t": "ex", "jp": "昔の儘の姿。", "kana": "むかしのままのすがた。", "zh": "一如往昔的樣子。"}, {"t": "h", "text": "六、黙る／駄目"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["黙る", "だまる", "沉默、閉嘴"], ["黙って", "だまって", "沉默地、不說話地"], ["駄目", "だめ", "不行、不可以"], ["大変", "たいへん", "糟糕、不得了、辛苦"]]}, {"t": "ex", "jp": "黙っては駄目です。", "kana": "だまってはだめです。", "zh": "沉默不說是不行的。"}, {"t": "ex", "jp": "そんなことがあっては大変だ。", "kana": "そんなことがあってはたいへんだ。", "zh": "要是發生那種事就糟了。"}, {"t": "h", "text": "七、歌詞抒情句"}, {"t": "ex", "jp": "くちなしの花。", "kana": "くちなしのはな。", "zh": "梔子花。"}, {"t": "ex", "jp": "雨の別れが今でも心を締め付ける。", "kana": "あめのわかれがいまでもこころをしめつける。", "zh": "雨中的離別，到現在仍揪住我的心。"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["雨", "あめ", "雨"], ["別れ", "わかれ", "離別"], ["今でも", "いまでも", "到現在仍然"], ["心", "こころ", "心"], ["締め付ける", "しめつける", "勒緊、壓迫、揪住"]]}, {"t": "poem", "text": "心を締め付ける：不是物理上勒緊心臟，而是讓人心痛、胸口發緊、被回憶壓住。"}, {"t": "ex", "jp": "思い出迷子。", "kana": "おもいでまいご。", "zh": "在回憶裡迷路的人。"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["思い出", "おもいで", "回憶"], ["迷子", "まいご", "迷路的人／迷路的孩子"]]}, {"t": "poem", "text": "人已經在現在，但心還停在過去，走不出那段回憶。"}, {"t": "h", "text": "八、本課核心總表"}, {"t": "table", "head": ["重點", "日文", "平假名", "中文"], "rows": [["自己困擾", "困る", "こまる", "困擾、為難"], ["讓人困擾", "困らせる", "こまらせる", "使某人困擾"], ["任性", "我儘", "わがまま", "任性"], ["一再任性", "我儘言っては困らせた", "わがままいってはこまらせた", "一再任性，使人為難"], ["原樣", "そのまま", "そのまま", "就那樣"], ["開著窗睡", "窓を開けたまま眠った", "まどをあけたままねむった", "窗戶開著就睡了"], ["沉默不行", "黙っては駄目です", "だまってはだめです", "不可以沉默"], ["雨中離別揪心", "雨の別れが今でも心を締め付ける", "あめのわかれがいまでもこころをしめつける", "雨中的離別至今仍揪心"]]}]}, {"date": "6/4", "title": "香り・旅路・果て・らしい", "subtitle": "香り・旅路・ついてくる・果て・まで・どこまでも・ような／らしい", "sections": [{"t": "h", "text": "一、香り（かおり）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["コーヒーの香り", "コーヒーのかおり", "咖啡的香氣"], ["梅の香り", "うめのかおり", "梅花／梅子的香氣"], ["いい香りがする", "いいかおりがする", "有好聞的味道"], ["酒の香", "さけのか", "酒香"], ["香りの高い果物", "かおりのたかいくだもの", "香氣濃郁的水果"]]}, {"t": "note", "text": "文法：N の香り（某物的香味）；する 表示「發出某種氣味／聲音／感覺」。"}, {"t": "ex", "jp": "コーヒーの香りがする。", "kana": "コーヒーのかおりがする。", "zh": "有咖啡香。"}, {"t": "ex", "jp": "この花はいい香りがする。", "kana": "このはなはいいかおりがする。", "zh": "這朵花有好聞的香味。"}, {"t": "ex", "jp": "文学の香り高い作品。", "kana": "ぶんがくのかおりたかいさくひん。", "zh": "富有文學氣息的作品（比喻氣息、風格）。"}, {"t": "note", "text": "延伸：「がする」表示「感受到某種…」，不只香味。"}, {"t": "table", "head": ["用法", "平假名", "中文"], "rows": [["匂いがする", "においがする", "有味道"], ["音がする", "おとがする", "有聲音"], ["感じがする", "かんじがする", "有某種感覺"]]}, {"t": "h", "text": "二、旅路（たびじ）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["旅路", "たびじ", "旅途、人生道路"], ["長い旅路", "ながいたびじ", "漫長旅途"], ["人生", "じんせい", "人生"], ["共にする", "ともにする", "共同經歷、一起度過"], ["路地裏", "ろじうら", "巷弄深處、小巷裡"], ["門地", "もんち", "門第、家世"]]}, {"t": "note", "text": "文法：N を共にする（共同經歷某件事）。"}, {"t": "ex", "jp": "人生は長い旅路だ。", "kana": "じんせいはながいたびじだ。", "zh": "人生是一段漫長的旅途。"}, {"t": "ex", "jp": "二人で旅路を共にする。", "kana": "ふたりでたびじをともにする。", "zh": "兩個人一起走人生的旅途。"}, {"t": "ex", "jp": "苦労を共にする。", "kana": "くろうをともにする。", "zh": "一起吃苦。"}, {"t": "ex", "jp": "人生を共にする。", "kana": "じんせいをともにする。", "zh": "共度人生。"}, {"t": "h", "text": "三、ついてくる（跟著來／附帶而來）"}, {"t": "table", "head": ["寫法", "平假名", "意思"], "rows": [["付いてくる", "ついてくる", "跟著來、附著、伴隨而來"], ["就いて学ぶ", "ついてまなぶ", "師從某人學習"]]}, {"t": "sub", "text": "A. 付いてくる：跟著來"}, {"t": "ex", "jp": "子供が母親について来る。", "kana": "こどもがははおやについてくる。", "zh": "孩子跟著媽媽來。"}, {"t": "ex", "jp": "彼は彼女の家までついてきた。", "kana": "かれはかのじょのいえまでついてきた。", "zh": "他跟到她家。"}, {"t": "sub", "text": "B. 抽象用法：某狀態跟著來"}, {"t": "note", "text": "文法：A と、B がついてくる（只要 A 發生，B 就會伴隨而來）。"}, {"t": "ex", "jp": "年を取ると、病気がついて来る。", "kana": "としをとると、びょうきがついてくる。", "zh": "年紀大了，疾病也會跟著來。"}, {"t": "ex", "jp": "年を取るのが怖い。", "kana": "としをとるのがこわい。", "zh": "害怕變老。"}, {"t": "ex", "jp": "責任には不安がついてくる。", "kana": "せきにんにはふあんがついてくる。", "zh": "責任常常伴隨著不安。"}, {"t": "sub", "text": "C. 就いて学ぶ：師從某人"}, {"t": "ex", "jp": "先生に就いて学ぶ。", "kana": "せんせいについてまなぶ。", "zh": "跟著老師學習／師從老師。"}, {"t": "ex", "jp": "先生に就いてください。", "kana": "せんせいについてください。", "zh": "請跟著老師（學）。"}, {"t": "ex", "jp": "私は先生に就いてきた。", "kana": "わたしはせんせいについてきた。", "zh": "我一路跟著老師學來。"}, {"t": "ex", "jp": "私は彼女に就いてきた。", "kana": "わたしはかのじょについてきた。", "zh": "我一路跟著她。"}, {"t": "warn", "text": "⚠️ 人跟人走→付いてくる／ついてくる；師從老師→就いて学ぶ。"}, {"t": "h", "text": "四、果て（はて）"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["命の果て", "いのちのはて", "生命的盡頭"], ["戦いの果て", "たたかいのはて", "戰鬥的盡頭"], ["努力の果て", "どりょくのはて", "努力到最後"], ["議論の果てに", "ぎろんのはてに", "經過討論到最後"], ["結論", "けつろん", "結論"], ["果てしない", "はてしない", "無止境的、無邊無際的"], ["愚痴", "ぐち", "抱怨"]]}, {"t": "note", "text": "文法：N の果てに（經過某事到最後，終於…）；果てしない＋N（沒有盡頭的…）。果てる（はてる）→ 果て。"}, {"t": "ex", "jp": "議論の果てに結論が出た。", "kana": "ぎろんのはてにけつろんがでた。", "zh": "經過長時間討論後，終於得出結論。"}, {"t": "ex", "jp": "努力の果てに成功した。", "kana": "どりょくのはてにせいこうした。", "zh": "努力到最後終於成功了。"}, {"t": "ex", "jp": "果てしない夢。", "kana": "はてしないゆめ。", "zh": "無邊無際的夢想。"}, {"t": "ex", "jp": "果てしない議論。", "kana": "はてしないぎろん。", "zh": "沒完沒了的討論。"}, {"t": "ex", "jp": "果てしない愚痴。", "kana": "はてしないぐち。", "zh": "沒完沒了的抱怨。"}, {"t": "ex", "jp": "果てしない道。", "kana": "はてしないみち。", "zh": "沒有盡頭的路。"}, {"t": "h", "text": "五、まで（到…為止）"}, {"t": "note", "text": "文法：A から B まで（從 A 到 B）。"}, {"t": "ex", "jp": "台北から基隆まで。", "kana": "たいぺいからきーるんまで。", "zh": "從台北到基隆。"}, {"t": "ex", "jp": "旅路の果てまで。", "kana": "たびじのはてまで。", "zh": "直到旅途的盡頭。"}, {"t": "ex", "jp": "学校から家まで歩く。", "kana": "がっこうからいえまであるく。", "zh": "從學校走到家。"}, {"t": "h", "text": "六、どこ／どこまで／どこまでも"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["どこ", "どこ", "哪裡"], ["どこまで", "どこまで", "到哪裡為止"], ["どこでも", "どこでも", "哪裡都……"], ["どこまでも", "どこまでも", "無論到哪裡、一直到任何地方"]]}, {"t": "ex", "jp": "どこまでですか。", "kana": "どこまでですか。", "zh": "到哪裡？"}, {"t": "ex", "jp": "何処までもついて来る。", "kana": "どこまでもついてくる。", "zh": "無論到哪裡都跟著來。"}, {"t": "h", "text": "七、ような（像…一樣的）"}, {"t": "note", "text": "文法：N のような N（像 N 一樣的 N）。"}, {"t": "ex", "jp": "山梔子の白い花はお前のような花だった。", "kana": "くちなしのしろいはなはおまえのようなはなだった。", "zh": "梔子花的白花，是像你一樣的花。"}, {"t": "ex", "jp": "この薔薇は君のような花です。", "kana": "このばらはきみのようなはなです。", "zh": "這朵玫瑰是像你一樣的花。"}, {"t": "ex", "jp": "猫のような犬。", "kana": "ねこのよういぬ。", "zh": "像貓一樣的狗。"}, {"t": "ex", "jp": "UFOのような車。", "kana": "ユーフォーのようなくるま。", "zh": "像 UFO 一樣的車。"}, {"t": "h", "text": "八、らしい（很像、具典型特徵）"}, {"t": "ex", "jp": "張さんは先生らしい先生です。", "kana": "ちょうさんはせんせいらしいせんせいです。", "zh": "張先生是很有老師樣子的老師。"}, {"t": "ex", "jp": "張さんは先生のような人です。", "kana": "ちょうさんはせんせいのようなひとです。", "zh": "張先生是像老師一樣的人。"}, {"t": "ex", "jp": "春らしい天気ですね。", "kana": "はるらしいてんきですね。", "zh": "真是有春天感覺的天氣。"}, {"t": "ex", "jp": "男らしい。", "kana": "おとこらしい。", "zh": "有男子氣概。"}, {"t": "ex", "jp": "女らしい。", "kana": "おんならしい。", "zh": "有女性氣質。"}, {"t": "h", "text": "九、ような vs らしい"}, {"t": "table", "head": ["文法", "中文感覺", "重點"], "rows": [["N のような", "像……一樣", "外表、感覺、比喻（不一定是）"], ["N らしい", "很有……樣子", "符合典型特徵（本來就是）"]]}, {"t": "note", "text": "先生のような人＝像老師一樣的人（可能不是老師）。先生らしい先生＝很有老師樣子的老師（他就是老師，且很符合形象）。"}, {"t": "h", "text": "十、のようなもの（像…那樣的東西／差不多是…）"}, {"t": "note", "text": "N のようなもの：「像 N 那種東西」、「幾乎可以說是 N」，比 N のような N 更有「差不多就是那樣」的語氣。"}, {"t": "ex", "jp": "この大学は高等学校のようなものです。", "kana": "このだいがくはこうとうがっこうのようなものです。", "zh": "這所大學簡直像高中一樣。"}, {"t": "ex", "jp": "この車はUFOのようなものです。", "kana": "このくるまはユーフォーのようなものです。", "zh": "這台車像 UFO 一樣。"}, {"t": "ex", "jp": "この犬は猫のようなものです。", "kana": "このいぬはねこのようなものです。", "zh": "這隻狗簡直像貓一樣。"}, {"t": "h", "text": "十一、本課核心句"}, {"t": "ex", "jp": "くちなしの花の香りが旅路の果てまでついて来る。", "kana": "くちなしのはなのかおりがたびじのはてまでついてくる。", "zh": "梔子花的香氣，一直跟隨到旅途的盡頭。"}, {"t": "table", "head": ["部分", "平假名", "中文"], "rows": [["くちなしの花", "くちなしのはな", "梔子花"], ["香りが", "かおりが", "香氣"], ["旅路の果てまで", "たびじのはてまで", "到旅途的盡頭"], ["ついて来る", "ついてくる", "跟著來、一直伴隨"]]}, {"t": "poem", "text": "不只寫花香，而是：那個人的記憶像梔子花香一樣，一直跟著自己走到人生很遠的地方。"}, {"t": "h", "text": "十二、補充單字"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["単語", "たんご", "單字"], ["音痴", "おんち", "音癡"], ["演歌", "えんか", "演歌（日本傳統流行歌風格）"], ["門地", "もんち", "門第、家世"], ["母親", "ははおや", "母親"], ["父親", "ちちおや", "父親"], ["怖い", "こわい", "可怕、害怕"], ["病気", "びょうき", "疾病"], ["結論", "けつろん", "結論"], ["議論", "ぎろん", "討論、爭論"]]}]}, {"date": "5/28", "title": "痩せる・ほど・噂", "subtitle": "核心歌詞・痩せる／やつれる・〜ほど・噂によると〜そうだ／らしい（p.186）", "sections": [{"t": "h", "text": "一、核心歌詞句"}, {"t": "ex", "jp": "くちなしの花の香が旅路の果てまで就いて來る。", "kana": "くちなしのはなのかがたびじのはてまでついてくる。", "zh": "梔子花的香氣一直跟到旅途的盡頭。"}, {"t": "ex", "jp": "口なしの白い花、お前の様な花だった。", "kana": "くちなしのしろいはな、おまえのようなはなだった。", "zh": "梔子的白花，是像你一樣的花。"}, {"t": "ex", "jp": "山梔子の白い花がお前の様な花でした。", "kana": "くちなしのしろいはながおまえのようなはなでした。", "zh": "梔子的白花，是像你一樣的花。"}, {"t": "note", "text": "くちなしの花＝梔子花。山梔子（くちなし）。"}, {"t": "h", "text": "二、痩せる／やつれる（消瘦／憔悴）"}, {"t": "ex", "jp": "お前が痩せてやつれた。", "kana": "おまえがやせてやつれた。", "zh": "你消瘦憔悴了。"}, {"t": "note", "text": "痩せる（やせる，變瘦）／やつれる（憔悴）。文法：Vて＋Vた 連接動作／狀態，表示「又…又…」（痩せて＋やつれた＝又瘦又憔悴）。"}, {"t": "h", "text": "三、〜ほど（到…的程度）"}, {"t": "note", "text": "指輪が回る（ゆびわがまわる）／地球が回る（ちきゅうがまわる）。「も」表強調。"}, {"t": "ex", "jp": "指輪が回るほど。", "kana": "ゆびわがまわるほど。", "zh": "到戒指會轉動的程度。"}, {"t": "ex", "jp": "お前が指輪も回るほど痩せた。", "kana": "おまえがゆびわもまわるほどやせた。", "zh": "你瘦到連戒指都會轉動的程度。"}, {"t": "ex", "jp": "私は死ぬほど疲れる。", "kana": "わたしはしぬほどつかれる。", "zh": "我累得要死。"}, {"t": "ex", "jp": "私は死ぬほど疲れた。", "kana": "わたしはしぬほどつかれた。", "zh": "我累得要死了。"}, {"t": "ex", "jp": "私は涙が出るほど感動した。", "kana": "わたしはなみだがでるほどかんどうした。", "zh": "我感動到流淚。"}, {"t": "note", "text": "死ぬ（しぬ）／疲れる（つかれる）／涙（なみだ）／感動する（かんどうする）。"}, {"t": "h", "text": "四、噂によると〜そうだ／らしい（傳聞）"}, {"t": "note", "text": "句型：噂（うわさ）によると … そうだ／らしい。"}, {"t": "ex", "jp": "今ではお前が指輪も回るほど痩せた。", "kana": "いまではおまえがゆびわもまわるほどやせた。", "zh": "現在你瘦到戒指都會轉動了。"}, {"t": "ex", "jp": "今ではお前が指輪も回るほど痩せてやつれた。", "kana": "いまではおまえがゆびわもまわるほどやせてやつれた。", "zh": "現在你瘦到戒指會轉、憔悴不堪。"}, {"t": "ex", "jp": "噂によると今ではお前が指輪も回るほど痩せてやつれたそうだ。", "kana": "うわさによるといまではおまえがゆびわもまわるほどやせてやつれたそうだ。", "zh": "聽說你現在瘦到戒指都會轉、憔悴不堪。"}, {"t": "ex", "jp": "（今では指輪も回るほど痩せてやつれた）お前の噂。", "kana": "（いまではゆびわもまわるほどやせてやつれた）おまえのうわさ。", "zh": "（瘦到戒指都會轉、憔悴）關於你的傳聞。"}, {"t": "note", "text": "文法：整串長句「今では指輪も回るほど痩せてやつれた」都在修飾後面的名詞「お前の噂」。日文用前面整段內容直接修飾後面的名詞。"}, {"t": "h", "text": "五、香り相關用字"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["香る", "かおる", "散發香氣"], ["香り／いい香り", "かおり／いいかおり", "香氣／好香味"], ["馨", "かおり", "馨（香氣，人名用字）"], ["香織", "かおり", "香織（人名）"], ["果てる→果て", "はてる→はて", "到盡頭→盡頭"], ["就く", "つく", "跟隨、師事"], ["就いて來る", "ついてくる", "跟著來"]]}]}, {"date": "5/21", "title": "らしい・みたい・よう", "subtitle": "らしい・みたい・ような・そうだ／と聞いている（傳聞與推測，p.186）", "sections": [{"t": "h", "text": "一、まで／待ってください"}, {"t": "ex", "jp": "待ってください。", "kana": "まってください。", "zh": "請等一下。"}, {"t": "note", "text": "まで（到…為止）／待つ（まつ，等待）。"}, {"t": "h", "text": "二、傳聞與推測的比較"}, {"t": "note", "text": "らしい／みたい／そうだ／と聞いている，皆可表示「聽說、好像」。"}, {"t": "ex", "jp": "彼は来年結婚するらしい。", "kana": "かれはらいねんけっこんするらしい。", "zh": "聽說他明年要結婚。"}, {"t": "ex", "jp": "彼は来年結婚するそうだ。", "kana": "かれはらいねんけっこんするそうだ。", "zh": "聽說他明年要結婚。"}, {"t": "ex", "jp": "彼は来年結婚すると聞いている。", "kana": "かれはらいねんけっこんするときいている。", "zh": "我聽說他明年要結婚。"}, {"t": "ex", "jp": "この店は人気があるらしい。", "kana": "このみせはにんきがあるらしい。", "zh": "這家店好像很受歡迎。"}, {"t": "h", "text": "三、らしい（很像、具典型特徵）"}, {"t": "note", "text": "含義：符合該事物的本質（ほんしつ）、角色（やくわり），典型、相稱（ふさわしい）。"}, {"t": "poem", "text": "老師定義：そのものの本質や役割に合っている、典型的である。（符合那個事物的本質或角色，具有典型性。）"}, {"t": "ex", "jp": "春らしい天気ですね。", "kana": "はるらしいてんきですね。", "zh": "真有春天感覺的天氣。"}, {"t": "ex", "jp": "春の様な天気です。", "kana": "はるのようなてんきです。", "zh": "像春天一樣的天氣。"}, {"t": "ex", "jp": "冬らしい天気。", "kana": "ふゆらしいてんき。", "zh": "很有冬天感覺的天氣。"}, {"t": "ex", "jp": "彼は学生らしい服装をしている。", "kana": "かれはがくせいらしいふくそうをしている。", "zh": "他穿著很有學生樣子的服裝。"}, {"t": "ex", "jp": "彼は学生のような服装をしている。", "kana": "かれはがくせいのようなふくそうをしている。", "zh": "他穿著像學生一樣的服裝。"}, {"t": "ex", "jp": "彼は先生らしい先生だ。", "kana": "かれはせんせいらしいせんせいだ。", "zh": "他是很有老師樣子的老師。"}, {"t": "ex", "jp": "彼は警察らしい。", "kana": "かれはけいさつらしい。", "zh": "他像是警察（很有警察樣子）。"}, {"t": "ex", "jp": "子どもらしい無邪気さ。", "kana": "こどもらしいむじゃきさ。", "zh": "孩子般的天真無邪。"}, {"t": "line", "jp": "男らしい／女らしい", "kana": "おとこらしい／おんならしい"}, {"t": "line", "jp": "無邪気な子供／無邪気さ", "kana": "むじゃきなこども／むじゃきさ"}, {"t": "note", "text": "制服（せいふく）。無邪気（むじゃき，天真）。相応しい（ふさわしい，相稱）。"}, {"t": "h", "text": "四、らしい／みたい／そうだ 並列"}, {"t": "ex", "jp": "彼は病気らしい。", "kana": "かれはびょうきらしい。", "zh": "他好像生病了。"}, {"t": "ex", "jp": "病人の様です。", "kana": "びょうにんのようです。", "zh": "像病人一樣。"}, {"t": "ex", "jp": "日本人らしい。", "kana": "にほんじんらしい。", "zh": "很有日本人樣子。"}, {"t": "ex", "jp": "先生はもう結婚したらしい。", "kana": "せんせいはもうけっこんしたらしい。", "zh": "老師好像已經結婚了。"}, {"t": "h", "text": "五、與歌詞結合（失戀・痩せる・噂）"}, {"t": "ex", "jp": "彼女は失恋のため痩せている。", "kana": "かのじょはしつれんのためやせている。", "zh": "她因為失戀而消瘦。"}, {"t": "ex", "jp": "彼女は失恋のため痩せているらしい。", "kana": "かのじょはしつれんのためやせているらしい。", "zh": "她好像因為失戀而消瘦。"}, {"t": "ex", "jp": "噂によると彼女は痩せてやつれた。", "kana": "うわさによるとかのじょはやせてやつれた。", "zh": "聽說她瘦了、憔悴了。"}, {"t": "ex", "jp": "噂によると彼女は指輪も回るほど痩せてやつれた。", "kana": "うわさによるとかのじょはゆびわもまわるほどやせてやつれた。", "zh": "聽說她瘦到戒指會轉、憔悴不堪。"}, {"t": "ex", "jp": "噂によると彼女は痩せてやつれたらしい。", "kana": "うわさによるとかのじょはやせてやつれたらしい。", "zh": "聽說她瘦了、憔悴了。"}, {"t": "ex", "jp": "噂によると彼女は痩せてやつれたそうだ。", "kana": "うわさによるとかのじょはやせてやつれたそうだ。", "zh": "聽說她瘦了、憔悴了。"}, {"t": "ex", "jp": "今では指輪も回るほど痩せてやつれたお前の噂。", "kana": "いまではゆびわもまわるほどやせてやつれたおまえのうわさ。", "zh": "現在瘦到戒指會轉、憔悴的關於你的傳聞。"}, {"t": "note", "text": "噂（うわさ）／指輪（ゆびわ）／程＝ほど（程度）／痩せ我慢（やせがまん，硬撐、逞強）／やつれる（憔悴）。"}, {"t": "h", "text": "六、核心歌詞句"}, {"t": "ex", "jp": "くちなしの花、花の香が旅路の果てまで就いてくる。", "kana": "くちなしのはな、はなのかがたびじのはてまでついてくる。", "zh": "梔子花，花香一直跟到旅途的盡頭。"}, {"t": "ex", "jp": "くちなしの白い花、お前のような花だった。", "kana": "くちなしのしろいはな、おまえのようなはなだった。", "zh": "梔子的白花，是像你一樣的花。"}, {"t": "note", "text": "渡哲也（わたりてつや）。相応しい（ふさわしい）。"}]}, {"date": "5/14", "title": "あと・予定・によると", "subtitle": "あと＋數量・予定／つもり・Aによると〜だそうです（傳聞，p.184）", "sections": [{"t": "h", "text": "一、あと＋數量（還剩…）"}, {"t": "ex", "jp": "勉強まであと一日！", "kana": "べんきょうまであといちにち！", "zh": "離讀書（考試）還剩一天！"}, {"t": "ex", "jp": "試験まであと一日！", "kana": "しけんまであといちにち！", "zh": "離考試還剩一天！"}, {"t": "ex", "jp": "あと一日辛抱すれば、自由だ。", "kana": "あといちにちしんぼうすれば、じゆうだ。", "zh": "再忍一天就自由了。"}, {"t": "ex", "jp": "あと一日待ってください。", "kana": "あといちにちまってください。", "zh": "請再等一天。"}, {"t": "ex", "jp": "あと一日頑張れば休みだ。", "kana": "あといちにちがんばればやすみだ。", "zh": "再加油一天就放假了。"}, {"t": "ex", "jp": "あと一日で夏休みが終わる。", "kana": "あといちにちでなつやすみがおわる。", "zh": "再一天暑假就結束了。"}, {"t": "ex", "jp": "締め切りまであと一日しかない。", "kana": "しめきりまであといちにちしかない。", "zh": "離截稿只剩一天。"}, {"t": "note", "text": "辛抱（しんぼう，忍耐）／頑張る（がんばる）／休み（やすみ）／終わる（おわる）／締め切り（しめきり）＝締める＋切る。其他：あと三時間、あと二人（ふたり）、あと五分。"}, {"t": "h", "text": "二、予定／つもり"}, {"t": "ex", "jp": "あと一日で完成する予定です。", "kana": "あといちにちでかんせいするよていです。", "zh": "預定再一天完成。"}, {"t": "ex", "jp": "四月にアメリカへ行く予定です。", "kana": "しがつにアメリカへいくよていです。", "zh": "預定四月去美國。"}, {"t": "ex", "jp": "四月にアメリカへ行くつもりです。", "kana": "しがつにアメリカへいくつもりです。", "zh": "打算四月去美國。"}, {"t": "table", "head": ["文法", "中文", "語感"], "rows": [["予定です", "預定", "較像已安排好的計畫"], ["つもりです", "打算", "偏個人意志、想法"]]}, {"t": "h", "text": "三、Aによると〜だそうです（傳聞）"}, {"t": "note", "text": "文法：根據某來源（拠る，よる）所聽到的傳聞。"}, {"t": "ex", "jp": "天気予報によると、明日は雨だそうです。", "kana": "てんきよほうによると、あしたはあめだそうです。", "zh": "根據天氣預報，明天會下雨。"}, {"t": "ex", "jp": "先生の話によると、この本はとても有名だそうです。", "kana": "せんせいのはなしによると、このほんはとてもゆうめいだそうです。", "zh": "據老師說，這本書很有名。"}, {"t": "ex", "jp": "彼の話によると先生は来ないそうです。", "kana": "かれのはなしによるとせんせいはこないそうです。", "zh": "據他說老師不會來。"}, {"t": "ex", "jp": "噂によると彼女はとても美しいそうです。", "kana": "うわさによるとかのじょはとてもうつくしいそうです。", "zh": "聽說她非常美麗。"}, {"t": "ex", "jp": "政府の情報によると彼はロシヤ政府に殺されたそうです。", "kana": "せいふのじょうほうによるとかれはロシヤせいふにころされたそうです。", "zh": "據政府情報，他被俄羅斯政府殺害了。"}, {"t": "ex", "jp": "歴史によると汐止は綺麗な街だったそうです。", "kana": "れきしによるとしおどめはきれいなまちだったそうです。", "zh": "根據歷史，汐止以前是個漂亮的城鎮。"}, {"t": "ex", "jp": "お医者さんの話によると彼の病気はよく成らないそうだ。", "kana": "おいしゃさんのはなしによるとかれのびょうきはよくならないそうだ。", "zh": "據醫生說，他的病不會好。"}, {"t": "ex", "jp": "彼女の話によるとこの映画は面白いそうです。", "kana": "かのじょのはなしによるとこのえいがはおもしろいそうです。", "zh": "據她說這部電影很有趣。"}, {"t": "note", "text": "情報（じょうほう）／殺す（ころす）→殺された／町・街（まち）。"}, {"t": "h", "text": "四、天氣與災害詞彙"}, {"t": "table", "head": ["日文", "平假名", "中文"], "rows": [["晴れる", "はれる", "放晴"], ["曇る", "くもる", "陰天"], ["大雨", "おおあめ", "大雨"], ["ザアザア降り", "ザアザアぶり", "嘩啦嘩啦地下"], ["台風", "たいふう", "颱風"], ["竜巻", "たつまき", "龍捲風"], ["起る", "おこる", "發生、興起"], ["津波", "つなみ", "海嘯"], ["地震", "じしん", "地震"], ["襲う", "おそう", "襲擊"], ["襲われる", "おそわれる", "被襲擊"]]}, {"t": "ex", "jp": "天気予報によると明日晴れるそうです。", "kana": "てんきよほうによるとあしたはれるそうです。", "zh": "據氣象預報，明天會放晴。"}, {"t": "ex", "jp": "天気予報によると明日曇るそうです。", "kana": "てんきよほうによるとあしたくもるそうです。", "zh": "據氣象預報，明天會陰天。"}, {"t": "ex", "jp": "天気予報によると明日大雨だそうです。", "kana": "てんきよほうによるとあしたおおあめだそうです。", "zh": "據氣象預報，明天會下大雨。"}, {"t": "ex", "jp": "天気予報によると台風が来るそうです。", "kana": "てんきよほうによるとたいふうがくるそうです。", "zh": "據氣象預報，颱風會來。"}, {"t": "ex", "jp": "天気予報によると明日竜巻が起るそうです。", "kana": "てんきよほうによるとあしたたつまきがおこるそうです。", "zh": "據氣象預報，明天會起龍捲風。"}, {"t": "ex", "jp": "津波に襲われる。", "kana": "つなみにおそわれる。", "zh": "被海嘯襲擊。"}, {"t": "ex", "jp": "津波を起こす。", "kana": "つなみをおこす。", "zh": "引發海嘯。"}, {"t": "ex", "jp": "地震が津波を起こす。", "kana": "じしんがつなみをおこす。", "zh": "地震引發海嘯。"}]}, {"date": "5/7", "title": "そうだ・わざわざ・く成る", "subtitle": "〜そうだ（樣態 vs 傳聞）・わざわざ／折角・〜く成る（變化）・あと（p.184）", "sections": [{"t": "h", "text": "一、樣態 vs 傳聞的そうだ"}, {"t": "note", "text": "樣態（看起來）：形容詞語幹／形容動詞語幹 ＋ そうだ。傳聞（聽說）：終止形 ＋ そうだ。"}, {"t": "table", "head": ["樣態（看起來）", "平假名", "傳聞（聽說）"], "rows": [["この花は綺麗そうだ", "このはなはきれいそうだ", "この花は綺麗だそうだ"], ["真面目そうだ", "まじめそうだ", "—"], ["美味しそうだ", "おいしそうだ", "—"], ["高そうだ", "たかそうだ", "この本は高いそうだ"], ["この子供は元気そうだ", "このこどもはげんきそうだ", "この子供は元気だそうだ"], ["この町は賑やかそうだ", "このまちはにぎやかそうだ", "この町は賑やかだそうだ"], ["この町は不便そうだ", "このまちはふべんそうだ", "この町は不便だそうだ"]]}, {"t": "line", "jp": "たかそうだ／やすそうだ／さむそうだ", "kana": "高そうだ／安そうだ／寒そうだ"}, {"t": "line", "jp": "きれいそうだ／まじめそうだ／にぎやかそうだ", "kana": "綺麗そうだ／真面目そうだ／賑やかそうだ"}, {"t": "h", "text": "二、わざわざ／折角（せっかく）"}, {"t": "ex", "jp": "わざわざ来てくれてありがとう。", "kana": "わざわざきてくれてありがとう。", "zh": "謝謝你特地前來。"}, {"t": "ex", "jp": "わざわざ悪戯書きをする。", "kana": "わざわざいたずらがきをする。", "zh": "特地塗鴉。"}, {"t": "ex", "jp": "わざわざそんなことをしなくてもいいのに。", "kana": "わざわざそんなことをしなくてもいいのに。", "zh": "用不著特地做那種事的。"}, {"t": "ex", "jp": "わざわざ電話して確認した。", "kana": "わざわざでんわしてかくにんした。", "zh": "特地打電話確認。"}, {"t": "ex", "jp": "わざわざ言わなくてもいい。", "kana": "わざわざいわなくてもいい。", "zh": "用不著特地說。"}, {"t": "ex", "jp": "せっかくですが結構です。", "kana": "せっかくですがけっこうです。", "zh": "難得（您的好意），但不用了。"}, {"t": "ex", "jp": "せっかくのお心遣いありがとうございます。", "kana": "せっかくのおこころづかいありがとうございます。", "zh": "感謝您難得的關心。"}, {"t": "note", "text": "悪戯書き（いたずらがき，塗鴉）／心遣い（こころづかい，關心）。"}, {"t": "h", "text": "三、〜く成る／〜に成る（變化）"}, {"t": "ex", "jp": "よく成った。", "kana": "よくなった。", "zh": "變好了。"}, {"t": "ex", "jp": "玉子が高く成った。", "kana": "たまごがたかくなった。", "zh": "蛋變貴了。"}, {"t": "ex", "jp": "りんごが美味しく成った。", "kana": "りんごがおいしくなった。", "zh": "蘋果變好吃了。"}, {"t": "ex", "jp": "今日は寒く成った。", "kana": "きょうはさむくなった。", "zh": "今天變冷了。"}, {"t": "ex", "jp": "今日は暑くなった。", "kana": "きょうはあつくなった。", "zh": "今天變熱了。"}, {"t": "ex", "jp": "このジュースは甘く成った。", "kana": "このジュースはあまくなった。", "zh": "這果汁變甜了。"}, {"t": "ex", "jp": "天気が暗くなった。", "kana": "てんきがくらくなった。", "zh": "天色變暗了。"}, {"t": "ex", "jp": "昼間が長く成った。", "kana": "ひるまがながくなった。", "zh": "白天變長了。"}, {"t": "sub", "text": "〜く成らない（不會變…）"}, {"t": "ex", "jp": "仕合わせが短く成らない。", "kana": "しあわせがみじかくならない。", "zh": "幸福不會變短。"}, {"t": "ex", "jp": "仕合わせが短く成った。", "kana": "しあわせがみじかくなった。", "zh": "幸福變短了。"}, {"t": "ex", "jp": "そのいのちは短く成らない。", "kana": "そのいのちはみじかくならない。", "zh": "那生命不會變短。"}, {"t": "ex", "jp": "卵は高く成らない。", "kana": "たまごはたかくならない。", "zh": "蛋不會變貴。"}, function renderSection(s,secNo){
  switch(s.t){
    case 'lead': return `<p class="lead">${esc(s.text)}</p>`;
    case 'h':    return `<h2 class="sec"><span class="num">${secNo}</span>${esc(stripNum(s.text))}</h2>`;
    case 'sub':  return `<h3 class="subh">${esc(s.text)}</h3>`;
    case 'note': return `<div class="note">${esc(s.text)}</div>`;
    case 'warn': return `<div class="warn">${esc(s.text)}</div>`;
    case 'poem': return `<div class="poem">${esc(s.text)}</div>`;
    case 'ex':   return `<div class="ex"><div class="jp"><span class="mk">🌷</span>${esc(s.jp)}</div>`+
                  (s.kana?`<div class="kana">${esc(s.kana)}</div>`:``)+
                  (s.zh?`<div class="zh">${esc(s.zh)}</div>`:``)+`</div>`;
    case 'line': return `<div class="line"><div class="jp"><span class="mk">🌱</span>${esc(s.jp)}`+
                  (s.kana?` <span class="kana-inline">（${esc(s.kana)}）</span>`:``)+`</div></div>`;
    case 'table':{let h=`<div class="tbl-wrap"><table><thead><tr>`;
      s.head.forEach(c=>h+=`<th>${esc(c)}</th>`);h+=`</tr></thead><tbody>`;
      s.rows.forEach(r=>{h+=`<tr>`;r.forEach(c=>h+=`<td>${esc(c)}</td>`);h+=`</tr>`;});
      return h+`</tbody></table></div>`;}
    default:return '';
  }
}

// 建立索引：把每天每個可搜尋區塊攤平成 {dayIdx,date,jp,kana,zh,raw}
const INDEX=[];
DATA.forEach((d,di)=>{
  d.sections.forEach(s=>{
    if(s.t==='ex'||s.t==='line'){
      INDEX.push({di,date:d.date,jp:s.jp||'',kana:s.kana||'',zh:s.zh||''});
    }else if(s.t==='table'){
      s.rows.forEach(r=>INDEX.push({di,date:d.date,jp:r.join(' / '),kana:'',zh:''}));
    }else if(['note','poem','sub','warn','lead'].includes(s.t)){
      INDEX.push({di,date:d.date,jp:s.text||'',kana:'',zh:''});
    }
  });
});
// 歌詞也納入索引
LYRICS.verses.forEach(v=>v.lines.forEach(ln=>{
  INDEX.push({di:-1,date:'🎵 歌詞',jp:ln.jp,kana:ln.kana,zh:ln.zh});
}));

function hl(text,q){
  if(!q) return esc(text);
  const t=esc(text);const ql=q.toLowerCase();
  const idx=t.toLowerCase().indexOf(ql);
  if(idx<0) return t;
  return t.slice(0,idx)+'<span class="hl-mark">'+t.slice(idx,idx+q.length)+'</span>'+t.slice(idx+q.length);
}
function runSearch(q){
  q=q.trim();
  document.getElementById('searchClear').classList.toggle('show',q.length>0);
  if(!q){renderActive();return;}
  const ql=q.toLowerCase();
  const hits=INDEX.filter(r=>
    r.jp.toLowerCase().includes(ql)||r.kana.toLowerCase().includes(ql)||r.zh.toLowerCase().includes(ql));
  // 取消分頁高亮
  document.querySelectorAll('.day-btn').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false');});
  const el=document.getElementById('lesson');
  if(hits.length===0){
    el.innerHTML=`<div class="no-result"><span class="big">🌸</span>找不到「${esc(q)}」<br><span style="font-size:12px">換個關鍵字試試，日文／假名／中文都可以搜</span></div>`;
    return;
  }
  // 依天分組
  const groups={};hits.forEach(h=>{(groups[h.date]=groups[h.date]||[]).push(h);});
  let html=`<div class="results-summary">🔍 找到 ${hits.length} 筆「${esc(q)}」的結果</div>`;
  Object.keys(groups).forEach(date=>{
    const arr=groups[date];const di=arr[0].di;
    html+=`<div class="result-group">`+
      `<button class="result-day" data-di="${di}">🌸 ${esc(date)}（${arr.length}）</button>`;
    arr.forEach(r=>{
      html+=`<div class="ex"><div class="jp"><span class="mk">🌷</span>${hl(r.jp,q)}</div>`+
        (r.kana?`<div class="kana">${hl(r.kana,q)}</div>`:``)+
        (r.zh?`<div class="zh">${hl(r.zh,q)}</div>`:``)+`</div>`;
    });
    html+=`</div>`;
  });
  el.innerHTML=html;
  // 點分組標題 → 跳到該天完整內容
  el.querySelectorAll('.result-day').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const di=Number(btn.dataset.di);
      document.getElementById('searchInput').value='';
      document.getElementById('searchClear').classList.remove('show');
      if(di<0) renderLyrics(); else renderDay(di);
      scrollToContent();
    });
  });
}

function renderActive(){ if(activeView.kind==='lyric') renderLyrics(); else renderDay(activeView.idx); }

})();
