面，歌詞讀這個）／あらの（訓讀）。象徵孤獨、嚴酷、未知的前路。"}, {"t": "ex", "jp": "荒野に立つ。", "kana": "こうやにたつ。", "zh": "站在荒野上。"}, {"t": "ex", "jp": "荒野を歩く。", "kana": "こうやをあるく。", "zh": "走過荒野。"}, {"t": "ex", "jp": "荒野に向かう道。", "kana": "こうやにむかうみち。", "zh": "通往荒野的道路。"}, {"t": "h", "text": "十一、向かう（朝向、前往）"}, {"t": "note", "text": "向かう（むかう）＝朝向、前往、面對（自動詞）。句型：場所に向かう＝朝某地前進。"}, {"t": "ex", "jp": "駅に向かう。", "kana": "えきにむかう。", "zh": "往車站去。"}, {"t": "ex", "jp": "未来に向かう。", "kana": "みらいにむかう。", "zh": "邁向未來。"}, {"t": "ex", "jp": "荒野に向かう道。", "kana": "こうやにむかうみち。", "zh": "通往荒野的道路（動詞連體修飾名詞「道」）。"}, {"t": "note", "text": "「荒野に向かう」整段修飾後面的「道」＝朝荒野而去的那條路。"}, {"t": "h", "text": "十二、より（比較・起點・限定）"}, {"t": "note", "text": "より 多種用法：① 比較「A より B」＝比起 A；② 起點「〜より」＝從…（＝から，文語）；③ 這裡是「〜より他に…なし」＝除了…之外沒有別的。"}, {"t": "sub", "text": "用法①：比較"}, {"t": "ex", "jp": "りんごよりみかんが好きだ。", "kana": "りんごよりみかんがすきだ。", "zh": "比起蘋果更喜歡橘子。"}, {"t": "sub", "text": "用法②：起點（文語＝から）"}, {"t": "ex", "jp": "東京より参りました。", "kana": "とうきょうよりまいりました。", "zh": "我從東京來的（文語、鄭重）。"}, {"t": "sub", "text": "用法③：〜より他に〜なし（除了…以外沒有）"}, {"t": "ex", "jp": "この道より他に道はない。", "kana": "このみちよりほかにみちはない。", "zh": "除了這條路以外，沒有別的路。"}, {"t": "ex", "jp": "君より他に頼る人はいない。", "kana": "きみよりほかにたよるひとはいない。", "zh": "除了你以外，沒有可以依靠的人。"}, {"t": "h", "text": "十三、他（ほか）"}, {"t": "note", "text": "他（ほか）＝其他、別的。他に＝除此之外、另外。"}, {"t": "ex", "jp": "他に方法はない。", "kana": "ほかにほうほうはない。", "zh": "沒有其他方法。"}, {"t": "ex", "jp": "他に見えるものはない。", "kana": "ほかにみえるものはない。", "zh": "看不見其他東西。"}, {"t": "h", "text": "十四、ものはなし（＝ものはない）"}, {"t": "note", "text": "もの＝東西、事物；なし＝ない 的文語。ものはなし＝沒有（那樣的）東西。全句以文語否定莊重收尾，呼應開頭的「見えず」。"}, {"t": "table", "head": ["口語", "文語", "中文"], "rows": [["見えるものはない", "見えるものはなし", "沒有看得見的東西"], ["言うことはない", "言うことはなし", "沒有要說的話"]]}, {"t": "ex", "jp": "見えるものはなし。", "kana": "みえるものはなし。", "zh": "沒有能看見的東西（文語）。"}, {"t": "h", "text": "十五、第一段文語 vs 口語對照"}, {"t": "table", "head": ["文語（歌詞）", "口語（現代）", "中文"], "rows": [["何も見えず", "何も見えない", "什麼也看不見"], ["哀しくて", "悲しくて", "悲傷得…"], ["目を開ければ", "目を開けたら", "睜開眼睛的話"], ["〜より他に", "〜のほかに", "除了…之外"], ["ものはなし", "ものはない", "沒有那樣的東西"]]}, {"t": "h", "text": "十六、第一段完整理解"}, {"t": "poem", "text": "目を閉じて 何も見えず 哀しくて 目を開ければ 荒野に向かう道より 他に見えるものはなし：閉上眼，眼前一片黑，什麼都看不見；正因太過悲傷而睜開眼，映入眼中的，卻只有一條通往荒野的路，除此之外什麼也看不見。閉眼是逃避、睜眼是現實，兩邊都只剩孤獨與前方未知的荒野——這正是「昴」開場那份蒼涼與決絕。"}]}];

// 昴歌詞 HTML
function subaruLyricsHTML(){
  let html=`<div class="subaru-credit" style="border:none;padding:0;margin:0 0 16px">作詞・作曲：谷村新司　｜　中譯：katoxicapture</div>`;
  SUBARU.forEach(l=>{
    html+=`<div class="sb-block${l.r?' sb-refrain':''}">`+
      `<div class="sb-jp">${l.jp}</div>`+
      `<div class="sb-zh">${esc(l.zh)}</div></div>`;
  });
  return html;
}
// 昴：目前顯示狀態
let subaruView={kind:'lyric',idx:0};
function subaruRenderLyrics(){
  subaruView={kind:'lyric',idx:0};
  document.getElementById('subaruContent').innerHTML=subaruLyricsHTML();
  markSubaruActive();
}
function subaruRenderDay(idx){
  subaruView={kind:'day',idx};
  const d=SUBARU_DAYS[idx];let secNo=0;
  let html=`<div class="lesson-head"><span class="lesson-date">${esc(d.date)}</span>`+
    `<span class="lesson-title">${esc(d.title)}</span></div>`+
    `<div class="lesson-sub">${esc(d.subtitle)}</div>`+
    `<div class="lesson-meta">✨ 共 ${d.sections.filter(s=>s.t==='h').length} 個主題 ・ ${countItemsG(d)} 個例句／詞條</div>`;
  d.sections.forEach(s=>{if(s.t==='h'){secNo++;html+=renderSection(s,CN_NUM[secNo]||secNo);}else html+=renderSection(s);});
  document.getElementById('subaruContent').innerHTML=html;
  markSubaruActive();
}
function markSubaruActive(){
  document.querySelectorAll('#subaruNav .day-btn').forEach(b=>{
    let on=false;
    if(b.dataset.kind==='lyric') on=subaruView.kind==='lyric';
    else on=subaruView.kind==='day'&&Number(b.dataset.idx)===subaruView.idx;
    b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false');});
}
function countItemsG(d){return d.sections.filter(s=>['ex','line'].includes(s.t)).length
  + d.sections.filter(s=>s.t==='table').reduce((a,s)=>a+s.rows.length,0);}

// 建昴分頁列
(function(){
  const nav=document.getElementById('subaruNav');
  const lb=document.createElement('button');lb.className='day-btn';lb.setAttribute('role','tab');
  lb.dataset.kind='lyric';
  lb.innerHTML=`<span class="flower">🎵</span><span class="d-date">歌詞</span>`+
    `<span class="d-title">昴 -すばる-</span><span class="d-count">中日對照</span>`;
  lb.addEventListener('click',()=>{subaruRenderLyrics();subaruScroll();});
  nav.appendChild(lb);
  SUBARU_DAYS.forEach((d,i)=>{
    const b=document.createElement('button');b.className='day-btn';b.setAttribute('role','tab');
    b.dataset.kind='day';b.dataset.idx=i;
    b.innerHTML=`<span class="flower">✨</span><span class="d-date">${esc(d.date)}</span>`+
      `<span class="d-title">${esc(d.title)}</span><span class="d-count">${countItemsG(d)} 句</span>`;
    b.addEventListener('click',()=>{subaruRenderDay(i);subaruScroll();});
    nav.appendChild(b);
  });
  subaruRenderLyrics();
})();
function subaruScroll(){
  const top=document.getElementById('subaruNav').getBoundingClientRect().bottom+window.scrollY-8;
  window.scrollTo({top,behavior:'smooth'});
}

// 昴搜尋
const SUBARU_INDEX=[];
SUBARU_DAYS.forEach((d,di)=>{
  d.sections.forEach(s=>{
    if(s.t==='ex'||s.t==='line') SUBARU_INDEX.push({di,date:d.date,jp:s.jp||'',kana:s.kana||'',zh:s.zh||''});
    else if(s.t==='table') s.rows.forEach(r=>SUBARU_INDEX.push({di,date:d.date,jp:r.join(' / '),kana:'',zh:''}));
    else if(['note','poem','sub','warn','lead'].includes(s.t)) SUBARU_INDEX.push({di,date:d.date,jp:s.text||'',kana:'',zh:''});
  });
});
function subaruRunSearch(q){
  q=q.trim();
  document.getElementById('subaruSearchClear').classList.toggle('show',q.length>0);
  if(!q){ if(subaruView.kind==='lyric') subaruRenderLyrics(); else subaruRenderDay(subaruView.idx); return; }
  const ql=q.toLowerCase();
  const hits=SUBARU_INDEX.filter(r=>r.jp.toLowerCase().includes(ql)||r.kana.toLowerCase().includes(ql)||r.zh.toLowerCase().includes(ql));
  document.querySelectorAll('#subaruNav .day-btn').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false');});
  const el=document.getElementById('subaruContent');
  if(hits.length===0){el.innerHTML=`<div class="no-result"><span class="big">✨</span>找不到「${esc(q)}」<br><span style="font-size:12px">換個關鍵字試試</span></div>`;return;}
  const groups={};hits.forEach(h=>{(groups[h.date]=groups[h.date]||[]).push(h);});
  let html=`<div class="results-summary">🔍 找到 ${hits.length} 筆「${esc(q)}」的結果</div>`;
  Object.keys(groups).forEach(date=>{
    const arr=groups[date];const di=arr[0].di;
    html+=`<div class="result-group"><button class="result-day" data-di="${di}">✨ ${esc(date)}（${arr.length}）</button>`;
    arr.forEach(r=>{html+=`<div class="ex"><div class="jp"><span class="mk">✨</span>${hl(r.jp,q)}</div>`+
      (r.kana?`<div class="kana">${hl(r.kana,q)}</div>`:``)+(r.zh?`<div class="zh">${hl(r.zh,q)}</div>`:``)+`</div>`;});
    html+=`</div>`;
  });
  el.innerHTML=html;
  el.querySelectorAll('.result-day').forEach(btn=>btn.addEventListener('click',()=>{
    document.getElementById('subaruSearch').value='';document.getElementById('subaruSearchClear').classList.remove('show');
    subaruRenderDay(Number(btn.dataset.di));subaruScroll();}));
}
(function(){
  const inp=document.getElementById('subaruSearch');const clr=document.getElementById('subaruSearchClear');
  let t=null;
  inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>subaruRunSearch(inp.value),120);});
  clr.addEventListener('click',()=>{inp.value='';clr.classList.remove('show');
    if(subaruView.kind==='lyric') subaruRenderLyrics(); else subaruRenderDay(subaruView.idx); inp.focus();});
})();

(function(){
  const inp=document.getElementById('maigoSearch');const clr=document.getElementById('maigoSearchClear');
  let t=null;
  function run(q){
    q=q.trim();clr.classList.toggle('show',q.length>0);
    if(!q){ if(maigoView.kind==='lyric') maigoRenderLyrics(); else maigoRenderDay(maigoView.idx); return; }
    const ql=q.toLowerCase();
    const hits=MAIGO_INDEX.filter(r=>r.jp.toLowerCase().includes(ql)||(r.kana||'').toLowerCase().includes(ql)||r.zh.toLowerCase().includes(ql));
    document.querySelectorAll('#maigoNav .day-btn').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false');});
    const el=document.getElementById('maigoContent');
    if(hits.length===0){el.innerHTML=`<div class="no-result"><span class="big">🍃</span>找不到「${esc(q)}」</div>`;return;}
    const groups={};hits.forEach(h=>{(groups[h.date]=groups[h.date]||[]).push(h);});
    let html=`<div class="results-summary">🔍 找到 ${hits.length} 筆「${esc(q)}」的結果</div>`;
    Object.keys(groups).forEach(date=>{
      const arr=groups[date];const di=arr[0].di;
      html+=`<div class="result-group"><button class="result-day" data-di="${di}">🍃 ${esc(date)}（${arr.length}）</button>`;
      arr.forEach(r=>{
        if(r.ruby){ html+=`<div class="sb-block"><div class="sb-jp">${r.ruby}</div><div class="sb-zh">${hl(r.zh,q)}</div></div>`; }
        else{ html+=`<div class="ex"><div class="jp"><span class="mk">🍃</span>${hl(r.jp,q)}</div>`+
          (r.kana?`<div class="kana">${hl(r.kana,q)}</div>`:``)+(r.zh?`<div class="zh">${hl(r.zh,q)}</div>`:``)+`</div>`; }
      });
      html+=`</div>`;
    });
    el.innerHTML=html;
    el.querySelectorAll('.result-day').forEach(btn=>btn.addEventListener('click',()=>{
      inp.value='';clr.classList.remove('show');
      const di=Number(btn.dataset.di);
      if(di<0) maigoRenderLyrics(); else maigoRenderDay(di);
      maigoScroll();}));
  }
  inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>run(inp.value),120);});
  clr.addEventListener('click',()=>{inp.value='';clr.classList.remove('show');

})();

  {jp:`${R('走','はし')}って${R('行','い')}く${R('先','さき')}に${R('君','きみ')}はいた`,zh:"你就在我奔跑的前方"},
  {jp:`${R('触','ふ')}れた${R('心','こころ')}は${R('輝','かがや')}いた　${R('鮮','あざ')}やかな${R('色','いろ')}になって`,zh:"觸碰到的心閃耀著，化作絢麗的色彩",r:1},
  {jp:`${R('羽','は')}ばたくよ　${R('希望','きぼう')}${R('乗','の')}せて`,zh:"振翅高飛吧，載著希望",r:1},
  {jp:`${R('無限','むげん')}に${R('広','ひろ')}がる${R('空','そら')}の${R('下','した')}${R('集','あつ')}まった`,zh:"在無限寬廣的天空下匯聚",r:1},
  {jp:`${R('願','ねが')}い${R('守','まも')}り${R('行','い')}けば`,zh:"若守護著願望前行",r:1},
  {jp:`${R('君','きみ')}と${R('誓','ちか')}ったあの${R('日','ひ')}の${R('記憶','きおく')}`,zh:"與你立下誓言的那一天的記憶",r:1},
  {jp:`${R('今','いま')}${R('超','こ')}えて${R('過去','かこ')}から`,zh:"從過去超越現在",r:1},
  {jp:`まだ${R('誰','だれ')}も${R('知','し')}らない${R('明日','あす')}へと`,zh:"朝向還沒有人知道的明天",r:1},
];
function colorLyricsHTML(){
  let html=`<div class="subaru-credit" style="border:none;padding:0;margin:0 0 16px">魔法少女まどか☆マギカ〔叛逆の物語〕挿入歌　｜　唄：ClariS　｜　作詞・作曲：渡辺翔　｜　編曲：湯浅篤</div>`;
  COLOR_LYRICS.forEach(l=>{
    html+=`<div class="sb-block${l.r?' sb-refrain':''}">`+
      `<div class="sb-jp">${l.jp}</div>`+
      `<div class="sb-zh">${esc(l.zh)}</div></div>`;
  });
  return html;
}
function colorRenderLyrics(){
  document.getElementById('colorContent').innerHTML=colorLyricsHTML();
  document.querySelectorAll('#colorNav .day-btn').forEach(b=>{
    const on=b.dataset.kind==='lyric';b.classList.toggle('active',on);b.setAttribute('aria-selected',on?'true':'false');});
}
(function(){
  const nav=document.getElementById('colorNav');
  const lb=document.createElement('button');lb.className='day-btn';lb.setAttribute('role','tab');
  lb.dataset.kind='lyric';
  lb.innerHTML=`<span class="flower">🎵</span><span class="d-date">歌詞</span>`+
    `<span class="d-title">カラフル</span><span class="d-count">中日對照</span>`;
  lb.addEventListener('click',()=>{colorRenderLyrics();
    const top=nav.getBoundingClientRect().bottom+window.scrollY-8;window.scrollTo({top,behavior:'smooth'});});
  nav.appendChild(lb);
  colorRenderLyrics();
})();
// カラフル搜尋（目前只有歌詞）
(function(){
  const inp=document.getElementById('colorSearch');const clr=document.getElementById('colorSearchClear');
  let t=null;
  function run(q){
    q=q.trim();clr.classList.toggle('show',q.length>0);
    if(!q){colorRenderLyrics();return;}
    const ql=q.toLowerCase();
    const hits=COLOR_LYRICS.filter(l=>l.jp.replace(/<[^>]+>/g,'').toLowerCase().includes(ql)||l.zh.toLowerCase().includes(ql));
    document.querySelectorAll('#colorNav .day-btn').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-selected','false');});
    const el=document.getElementById('colorContent');
    if(hits.length===0){el.innerHTML=`<div class="no-result"><span class="big">🌈</span>找不到「${esc(q)}」</div>`;return;}
    let html=`<div class="results-summary">🔍 找到 ${hits.length} 筆「${esc(q)}」的結果</div>`;
    hits.forEach(l=>{html+=`<div class="sb-block${l.r?' sb-refrain':''}"><div class="sb-jp">${l.jp}</div><div class="sb-zh">${esc(l.zh)}</div></div>`;});
    el.innerHTML=html;
  }
  inp.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>run(inp.value),120);});
  clr.addEventListener('click',()=>{inp.value='';clr.classList.remove('show');colorRenderLyrics();inp.focus();});
})();

/* ===== 歌曲大頁籤切換 ===== */
(function(){
  const panes={subaru:document.getElementById('paneSubaru'),
    kuchi:document.getElementById('paneKuchi'),
    maigo:document.getElementById('paneMaigo'),
    color:document.getElementById('paneColor')};
  const btns={subaru:document.getElementById('songBtnSubaru'),
    kuchi:document.getElementById('songBtnKuchi'),
    maigo:document.getElementById('songBtnMaigo'),
    color:document.getElementById('songBtnColor')};
  function show(song){
    Object.keys(panes).forEach(k=>{
      const on=k===song;
      panes[k].hidden=!on;
      btns[k].classList.toggle('active',on);
      btns[k].setAttribute('aria-selected',on?'true':'false');
    });
    window.scrollTo({top:0,behavior:'smooth'});
  }
  Object.keys(btns).forEach(k=>btns[k].addEventListener('click',()=>show(k)));
})();
</script>
